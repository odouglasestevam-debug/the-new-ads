<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agende sua reunião | The New Ads</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" rel="stylesheet">
<style>
  :root{
    --preto:#0A0A0A;
    --grafite:#171717;
    --grafite2:#212121;
    --ambar:#FF6A00;
    --ambar-glow:#FFA24D;
    --branco:#FAFAFA;
    --nevoa:#8A8A8A;
    --linha:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--preto);
    color:var(--branco);
    font-family:'Switzer','Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:520px;
    background:var(--grafite);
    border:1px solid var(--linha);
    padding:40px;
  }
  h1{
    font-family:'Clash Display','Space Grotesk',system-ui,sans-serif;
    font-weight:600;
    font-size:1.6rem;
    margin-bottom:8px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--nevoa);
    font-size:.95rem;
    margin-bottom:28px;
  }
  .dias{
    display:grid;
    gap:20px;
  }
  .dia-label{
    font-family:'Clash Display','Space Grotesk',system-ui,sans-serif;
    font-weight:600;
    font-size:.85rem;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--nevoa);
    margin-bottom:10px;
  }
  .horarios{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .slot-btn{
    flex:1;
    min-width:110px;
    background:var(--grafite2);
    border:1px solid var(--linha);
    color:var(--branco);
    font-family:'Switzer',system-ui,sans-serif;
    font-weight:500;
    font-size:.95rem;
    padding:14px 12px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .slot-btn:hover{
    border-color:var(--ambar);
    background:#262626;
  }
  .slot-btn.selected{
    background:var(--ambar);
    color:#0A0A0A;
    border-color:var(--ambar);
    font-weight:600;
  }
  .form{
    display:none;
    margin-top:28px;
    border-top:1px solid var(--linha);
    padding-top:24px;
  }
  .form.ativo{ display:block; }
  .field{ margin-bottom:14px; }
  label{
    display:block;
    font-size:.82rem;
    color:var(--nevoa);
    margin-bottom:6px;
  }
  input{
    width:100%;
    background:var(--grafite2);
    border:1px solid var(--linha);
    color:var(--branco);
    padding:12px 14px;
    font-family:'Switzer',system-ui,sans-serif;
    font-size:.95rem;
  }
  input:focus{ outline:none; border-color:var(--ambar); }
  .btn{
    width:100%;
    background:var(--ambar);
    color:#0A0A0A;
    border:none;
    font-family:'Switzer',system-ui,sans-serif;
    font-weight:600;
    font-size:1rem;
    padding:15px;
    cursor:pointer;
    box-shadow:0 8px 30px rgba(255,106,0,.28);
    margin-top:6px;
    transition:background .15s;
  }
  .btn:hover{ background:var(--ambar-glow); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
  .msg{
    font-size:.85rem;
    margin-top:12px;
    color:var(--nevoa);
  }
  .msg.erro{ color:#FF6A6A; }
  .sucesso{ text-align:center; padding:20px 0; }
  .sucesso h2{
    font-family:'Clash Display','Space Grotesk',system-ui,sans-serif;
    color:var(--ambar);
    font-size:1.4rem;
    margin-bottom:10px;
  }
  .sucesso p{ color:var(--nevoa); font-size:.95rem; line-height:1.5; }
  .loading{ color:var(--nevoa); font-size:.9rem; }
</style>
</head>
<body>

<div class="card" id="card">
  <h1>Escolha o melhor horário</h1>
  <p class="sub">Reunião de 1 hora, com Douglas, direto no Google Meet.</p>

  <div id="conteudo">
    <p class="loading">Carregando horários disponíveis...</p>
  </div>
</div>

<script>
  window.dataLayer = window.dataLayer || [];

  const API_SLOTS = "/api/slots";
  const API_BOOK = "/api/book";

  const params = new URLSearchParams(window.location.search);
  const leadNome = params.get("nome") || "";
  const leadEmail = params.get("email") || "";
  const leadTelefone = params.get("telefone") || "";

  let slotEscolhido = null;

  function formatarData(iso) {
    const d = new Date(iso + "T00:00:00-03:00");
    return d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });
  }

  function formatarHora(iso) {
    return new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });
  }

  async function carregarSlots() {
    const conteudo = document.getElementById("conteudo");
    try {
      const res = await fetch(API_SLOTS);
      const data = await res.json();

      if (!data.days || data.days.length === 0) {
        conteudo.innerHTML = '<p class="msg erro">Nenhum horário disponível nos próximos dias. Tenta de novo mais tarde.</p>';
        return;
      }

      dataLayer.push({ event: "scheduler_view", scheduler_days: data.days.map(d => d.date) });

      let html = '<div class="dias">';
      data.days.forEach((dia) => {
        html += `<div><div class="dia-label">${formatarData(dia.date)}</div><div class="horarios">`;
        dia.slots.forEach((slot) => {
          html += `<button class="slot-btn" data-start="${slot.start}" data-end="${slot.end}">${formatarHora(slot.start)}</button>`;
        });
        html += `</div></div>`;
      });
      html += '</div>';

      html += `
        <form class="form" id="form-agendamento">
          <div class="field">
            <label for="nome">Nome</label>
            <input type="text" id="nome" required value="${leadNome}">
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" required value="${leadEmail}">
          </div>
          <div class="field">
            <label for="telefone">WhatsApp</label>
            <input type="tel" id="telefone" value="${leadTelefone}">
          </div>
          <button type="submit" class="btn" id="btn-confirmar">Confirmar reunião</button>
          <p class="msg" id="msg"></p>
        </form>
      `;

      conteudo.innerHTML = html;
      ligarEventos();
    } catch (err) {
      conteudo.innerHTML = '<p class="msg erro">Erro ao carregar horários. Recarrega a página.</p>';
    }
  }

  function ligarEventos() {
    document.querySelectorAll(".slot-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".slot-btn").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        slotEscolhido = { start: btn.dataset.start, end: btn.dataset.end };

        dataLayer.push({
          event: "scheduler_slot_selected",
          scheduler_slot_start: slotEscolhido.start,
        });

        document.getElementById("form-agendamento").classList.add("ativo");
        document.getElementById("form-agendamento").scrollIntoView({ behavior: "smooth", block: "end" });
      });
    });

    document.getElementById("form-agendamento").addEventListener("submit", confirmarAgendamento);
  }

  async function confirmarAgendamento(e) {
    e.preventDefault();
    if (!slotEscolhido) return;

    const btn = document.getElementById("btn-confirmar");
    const msg = document.getElementById("msg");
    btn.disabled = true;
    btn.textContent = "Agendando...";
    msg.textContent = "";
    msg.classList.remove("erro");

    const payload = {
      name: document.getElementById("nome").value,
      email: document.getElementById("email").value,
      phone: document.getElementById("telefone").value,
      start: slotEscolhido.start,
      end: slotEscolhido.end,
    };

    try {
      const res = await fetch(API_BOOK, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!res.ok) {
        if (res.status === 409) {
          msg.textContent = "Esse horário acabou de ser ocupado. Recarrega a página e escolhe outro.";
        } else {
          msg.textContent = "Não deu pra agendar agora. Tenta de novo em instantes.";
        }
        msg.classList.add("erro");
        btn.disabled = false;
        btn.textContent = "Confirmar reunião";
        return;
      }

      dataLayer.push({
        event: "scheduler_booking_confirmed",
        scheduler_slot_start: payload.start,
        scheduler_lead_email: payload.email,
      });

      document.getElementById("card").innerHTML = `
        <div class="sucesso">
          <h2>Reunião confirmada</h2>
          <p>Você vai receber o convite no e-mail <strong>${payload.email}</strong> com o link do Google Meet.</p>
        </div>
      `;
    } catch (err) {
      msg.textContent = "Erro de conexão. Tenta de novo.";
      msg.classList.add("erro");
      btn.disabled = false;
      btn.textContent = "Confirmar reunião";
    }
  }

  carregarSlots();
</script>

</body>
</html>
