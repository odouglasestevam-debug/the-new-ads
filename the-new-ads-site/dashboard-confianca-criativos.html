<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grupo Confiança — Criativos Ativos</title>
<link rel="icon" href="https://thenewads.com.br/marca/logo-PNG/tna-favicon.png" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0A0A0A;
    --surface:#171717;
    --surface2:#212121;
    --amber:#FF6A00;
    --ink:#FAFAFA;
    --muted:#8A8A8A;
    --line:rgba(255,255,255,.09);
    --ok:#3DDC84;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Switzer','Inter',system-ui,sans-serif;
    padding:24px;
    min-height:100vh;
  }
  .wrap{max-width:1160px;margin:0 auto;}
  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    flex-wrap:wrap;gap:16px;
    padding-bottom:20px;margin-bottom:28px;
    border-bottom:1px solid var(--line);
  }
  h1{
    font-family:'Clash Display','Space Grotesk',system-ui,sans-serif;
    font-weight:600;
    font-size:clamp(22px,3vw,32px);
    letter-spacing:-0.5%;
  }
  .sub{color:var(--muted);font-size:13px;margin-top:4px;}
  .updated{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--muted);
    text-align:right;
  }
  .updated b{color:var(--amber);}

  .loading, .empty{
    color:var(--muted);font-size:13px;padding:40px 0;text-align:center;
  }

  .campanha-group{ margin-bottom:32px; }
  .campanha-group:last-child{ margin-bottom:0; }
  .campanha-head{
    display:flex; align-items:baseline; gap:10px;
    margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .campanha-nome{
    font-family:'JetBrains Mono',monospace;
    font-size:12px; font-weight:600; letter-spacing:.02em;
    color:var(--ink); word-break:break-word;
  }
  .campanha-count{ font-size:11px; color:var(--muted); white-space:nowrap; }

  .creative-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  @media (max-width:900px){ .creative-grid{ grid-template-columns:repeat(3, 1fr); } }
  @media (max-width:560px){ .creative-grid{ grid-template-columns:repeat(2, 1fr); } }

  .creative-card{ background:var(--surface); display:flex; flex-direction:column; }
  .creative-media{
    position:relative; display:block; width:100%; aspect-ratio:4/5;
    background:var(--surface2); overflow:hidden; border:0; padding:0; cursor:pointer;
  }
  .creative-media:focus-visible{ outline:2px solid var(--amber); outline-offset:-2px; }
  .creative-media img{
    width:100%; height:100%; object-fit:cover; display:block;
    transition:transform .25s ease, filter .25s ease;
  }
  .creative-media:hover img, .creative-media:focus-visible img{
    transform:scale(1.04); filter:brightness(.7);
  }
  .creative-open{
    position:absolute; inset:auto 0 0 0; text-align:center; padding:8px 6px;
    font-size:10.5px; font-weight:700; letter-spacing:.02em; color:#FAFAFA;
    background:linear-gradient(0deg, rgba(10,10,10,.85), rgba(10,10,10,0));
    opacity:0; transform:translateY(4px); transition:opacity .2s ease, transform .2s ease;
  }
  .creative-media:hover .creative-open, .creative-media:focus-visible .creative-open{
    opacity:1; transform:translateY(0);
  }
  @media (hover:none){ .creative-open{ opacity:1; transform:none; background:rgba(10,10,10,.65); } }

  .creative-status{
    position:absolute; top:8px; right:8px; font-size:9.5px; letter-spacing:.04em;
    text-transform:uppercase; font-weight:700; padding:2px 6px;
    background:rgba(10,10,10,.55); color:#FAFAFA;
    display:flex; align-items:center; gap:4px;
  }
  .creative-status::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--ok); display:inline-block; }

  .creative-body{ padding:12px 12px 14px; }
  .creative-name{
    font-size:10.5px; font-weight:600; letter-spacing:-0.01em; margin:0 0 4px;
    word-break:break-word; line-height:1.3; color:var(--ink);
  }
  .creative-sub{ font-size:10px; color:var(--muted); line-height:1.4; }

  footer{
    margin-top:40px; padding-top:20px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
    font-size:12px; color:var(--muted);
  }

  /* lightbox */
  .lightbox{
    position:fixed; inset:0; background:rgba(10,10,10,.92); z-index:50;
    display:none; align-items:center; justify-content:center; padding:32px;
  }
  .lightbox[data-open="true"]{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; display:block; }
  .lightbox-close{
    position:absolute; top:20px; right:24px; background:var(--surface);
    border:1px solid var(--line); color:var(--ink); font-size:13px;
    padding:8px 14px; cursor:pointer; font-family:'Switzer';
  }
  .lightbox-close:hover{ border-color:rgba(255,255,255,.3); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Grupo Confiança — Criativos ativos</h1>
      <p class="sub">Anúncios em veiculação no momento, atualizado automaticamente a cada visita</p>
    </div>
    <div class="updated" id="updated">carregando…</div>
  </header>

  <div id="grid" class="loading">Carregando criativos…</div>

  <footer>
    <span>The New Ads</span>
    <span>Dados gerados automaticamente a partir do Meta Ads</span>
  </footer>
</div>

<div class="lightbox" id="lightbox" data-open="false">
  <button class="lightbox-close" id="lightbox-close">Fechar ✕</button>
  <img id="lightbox-img" src="" alt="" />
</div>

<script>
const sb = window.supabase.createClient(
  'https://iklynyncffneuvutvgxa.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlrbHlueW5jZmZuZXV2dXR2Z3hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzA3NDUsImV4cCI6MjA5NzYwNjc0NX0.-vIteLhTDir-PeOrVzeGt7TdG05cYLMMJXmePauhdy4'
);

function fmtDateTime() {
  return new Date().toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function openLightbox(url, alt) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox-img').alt = alt || '';
  document.getElementById('lightbox').setAttribute('data-open', 'true');
}
function closeLightbox() {
  document.getElementById('lightbox').setAttribute('data-open', 'false');
  document.getElementById('lightbox-img').src = '';
}
document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') closeLightbox();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
});

async function loadCriativosAtivos() {
  const grid = document.getElementById('grid');

  const { data, error } = await sb
    .from('criativos_ativos')
    .select('id,campanha,conjunto_anuncio,anuncio,url_anuncio,updated_at')
    .eq('cliente', 'grupo-confianca')
    .order('campanha', { ascending: true })
    .order('anuncio', { ascending: true });

  if (error) {
    grid.className = 'empty';
    grid.innerHTML = 'Sem dados de criativos no momento.';
    document.getElementById('updated').innerHTML = `Atualizado em <b>${fmtDateTime()}</b>`;
    return;
  }

  const criativos = (data || []).filter((r) => r.url_anuncio);

  if (criativos.length === 0) {
    grid.className = 'empty';
    grid.innerHTML = 'Nenhum criativo ativo encontrado no período mais recente.';
  } else {
    const porCampanha = new Map();
    for (const c of criativos) {
      const nome = c.campanha || 'Sem campanha';
      if (!porCampanha.has(nome)) porCampanha.set(nome, []);
      porCampanha.get(nome).push(c);
    }

    grid.className = '';
    grid.innerHTML = [...porCampanha.entries()].map(([campanha, itens]) => `
      <div class="campanha-group">
        <div class="campanha-head">
          <span class="campanha-nome">${campanha}</span>
          <span class="campanha-count">${itens.length} criativo${itens.length === 1 ? '' : 's'}</span>
        </div>
        <div class="creative-grid">
          ${itens.map((c) => `
            <div class="creative-card">
              <button class="creative-media" data-url="${c.url_anuncio}" data-alt="${(c.anuncio || '').replace(/"/g, '&quot;')}" aria-label="Expandir criativo ${c.anuncio || ''}">
                <img src="${c.url_anuncio}" alt="${c.anuncio || ''}" loading="lazy" />
                <span class="creative-status">Ativo</span>
                <span class="creative-open">Expandir ↗</span>
              </button>
              <div class="creative-body">
                <p class="creative-name">${c.anuncio || 'Sem nome'}</p>
                <p class="creative-sub">${c.conjunto_anuncio || ''}</p>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');

    grid.querySelectorAll('.creative-media').forEach((btn) => {
      btn.addEventListener('click', () => openLightbox(btn.dataset.url, btn.dataset.alt));
    });
  }

  document.getElementById('updated').innerHTML = `Atualizado em <b>${fmtDateTime()}</b>`;
}

loadCriativosAtivos();
</script>

</body>
</html>
