<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The New Ads — Funil</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="/funil/manifest.json">
<link rel="icon" type="image/svg+xml" href="/funil/icone.svg?v=2">
<link rel="apple-touch-icon" href="/funil/icons/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=switzer@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --preto:#0A0A0A; --grafite:#141414; --grafite-2:#1c1c1c; --nevoa:#8A8A8A;
    --branco:#FAFAFA; --ambar:#FF6A00; --linha:rgba(255,255,255,.09);
    --verde:#4ADE80; --vermelho:#F87171; --azul:#60A5FA;
    --display:'Clash Display',system-ui,sans-serif;
    --texto:'Switzer','Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',monospace;
    --sidebar:230px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--preto);color:var(--branco);font-family:var(--texto);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;line-height:1.15}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  a{color:inherit;text-decoration:none}

  /* ---------- login ---------- */
  .login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login .caixa{width:100%;max-width:380px}
  .login .marca{display:flex;align-items:center;gap:11px;font-family:var(--display);font-weight:600;font-size:20px;margin-bottom:30px}
  .login .marca svg{width:26px;height:26px}
  .login h1{font-size:26px;margin-bottom:8px}
  .login .sub{color:var(--nevoa);font-size:14.5px;margin-bottom:26px}
  .campo{margin-bottom:14px}
  .campo label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--nevoa);margin-bottom:7px}
  input[type=email],input[type=password],input[type=search],select,textarea{
    width:100%;background:var(--grafite);border:1px solid var(--linha);border-radius:9px;
    padding:13px 14px;color:var(--branco);font-size:15px;outline:none;transition:border-color .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--ambar)}
  .btn{background:var(--ambar);color:#0A0A0A;font-family:var(--display);font-weight:600;font-size:15px;
    padding:13px 20px;border:none;border-radius:9px;cursor:pointer;transition:opacity .15s}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-largo{width:100%}
  .btn-fantasma{background:transparent;color:var(--branco);border:1px solid var(--linha)}
  .btn-fantasma:hover{border-color:var(--ambar);opacity:1}
  .aviso{font-size:13.5px;margin-top:12px;min-height:18px;color:var(--nevoa)}
  .aviso.erro{color:var(--vermelho)}
  .aviso.ok{color:var(--verde)}

  /* ---------- estrutura ---------- */
  .app{display:none;min-height:100dvh}
  .app.ativo{display:flex}
  aside{
    width:var(--sidebar);flex:none;border-right:1px solid var(--linha);background:#0c0c0c;
    padding:22px 16px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100dvh}
  aside .marca{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:16px;padding:0 8px}
  aside .marca svg{width:22px;height:22px}
  nav{display:flex;flex-direction:column;gap:3px}
  nav button{
    display:flex;align-items:center;gap:11px;background:none;border:none;text-align:left;
    padding:11px 12px;border-radius:8px;color:var(--nevoa);font-size:14.5px;cursor:pointer;transition:all .15s;width:100%}
  nav button:hover{background:var(--grafite);color:var(--branco)}
  nav button.ativo{background:rgba(255,106,0,.1);color:var(--ambar);font-weight:500}
  nav button svg{width:17px;height:17px;flex:none}
  nav .contador{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--nevoa)}
  aside .rodape{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 4px}
  aside .usuario{font-family:var(--mono);font-size:11px;color:var(--nevoa);word-break:break-all}
  aside .sair{background:none;border:none;color:var(--nevoa);font-size:13px;cursor:pointer;text-align:left;padding:4px}
  aside .sair:hover{color:var(--branco)}

  main{flex:1;min-width:0;padding:30px 34px 90px}
  .topo{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
  .topo h1{font-size:27px}
  .topo .desc{color:var(--nevoa);font-size:14px;margin-top:6px}
  .ferramentas{display:flex;gap:10px;flex-wrap:wrap}
  .ferramentas input[type=search]{width:230px}
  .ferramentas select{width:auto;padding:11px 13px}

  /* ---------- lista ---------- */
  .tabela-caixa{border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:var(--grafite)}
  .rolagem{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:760px}
  th{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--nevoa);
    text-align:left;padding:13px 16px;border-bottom:1px solid var(--linha);font-weight:500;white-space:nowrap}
  td{padding:14px 16px;border-bottom:1px solid var(--linha);font-size:14px;vertical-align:top}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  .nome-cel{font-weight:600;color:var(--branco)}
  .utm.nicho{border-color:var(--ambar);color:var(--ambar)}
.utm.nicho i{color:var(--ambar);opacity:.75}
.campo-empresa{
  background:transparent;border:1px solid var(--linha);border-radius:6px;
  color:var(--branco);font:inherit;font-size:13px;padding:4px 8px;width:100%;max-width:240px;
  transition:border-color .15s ease,background .15s ease;
}
.campo-empresa:focus{outline:none;border-color:var(--ambar)}
.campo-empresa::placeholder{color:var(--nevoa)}
.campo-empresa.salvo{border-color:var(--verde);background:rgba(15,157,88,.10)}
.sub-cel{color:var(--nevoa);font-size:12.5px;margin-top:3px}
  .num{font-family:var(--mono);font-size:12.5px;color:var(--nevoa);white-space:nowrap}

  .selo{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid}
  .selo.sim{color:var(--verde);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.08)}
  .selo.nao{color:var(--nevoa);border-color:var(--linha);background:rgba(255,255,255,.03)}
  .selo.agendado{color:var(--azul);border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.08)}
  .selo.realizada{color:var(--verde);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.08)}
  .selo.no_show,.selo.cancelada{color:var(--vermelho);border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.08)}

  select.etapa-sel{padding:7px 10px;font-size:12.5px;border-radius:7px;background:var(--grafite-2);width:auto}

  /* ---------- agenda ---------- */
  .barra-agenda{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .nav-agenda{display:flex;gap:6px}
  .nav-agenda .mini{min-width:32px}
  .titulo-agenda{font-family:var(--display);font-weight:600;font-size:16px;flex:1;text-transform:capitalize}
  .modos{display:flex;gap:2px;background:var(--grafite);border:1px solid var(--linha);border-radius:8px;padding:3px}
  .modo{background:none;border:none;color:var(--nevoa);padding:7px 14px;border-radius:6px;font-size:13px;cursor:pointer}
  .modo:hover{color:var(--branco)}
  .modo.ativo{background:rgba(255,106,0,.14);color:var(--ambar);font-weight:500}

  .painel-agenda{border:1px solid var(--linha);border-radius:12px;background:var(--grafite);padding:16px;overflow-x:auto}

  /* Sem faixa lateral em compromisso comum: a marca so aparece quando
     significa algo, que aqui e "esse evento veio de um lead". */
  .ev{display:flex;gap:7px;align-items:baseline;background:var(--preto);border:1px solid var(--linha);
    border-radius:5px;padding:5px 7px;font-size:11.5px;overflow:hidden}
  .ev-hora{font-family:var(--mono);font-size:10px;color:var(--nevoa);flex:none}
  .ev-tit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dad5d0}
  .ev-lead{border-color:rgba(255,106,0,.35);cursor:pointer}
  .ev-lead:hover{background:rgba(255,106,0,.07)}

  .agenda-semana{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:8px;min-width:840px}
  .col-semana{background:var(--preto);border:1px solid var(--linha);border-radius:9px;overflow:hidden;min-height:210px}
  .col-semana.hoje{border-color:rgba(255,106,0,.45)}
  .cs-cabeca{display:flex;align-items:baseline;gap:7px;padding:9px 11px;border-bottom:1px solid var(--linha)}
  .cs-dia{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--nevoa)}
  .cs-num{font-family:var(--display);font-weight:600;font-size:15px}
  .col-semana.hoje .cs-num{color:var(--ambar)}
  .cs-corpo{padding:8px;display:flex;flex-direction:column;gap:6px}
  .cs-vazio{font-family:var(--mono);font-size:10.5px;color:#4b4b4b;text-align:center;padding:10px 0}

  .mes-cabeca{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;min-width:700px}
  .mes-cabeca span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--nevoa);text-align:center}
  .agenda-mes{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:700px}
  .cel-mes{background:var(--preto);border:1px solid var(--linha);border-radius:8px;padding:7px;min-height:92px;
    display:flex;flex-direction:column;gap:4px;cursor:pointer}
  .cel-mes:hover{border-color:rgba(255,255,255,.2)}
  .cel-mes.fora{opacity:.35}
  .cel-mes.hoje{border-color:rgba(255,106,0,.45)}
  .cm-num{font-family:var(--mono);font-size:11.5px;color:var(--nevoa)}
  .cel-mes.hoje .cm-num{color:var(--ambar)}
  .cm-mais{font-family:var(--mono);font-size:10px;color:var(--nevoa);padding-left:2px}

  .agenda-dia{display:flex;flex-direction:column;gap:10px}
  .linha-dia{display:grid;grid-template-columns:88px 1fr;gap:16px;background:var(--preto);border:1px solid var(--linha);
    border-radius:9px;padding:14px}
  .linha-dia.ev-lead{border-color:rgba(255,106,0,.35)}
  .ld-hora{font-family:var(--mono);font-size:13px;display:flex;flex-direction:column;gap:3px}
  .ld-hora span{color:var(--nevoa);font-size:11.5px}
  .ld-tit{font-weight:600;font-size:14.5px;margin-bottom:4px}
  .ld-sub{color:var(--nevoa);font-size:12.5px;word-break:break-all}
  .ld-acoes{display:flex;gap:8px;margin-top:11px}
  .ld-acoes .mini{text-decoration:none;display:inline-flex;align-items:center}

  @media(max-width:620px){
    .barra-agenda{gap:10px}
    .titulo-agenda{order:-1;width:100%;font-size:15px}
    .modo{padding:7px 11px;font-size:12px}
    .linha-dia{grid-template-columns:70px 1fr;gap:12px;padding:12px}
  }

  /* ---------- kanban ---------- */
  .kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
  .coluna{
    flex:0 0 320px;background:var(--grafite);border:1px solid var(--linha);border-radius:12px;
    display:flex;flex-direction:column;max-height:calc(100dvh - 190px)}
  .coluna.alvo{border-color:var(--ambar);background:rgba(255,106,0,.05)}
  .coluna .cabeca{padding:13px 15px;border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:9px}
  .coluna .ponto{width:7px;height:7px;border-radius:50%;flex:none}
  .coluna .titulo{font-family:var(--display);font-weight:600;font-size:13.5px}
  .coluna .qtd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--nevoa)}
  .coluna .corpo{padding:11px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
  .cartao{background:var(--preto);border:1px solid var(--linha);border-radius:10px;padding:14px;cursor:pointer;
    display:flex;flex-direction:column;gap:11px}
  .cartao:hover{border-color:rgba(255,255,255,.2)}
  .cartao.arrastando{opacity:.4}
  .c-topo{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .c-acoes{display:flex;align-items:center;gap:2px;flex:none}
  .c-ident{min-width:0}
  .cartao .n{font-weight:600;font-size:14.5px;margin-bottom:3px;line-height:1.25}
  .cartao .e{color:var(--nevoa);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cartao .meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .c-sinais{display:flex;gap:14px;align-items:center;padding-top:10px;border-top:1px solid var(--linha)}
  .sinal{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--nevoa)}
  .sinal svg{width:13px;height:13px}
  .sinal.atrasado{color:var(--vermelho)}
  .c-rodape{display:flex;align-items:center;gap:10px;padding-top:11px;border-top:1px solid var(--linha)}
  .c-rodape .data{flex:none}
  .c-rodape .etapa-sel{flex:1;width:auto}
  .cartao .data{font-family:var(--mono);font-size:10.5px;color:var(--nevoa)}
  .cartao .utms{display:flex;flex-direction:column;gap:3px;margin-top:9px;padding-top:9px;border-top:1px solid var(--linha)}
  .utm{font-family:var(--mono);font-size:10.5px;color:#c4c4c4;display:flex;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .utm i{color:var(--nevoa);font-style:normal;min-width:58px;flex:none}
  .selo.enviado{color:var(--ambar);border-color:rgba(255,106,0,.32);background:rgba(255,106,0,.08)}
  .ver-lead{margin-top:10px;width:100%;background:transparent;border:1px solid var(--linha);color:var(--nevoa);
    border-radius:7px;padding:7px;font-size:12px;cursor:pointer}
  .ver-lead:hover{border-color:var(--ambar);color:var(--branco)}
  .ver-lead.perigo{border-color:rgba(248,113,113,.3);color:var(--vermelho)}
  .ver-lead.perigo:hover{border-color:var(--vermelho);background:rgba(248,113,113,.08)}
  .cartao-excluir{background:none;border:none;color:#4b4b4b;cursor:pointer;font-size:13px;padding:2px 5px;flex:none}
  .cartao-excluir:hover{color:var(--vermelho)}

  /* lead score: barra fina no cartao, cor por faixa (estado, nao marca) */
  .score{display:flex;align-items:center;gap:9px}
  .sc-rot{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--nevoa)}
  .sc-trilho{flex:1;height:5px;background:var(--grafite-2);border-radius:3px;overflow:hidden}
  .sc-preenchido{height:100%;border-radius:3px}
  .sc-num{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;min-width:20px;text-align:right}
  .score-frio .sc-preenchido{background:#6B7280}
  .score-frio .sc-num{color:#9CA3AF}
  .score-morno .sc-preenchido{background:var(--ambar)}
  .score-morno .sc-num{color:var(--ambar)}
  .score-quente .sc-preenchido{background:var(--verde)}
  .score-quente .sc-num{color:var(--verde)}

  .score-detalhe{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .sd-num{font-family:var(--display);font-weight:700;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
  .sd-num.score-frio{color:#9CA3AF}
  .sd-num.score-morno{color:var(--ambar)}
  .sd-num.score-quente{color:var(--verde)}
  .sd-faixa{font-family:var(--display);font-weight:600;font-size:15px}
  .sd-ajuda{font-size:12.5px;color:var(--nevoa)}
  .sd-de{font-size:18px;color:var(--nevoa);font-weight:600}

  /* abas do pop-up do lead */
  .abas{display:flex;gap:4px;border-bottom:1px solid var(--linha);margin-bottom:22px}
  .aba{background:none;border:none;border-bottom:2px solid transparent;color:var(--nevoa);
    padding:11px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:7px;margin-bottom:-1px}
  .aba:hover{color:var(--branco)}
  .aba.ativa{color:var(--ambar);border-bottom-color:var(--ambar);font-weight:500}
  .aba-conta{font-family:var(--mono);font-size:10.5px;background:var(--grafite-2);border-radius:99px;padding:2px 6px}
  .aba.ativa .aba-conta{background:rgba(255,106,0,.15)}

  .linha-campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  textarea{resize:vertical;line-height:1.5}
  .historico{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .vazio-bloco{color:var(--nevoa);font-size:13px;text-align:center;padding:24px 12px;
    border:1px dashed var(--linha);border-radius:10px}

  .nota{background:var(--preto);border:1px solid var(--linha);border-radius:9px;padding:13px 14px}
  .nota-topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
  .nota-data{font-family:var(--mono);font-size:10.5px;color:var(--nevoa)}
  .nota-apagar{background:none;border:none;color:#4b4b4b;cursor:pointer;font-size:13px;padding:2px 5px}
  .nota-apagar:hover{color:var(--vermelho)}
  .nota p{font-size:13.5px;color:#e4e0dc;white-space:pre-wrap;line-height:1.5}

  .lembrete{background:var(--preto);border:1px solid var(--linha);border-left-width:2px;border-radius:9px;padding:13px 14px}
  .lembrete.aberto{border-left-color:var(--ambar)}
  .lembrete.atrasado{border-left-color:var(--vermelho)}
  .lembrete.feito{border-left-color:var(--verde);opacity:.6}
  .lem-quando{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11.5px;margin-bottom:7px}
  .lem-estado{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--nevoa)}
  .lembrete p{font-size:13.5px;color:#e4e0dc;line-height:1.45}
  .lem-acoes{display:flex;gap:8px;margin-top:11px}
  .mini{background:transparent;border:1px solid var(--linha);color:var(--nevoa);border-radius:6px;
    padding:5px 10px;font-size:11.5px;cursor:pointer}
  .mini:hover{border-color:var(--ambar);color:var(--branco)}

  /* atalho pro WhatsApp do lead */
  .acoes-cartao{display:flex;gap:8px;align-items:stretch;margin-top:10px}
  .acoes-cartao .ver-lead{margin-top:0;flex:1}
  .zap{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:none;
    width:34px;height:34px;border:1px solid var(--linha);border-radius:7px;
    color:var(--nevoa);transition:all .15s;text-decoration:none;
  }
  .zap svg{width:17px;height:17px}
  .zap:hover{border-color:#25D366;color:#25D366;background:rgba(37,211,102,.08)}
  .zap-largo{width:100%;height:auto;padding:12px;font-family:var(--display);font-weight:600;
    font-size:14.5px;color:var(--branco);margin-bottom:22px}
  .cel-contato{display:flex;align-items:center;gap:12px;justify-content:space-between}

  /* detalhe do lead */
  .fundo-modal{position:fixed;inset:0;z-index:60;background:rgba(4,4,4,.7);backdrop-filter:blur(4px);
    display:flex;justify-content:flex-end}
  .gaveta{width:100%;max-width:460px;background:var(--grafite);border-left:1px solid var(--linha);
    height:100dvh;overflow-y:auto;padding:26px 26px calc(26px + env(safe-area-inset-bottom))}
  .gaveta .cabeca{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:22px}
  .gaveta h2{font-size:20px}
  .gaveta .fechar{background:none;border:none;color:var(--nevoa);font-size:22px;cursor:pointer;line-height:1;padding:2px 6px}
  .gaveta .fechar:hover{color:var(--branco)}

/* ---------------- lead score ----------------
   Nota de 0 a 100 montada com o que o lead declarou no formulario mais o
   comportamento dele. Comportamento pesa menos que dinheiro, mas pesa: quem
   marcou reuniao mostrou intencao, nao so preencheu campo. */
// As faixas do formulario mudaram pra nao se sobrepor no limite (quem faturava
// exatamente R$ 70 mil cabia em duas opcoes). Os rotulos antigos continuam na
// tabela porque os leads ja gravados no banco guardam o texto de entao.
const PONTOS_FATURAMENTO = [
  ["r$ 500 mil ou mais", 40],
  ["acima de r$ 500 mil", 40],
  ["r$ 200 mil a r$ 499 mil", 35],
  ["r$ 200 mil a r$ 500 mil", 35],
  ["r$ 70 mil a r$ 199 mil", 25],
  ["r$ 70 mil a r$ 200 mil", 25],
  ["r$ 30 mil a r$ 69 mil", 10],
  ["r$ 30 mil a r$ 70 mil", 10],
  ["ate r$ 30 mil", 0],
];

const PONTOS_VERBA = [
  ["acima de r$ 30 mil", 40],
  ["r$ 10,1 mil a r$ 30 mil", 35],
  ["r$ 10 mil a r$ 30 mil", 35],
  ["r$ 3,1 mil a r$ 10 mil", 25],
  ["r$ 3 mil a r$ 10 mil", 25],
  ["r$ 1,1 mil a r$ 3 mil", 10],
  ["r$ 1 mil a r$ 3 mil", 10],
  ["ate r$ 1 mil", 0],
];

function semAcento(valor) {
  return String(valor || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
}

function pontosDaFaixa(tabela, valor) {
  const limpo = semAcento(valor);
  if (!limpo) return null;
  const achado = tabela.find(([chave]) => limpo === chave || limpo.includes(chave));
  return achado ? achado[1] : null;
}

function calcularScore(lead) {
  const partes = [];

  const pFat = pontosDaFaixa(PONTOS_FATURAMENTO, lead.faturamento);
  partes.push({ rotulo: "Faturamento", valor: lead.faturamento || "não informado", pontos: pFat ?? 0, maximo: 40 });

  const pVerba = pontosDaFaixa(PONTOS_VERBA, lead.verba);
  partes.push({ rotulo: "Verba", valor: lead.verba || "não informada", pontos: pVerba ?? 0, maximo: 40 });

  const agendou = agendamentos.some((a) => a.lead_id === lead.id);
  partes.push({ rotulo: "Marcou reunião", valor: agendou ? "sim" : "não", pontos: agendou ? 20 : 0, maximo: 20 });

  const total = partes.reduce((soma, p) => soma + p.pontos, 0);
  const completo = pFat !== null && pVerba !== null;

  let faixa = "frio";
  if (total >= 70) faixa = "quente";
  else if (total >= 40) faixa = "morno";

  return { total, faixa, partes, completo };
}

// Nota exibida em decimos: 100 pontos internos viram 0 a 10.
function notaDeDez(lead) {
  return Math.round(calcularScore(lead).total / 10);
}

function selosScore(lead) {
  const s = calcularScore(lead);
  return `
    <div class="score score-${s.faixa}" title="Score ${notaDeDez(lead)} de 10${s.completo ? "" : " (formulário incompleto)"}">
      <span class="sc-rot">Score</span>
      <div class="sc-trilho"><div class="sc-preenchido" style="width:${s.total}%"></div></div>
      <span class="sc-num">${notaDeDez(lead)}/10</span>

}

// Monta o link do WhatsApp a partir do telefone gravado, com o codigo do pais

function linkWhatsApp(lead) {
  const digitos = String(lead.telefone || "").replace(/\D/g, "");
  if (digitos.length < 10) return null;
  const numero = digitos.length <= 11 ? "55" + digitos : digitos;
  const primeiroNome = String(lead.nome || "").trim().split(" ")[0];
  const saudacao = primeiroNome
    ? `Olá ${primeiroNome}, aqui é o Douglas da the new ads.`
    : "Olá, aqui é o Douglas da the new ads.";
  return `https://wa.me/${numero}?text=${encodeURIComponent(saudacao)}`;
}

/* ---------------- autenticação ---------------- */
async function iniciar() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return;

  // Sessao antiga pode estar no nivel 1 com segundo fator ja cadastrado.

async function precisaSegundaEtapa() {
  const { data, error } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (error || !data) return false;
  return data.nextLevel === "aal2" && data.currentLevel !== "aal2";
}

// Pede o desafio do fator cadastrado e confere o codigo digitado.
async function verificarCodigo(codigo) {
  const { data: fatores, error: erroFatores } = await sb.auth.mfa.listFactors();
  if (erroFatores) return { erro: erroFatores.message };

  const fator = (fatores?.totp || []).find((f) => f.status === "verified");
  if (!fator) return { erro: "Nenhum aplicativo autenticador cadastrado." };

  const { data: desafio, error: erroDesafio } = await sb.auth.mfa.challenge({ factorId: fator.id });
  if (erroDesafio) return { erro: erroDesafio.message };

  const { error: erroVerificacao } = await sb.auth.mfa.verify({
    factorId: fator.id,
    challengeId: desafio.id,
    code: codigo,
  });
  if (erroVerificacao) return { erro: erroVerificacao.message };

  return { ok: true };
}

document.getElementById("form-codigo").addEventListener("submit", async (e) => {
  e.preventDefault();
  const aviso = document.getElementById("aviso-codigo");
  const btn = document.getElementById("btn-verificar");
  const codigo = document.getElementById("codigo-2fa").value.replace(/\D/g, "");

  if (codigo.length !== 6) {
    aviso.className = "aviso erro";
    aviso.textContent = "O código tem 6 dígitos.";
    return;
  }

  btn.disabled = true;
  aviso.className = "aviso";
  aviso.textContent = "Verificando...";

  const resultado = await verificarCodigo(codigo);
  btn.disabled = false;

  if (resultado.erro) {
    aviso.className = "aviso erro";
    aviso.textContent = resultado.erro.includes("Invalid")
      ? "Código incorreto ou expirado. O Duo troca o código a cada 30 segundos."
      : resultado.erro;
    document.getElementById("codigo-2fa").value = "";
    return;
  }

  const { data } = await sb.auth.getSession();
  document.getElementById("form-codigo").style.display = "none";
  entrarNoApp(data.session);
});

function entrarNoApp(sessao) {
  document.getElementById("tela-login").style.display = "none";
  document.getElementById("app").classList.add("ativo");
  document.getElementById("usuario-email").textContent = sessao.user.email;
  carregarTudo();
}

document.getElementById("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const aviso = document.getElementById("aviso-login");
  const btn = document.getElementById("btn-entrar");
  btn.disabled = true;
  aviso.className = "aviso";
  aviso.textContent = "Entrando...";

  const { data, error } = await sb.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("senha").value,
  });

  if (error) {
    aviso.className = "aviso erro";
    aviso.textContent = error.message === "Invalid login credentials"
      ? "E-mail ou senha incorretos."
      : "Não deu pra entrar: " + error.message;
    btn.disabled = false;
    return;
  }

  aviso.textContent = "";
  btn.disabled = false;

  if (await precisaSegundaEtapa()) {
    pedirCodigo();
    return;
  }

  entrarNoApp(data.session);
});

/* ---------------- dados ---------------- */
async function carregarTudo() {
  const [resLeads, resAgenda, resConfig, resNotas, resLembretes] = await Promise.all([
    sb.from("funil_leads").select("*").order("created_at", { ascending: false }),
    sb.from("funil_agendamentos").select("*").order("inicio", { ascending: false }),
    sb.from("funil_config").select("chave, valor"),
    sb.from("funil_notas").select("*").order("criado_em", { ascending: false }),
    sb.from("funil_lembretes").select("*").order("quando", { ascending: true }),
  ]);

  leads = resLeads.data || [];
  agendamentos = resAgenda.data || [];
  config = Object.fromEntries((resConfig.data || []).map((c) => [c.chave, c.valor]));
  notas = resNotas.data || [];
  lembretes = resLembretes.data || [];

  document.getElementById("cont-leads").textContent = leads.length || "";
  const futuros = agendamentos.filter((a) => new Date(a.inicio) >= new Date() && a.situacao === "agendado");
  document.getElementById("cont-agendamentos").textContent = futuros.length || "";

  render();
  carregarEventos();
  sincronizarPush();
}

/* ---------------- agendamentos: calendário ---------------- */
let modoAgenda = "semana";          // dia | semana | mes
let referencia = new Date();        // data âncora da visão
let eventosGoogle = [];
let carregandoEventos = false;

const DIAS_SEMANA = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

function meiaNoite(data) {
  const d = new Date(data);
  d.setHours(0, 0, 0, 0);
  return d;
}

function somarDias(data, dias) {
  const d = new Date(data);
  d.setDate(d.getDate() + dias);
  return d;
}

// Intervalo que a visão atual precisa buscar na agenda.
function intervaloDaVisao() {
  if (modoAgenda === "dia") {
    const inicio = meiaNoite(referencia);
    return { inicio, fim: somarDias(inicio, 1) };
  }
  if (modoAgenda === "semana") {
    const inicio = somarDias(meiaNoite(referencia), -referencia.getDay());
    return { inicio, fim: somarDias(inicio, 7) };
  }
  const primeiro = new Date(referencia.getFullYear(), referencia.getMonth(), 1);
  const inicio = somarDias(primeiro, -primeiro.getDay());
  return { inicio, fim: somarDias(inicio, 42) };
}

function tituloDaVisao() {
  if (modoAgenda === "dia") {
    return referencia.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });
  }
  if (modoAgenda === "semana") {
    const { inicio } = intervaloDaVisao();
    const fim = somarDias(inicio, 6);
    const mesmoMes = inicio.getMonth() === fim.getMonth();
    const f = (d, comMes) => d.toLocaleDateString("pt-BR", comMes ? { day: "2-digit", month: "short" } : { day: "2-digit" });
    return `${f(inicio, !mesmoMes)} a ${f(fim, true)}`;
  }
  return `${MESES[referencia.getMonth()]} de ${referencia.getFullYear()}`;
}

async function carregarEventos() {
  const { inicio, fim } = intervaloDaVisao();
  const { data: sessao } = await sb.auth.getSession();
  if (!sessao.session) return;

  carregandoEventos = true;
  try {
    const res = await fetch(`/api/eventos?inicio=${inicio.toISOString()}&fim=${fim.toISOString()}`, {
      headers: { Authorization: `Bearer ${sessao.session.access_token}` },
    });
    const dados = await res.json();
    eventosGoogle = res.ok ? dados.eventos || [] : [];
    if (!res.ok) console.error("agenda:", dados);
  } catch (err) {
    eventosGoogle = [];
    console.error("agenda:", err);
  }
  carregandoEventos = false;
  if (vistaAtual === "agendamentos") render();
}

function eventosDoDia(dia) {
  const inicioDia = meiaNoite(dia).getTime();
  const fimDia = inicioDia + 86400000;
  return eventosGoogle
    .filter((e) => {
      if (!e.inicio) return false;
      const t = new Date(e.inicio).getTime();
      return t >= inicioDia && t < fimDia;
    })
    .sort((a, b) => new Date(a.inicio) - new Date(b.inicio));
}

// Reunião marcada pela landing tem lead ligado; o resto é compromisso comum.
function leadDoEvento(evento) {
  const ag = agendamentos.find((a) => a.google_event_id === evento.id);
  if (!ag) return null;
  return leads.find((l) => l.id === ag.lead_id) || { nome: ag.nome, id: ag.lead_id };
}

function hora(iso) {
  return new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

function chipEvento(e, compacto) {
  const lead = leadDoEvento(e);
  return `
    <div class="ev ${lead ? "ev-lead" : ""}" ${lead?.id ? `data-lead="${lead.id}"` : ""} title="${escapar(e.titulo)}">
      <span class="ev-hora">${e.diaInteiro ? "dia" : hora(e.inicio)}</span>
      <span class="ev-tit">${escapar(compacto ? (lead?.nome || e.titulo) : e.titulo)}</span>
    </div>`;
}

function visaoDia() {
  const lista = eventosDoDia(referencia);
  if (!lista.length) return '<div class="vazio-bloco">Nenhum compromisso nesse dia.</div>';

  return `<div class="agenda-dia">${lista.map((e) => {
    const lead = leadDoEvento(e);
    return `
      <div class="linha-dia ${lead ? "ev-lead" : ""}" ${lead?.id ? `data-lead="${lead.id}"` : ""}>
        <div class="ld-hora">${e.diaInteiro ? "dia inteiro" : `${hora(e.inicio)}<span>${hora(e.fim)}</span>`}</div>
        <div class="ld-corpo">
          <div class="ld-tit">${escapar(e.titulo)}</div>
          ${e.convidados.length ? `<div class="ld-sub">${escapar(e.convidados.join(", "))}</div>` : ""}
          <div class="ld-acoes">
            ${e.meet ? `<a class="mini" href="${e.meet}" target="_blank" rel="noopener">Abrir Meet</a>` : ""}
            ${lead?.id ? `<button class="mini" data-lead="${lead.id}" type="button">Ver lead</button>` : ""}
          </div>
        </div>
      </div>`;
  }).join("")}</div>`;
}

function visaoSemana() {
  const { inicio } = intervaloDaVisao();
  const hoje = meiaNoite(new Date()).getTime();

  const colunas = Array.from({ length: 7 }, (_, i) => {
    const dia = somarDias(inicio, i);
    const lista = eventosDoDia(dia);
    const ehHoje = meiaNoite(dia).getTime() === hoje;
    return `
      <div class="col-semana ${ehHoje ? "hoje" : ""}">
        <div class="cs-cabeca">
          <span class="cs-dia">${DIAS_SEMANA[dia.getDay()]}</span>
          <span class="cs-num">${dia.getDate()}</span>
        </div>
        <div class="cs-corpo">
          ${lista.length ? lista.map((e) => chipEvento(e, true)).join("") : '<div class="cs-vazio">livre</div>'}
        </div>
      </div>`;
  }).join("");

  return `<div class="agenda-semana">${colunas}</div>`;
}

function visaoMes() {
  const { inicio } = intervaloDaVisao();
  const hoje = meiaNoite(new Date()).getTime();
  const mesAtual = referencia.getMonth();

  const celulas = Array.from({ length: 42 }, (_, i) => {
    const dia = somarDias(inicio, i);
    const lista = eventosDoDia(dia);
    const foraDoMes = dia.getMonth() !== mesAtual;
    const ehHoje = meiaNoite(dia).getTime() === hoje;
    const visiveis = lista.slice(0, 3);
    const resto = lista.length - visiveis.length;

    return `
      <div class="cel-mes ${foraDoMes ? "fora" : ""} ${ehHoje ? "hoje" : ""}" data-dia="${meiaNoite(dia).toISOString()}">
        <div class="cm-num">${dia.getDate()}</div>
        ${visiveis.map((e) => chipEvento(e, true)).join("")}
        ${resto > 0 ? `<div class="cm-mais">+${resto}</div>` : ""}
      </div>`;
  }).join("");

  return `
    <div class="mes-cabeca">${DIAS_SEMANA.map((d) => `<span>${d}</span>`).join("")}</div>
    <div class="agenda-mes">${celulas}</div>`;
}

function vistaAgendamentos() {
  const agora = new Date();
  const futuros = agendamentos.filter((a) => new Date(a.inicio) >= agora && a.situacao === "agendado");

  const corpo = carregandoEventos
    ? '<div class="vazio-bloco">Carregando agenda...</div>'
    : modoAgenda === "dia" ? visaoDia()
    : modoAgenda === "semana" ? visaoSemana()
    : visaoMes();

  const proximas = agendamentos
    .filter((a) => new Date(a.inicio) >= agora)
    .sort((a, b) => new Date(a.inicio) - new Date(b.inicio))
    .slice(0, 4);

  return `
    <div class="topo">
      <div>
        <h1>Agendamentos</h1>
        <div class="desc">${futuros.length} reunião(ões) de lead à frente. O calendário mostra a agenda inteira.</div>
      </div>
    </div>

    <div class="barra-agenda">
      <div class="nav-agenda">
        <button class="mini" id="ag-anterior" type="button" aria-label="Anterior">‹</button>
        <button class="mini" id="ag-hoje" type="button">Hoje</button>
        <button class="mini" id="ag-proximo" type="button" aria-label="Próximo">›</button>
      </div>
      <div class="titulo-agenda">${tituloDaVisao()}</div>
      <div class="modos">
        ${[["dia", "Dia"], ["semana", "Semana"], ["mes", "Mês"]].map(([id, rot]) =>
          `<button class="modo${modoAgenda === id ? " ativo" : ""}" data-modo="${id}" type="button">${rot}</button>`).join("")}
      </div>
    </div>

    <div class="painel-agenda">${corpo}</div>

    ${proximas.length ? `
    <div class="painel-grafico" style="margin-top:18px">
      <div class="pg-cabeca"><h2>Próximas reuniões de lead</h2><p>Marcadas pela landing, com situação editável.</p></div>
      <div class="rolagem"><table>
        <thead><tr><th>Quem</th><th>Quando</th><th>Situação</th><th>Reunião</th></tr></thead>
        <tbody>${proximas.map((a) => `
          <tr>
            <td><div class="nome-cel">${escapar(a.nome)}</div><div class="sub-cel">${escapar(a.email || "")}</div></td>
            <td class="num">${dataHora(a.inicio)}</td>
            <td>
              <select class="etapa-sel situacao-sel" data-id="${a.id}">
                ${Object.entries(SITUACOES).map(([v, r]) => `<option value="${v}"${a.situacao === v ? " selected" : ""}>${r}</option>`).join("")}
              </select>
            </td>
            <td>${a.meet_link ? `<a class="num" style="color:var(--ambar)" href="${escapar(a.meet_link)}" target="_blank" rel="noopener">Abrir Meet</a>` : "<span class='num'>sem link</span>"}</td>
          </tr>`).join("")}</tbody>
      </table></div>
    </div>` : ""}
  `;
}

function ligarAgenda() {
  const anterior = document.getElementById("ag-anterior");
  if (!anterior) return;

  const passo = (sinal) => {
    if (modoAgenda === "dia") referencia = somarDias(referencia, sinal);
    else if (modoAgenda === "semana") referencia = somarDias(referencia, 7 * sinal);
    else referencia = new Date(referencia.getFullYear(), referencia.getMonth() + sinal, 1);
    render();
    carregarEventos();
  };

  anterior.addEventListener("click", () => passo(-1));
  document.getElementById("ag-proximo").addEventListener("click", () => passo(1));
  document.getElementById("ag-hoje").addEventListener("click", () => {
    referencia = new Date();
    render();
    carregarEventos();
  });

  document.querySelectorAll(".modo").forEach((b) => {
    b.addEventListener("click", () => {
      modoAgenda = b.dataset.modo;
      render();
      carregarEventos();
    });
  });

  // Clicar num dia do mês abre aquele dia em detalhe.
  document.querySelectorAll(".cel-mes").forEach((c) => {
    c.addEventListener("click", (e) => {
      if (e.target.closest("[data-lead]")) return;
      referencia = new Date(c.dataset.dia);
      modoAgenda = "dia";
      render();
      carregarEventos();
    });
  });

  document.querySelectorAll("[data-lead]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      abrirLead(el.dataset.lead);
    });
  });
}

function leadsFiltrados() {
  const termo = busca.trim().toLowerCase();
  return leads.filter((l) => {
    if (filtroQualificacao === "sim" && l.qualificado !== true) return false;
    if (filtroQualificacao === "nao" && l.qualificado !== false) return false;
    if (!termo) return true;
    return [l.nome, l.email, l.telefone, l.empresa, l.utm_campaign, rotuloNicho(l.nicho)]
      .filter(Boolean).join(" ").toLowerCase().includes(termo);
  });
}

/* ---------------- verificação em duas etapas ---------------- */
async function desenhar2FA() {
  const area = document.getElementById("area-2fa");
  const selo = document.getElementById("selo-2fa");
  if (!area) return;

  const { data, error } = await sb.auth.mfa.listFactors();
  if (error) {
    area.innerHTML = `<div class="aviso erro">Não deu pra checar: ${escapar(error.message)}</div>`;
    return;
  }

  const ativo = (data?.totp || []).find((f) => f.status === "verified");

  if (ativo) {
    selo.className = "selo sim";
    selo.textContent = "ligada";
    area.innerHTML = `
      <div class="par"><span class="r">Aplicativo</span><span class="v">${escapar(ativo.friendly_name || "Duo Mobile")}</span></div>
      <div class="par"><span class="r">Ativado em</span><span class="v">${dataCurta(ativo.created_at)}</span></div>
      <button class="ver-lead" id="remover-2fa" type="button" style="width:auto;margin-top:16px;padding:8px 14px">Desativar verificação em duas etapas</button>
      <div class="aviso" id="aviso-2fa"></div>`;

    document.getElementById("remover-2fa").addEventListener("click", async () => {
      if (!confirm("Desativar a verificação em duas etapas? O painel volta a exigir só a senha.")) return;
      const aviso = document.getElementById("aviso-2fa");
      const { error: erroRemocao } = await sb.auth.mfa.unenroll({ factorId: ativo.id });
      if (erroRemocao) {
        aviso.className = "aviso erro";
        aviso.textContent = "Não deu pra desativar: " + erroRemocao.message;
        return;
      }
      desenhar2FA();
    });
    return;
  }

  selo.className = "selo nao";
  selo.textContent = "desligada";
  area.innerHTML = `<button class="btn btn-largo" id="ativar-2fa" type="button">Ativar com o Duo Mobile</button>
                    <div class="aviso" id="aviso-2fa"></div>`;

  document.getElementById("ativar-2fa").addEventListener("click", async () => {
    const aviso = document.getElementById("aviso-2fa");
    aviso.className = "aviso";
    aviso.textContent = "Gerando o código...";

    // Fator pendente de tentativa anterior impediria um novo cadastro.
    const { data: atuais } = await sb.auth.mfa.listFactors();
    for (const pendente of (atuais?.totp || []).filter((f) => f.status !== "verified")) {
      await sb.auth.mfa.unenroll({ factorId: pendente.id });
    }

    const { data: inscricao, error: erroInscricao } = await sb.auth.mfa.enroll({
      factorType: "totp",
      friendlyName: "Duo Mobile",
      issuer: "The New Ads",
    });

    if (erroInscricao) {
      aviso.className = "aviso erro";
      aviso.textContent = "Não deu pra gerar: " + erroInscricao.message;
      return;
    }

    area.innerHTML = `
      <ol class="passos-2fa">
        <li>Abra o Duo Mobile e toque em adicionar conta, opção "Usar código QR"</li>
        <li>Aponte a câmera para o código abaixo</li>
        <li>Digite aqui o número de 6 dígitos que aparecer no app</li>
      </ol>
      <div class="qr-caixa"><img src="${inscricao.totp.qr_code}" alt="Código QR para o aplicativo autenticador" width="190" height="190"></div>
      <details class="manual">
        <summary>Não consegue ler o código?</summary>
        <p>Adicione manualmente no Duo Mobile com esta chave:</p>
        <code class="chave-2fa">${escapar(inscricao.totp.secret)}</code>
      </details>
      <div class="campo" style="margin-top:18px">
        <label for="confirma-2fa">Código do aplicativo</label>
        <input type="text" id="confirma-2fa" inputmode="numeric" maxlength="6" placeholder="000000"
               autocomplete="one-time-code" style="letter-spacing:.4em;font-family:var(--mono);text-align:center">
      </div>
      <button class="btn btn-largo" id="confirmar-2fa" type="button">Confirmar e ativar</button>
      <div class="aviso" id="aviso-2fa"></div>`;

    document.getElementById("confirmar-2fa").addEventListener("click", async () => {
      const campo = document.getElementById("confirma-2fa");
      const avisoConfirma = document.getElementById("aviso-2fa");
      const codigo = campo.value.replace(/\D/g, "");

      if (codigo.length !== 6) {
        avisoConfirma.className = "aviso erro";
        avisoConfirma.textContent = "O código tem 6 dígitos.";
        return;
      }

      avisoConfirma.className = "aviso";
      avisoConfirma.textContent = "Conferindo...";

      const { data: desafio, error: erroDesafio } = await sb.auth.mfa.challenge({ factorId: inscricao.id });
      if (erroDesafio) {
        avisoConfirma.className = "aviso erro";
        avisoConfirma.textContent = erroDesafio.message;
        return;
      }

      const { error: erroVerificacao } = await sb.auth.mfa.verify({
        factorId: inscricao.id,
        challengeId: desafio.id,
        code: codigo,
      });

      if (erroVerificacao) {
        avisoConfirma.className = "aviso erro";
        avisoConfirma.textContent = "Código incorreto. O Duo troca o código a cada 30 segundos, tente com o próximo.";
        campo.value = "";
        return;
      }

      desenhar2FA();
    });
  });
}


/* ---------------- diagnóstico e sincronia do push ----------------
   O estado do push vive em três lugares que podem sair de sincronia:
   permissão do navegador, registro do service worker e linha no banco.
   Desinstalar o app apaga os dois primeiros e deixa a linha órfã, que o
   servidor aceita enviar mas nenhum aparelho exibe. Aqui a gente mostra os
   três lado a lado e conserta a diferença. */
// Rotulo dos nichos das paginas de captacao. Slug cru no card nao ajuda ninguem.
const NOME_NICHO = { generico: "Negócio local", vet: "Clínica pet", eventos: "Eventos" };
function rotuloNicho(valor) {
  if (!valor) return "";
  return NOME_NICHO[valor] || valor;
}

const CHAVE_ENDPOINT_LOCAL = "funil_push_endpoint";

async function estadoPush() {
  const estado = {
    suportado: "serviceWorker" in navigator && "PushManager" in window,
    permissao: typeof Notification !== "undefined" ? Notification.permission : "indisponivel",
    instalado: window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true,
    escopo: null,
    endpoint: null,
    noBanco: false,
  };

  if (!estado.suportado) return estado;

  try {
    const registro = await navigator.serviceWorker.getRegistration("/funil/");
    if (registro) {
      estado.escopo = new URL(registro.scope).pathname;
      const inscricao = await registro.pushManager.getSubscription();
      if (inscricao) {
        estado.endpoint = inscricao.endpoint;
        const { data } = await sb
          .from("funil_push_subscriptions")
          .select("id")
          .eq("endpoint", inscricao.endpoint)
          .maybeSingle();
        estado.noBanco = !!data;
      }
    }
  } catch (err) {
    estado.erro = String(err.message || err);
  }

  return estado;
}

// Garante que a inscricao viva deste aparelho e a que esta no banco.
// Reaproveita a inscricao do aparelho, mas so se ela foi criada com a chave
// VAPID atual. Depois da troca de chave, a antiga precisa sair primeiro.
async function inscricaoAtual(registro) {
  const desejada = base64ParaUint8(VAPID_PUBLIC_KEY);
  let inscricao = await registro.pushManager.getSubscription();

  if (inscricao) {
    const atual = new Uint8Array(inscricao.options?.applicationServerKey || []);
    const mesma = atual.length === desejada.length && atual.every((b, i) => b === desejada[i]);
    if (!mesma) {
      await inscricao.unsubscribe();
      inscricao = null;
    }
  }

  if (!inscricao) {
    inscricao = await registro.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: desejada,
    });
  }

  return inscricao;
}

async function sincronizarPush() {
  if (!("serviceWorker" in navigator) || Notification.permission !== "granted") return;

  try {
    const registro = await navigator.serviceWorker.register("/funil/sw.js", { scope: "/funil/" });
    await navigator.serviceWorker.ready;

    const inscricao = await inscricaoAtual(registro);

    const bruta = inscricao.toJSON();
    const anterior = localStorage.getItem(CHAVE_ENDPOINT_LOCAL);

    // Este aparelho trocou de endpoint (reinstalou o app): apaga o orfao.
    if (anterior && anterior !== bruta.endpoint) {
      await sb.from("funil_push_subscriptions").delete().eq("endpoint", anterior);
    }

    await sb.from("funil_push_subscriptions").upsert(
      {
        endpoint: bruta.endpoint,
        p256dh: bruta.keys.p256dh,
        auth: bruta.keys.auth,
        user_agent: navigator.userAgent,
      },
      { onConflict: "endpoint" },
    );

    localStorage.setItem(CHAVE_ENDPOINT_LOCAL, bruta.endpoint);
  } catch (err) {
    console.error("sincronizarPush:", err);
  }
}

async function desenharDiagnosticoPush() {
  const area = document.getElementById("diag-push");
  if (!area) return;

  const e = await estadoPush();
  const linha = (rotulo, valor, ok) =>
    `<div class="par"><span class="r">${rotulo}</span><span class="v" style="color:${ok ? "var(--verde)" : "var(--vermelho)"}">${escapar(valor)}</span></div>`;

  const pronto = e.suportado && e.permissao === "granted" && e.endpoint && e.noBanco;

  area.innerHTML = `
    ${linha("Suporte", e.suportado ? "ok" : "navegador nao suporta", e.suportado)}
    ${linha("Permissao", e.permissao === "granted" ? "concedida" : e.permissao, e.permissao === "granted")}
    ${linha("Modo", e.instalado ? "app instalado" : "navegador", true)}
    ${linha("Service worker", e.escopo ? "ativo em " + e.escopo : "nao registrado", !!e.escopo)}
    ${linha("Inscricao no aparelho", e.endpoint ? "criada" : "nao existe", !!e.endpoint)}
    ${linha("Inscricao no servidor", e.noBanco ? "salva" : "ausente", e.noBanco)}
    ${e.erro ? linha("Erro", e.erro, false) : ""}
    <div class="diag-resumo ${pronto ? "ok" : "falta"}">${pronto
      ? "Tudo certo: este aparelho deve receber notificacao."
      : "Este aparelho ainda nao recebe notificacao. Use o botao acima."}</div>`;

  if (document.getElementById("diag-push")) desenharDiagnosticoPush();

  const btnTesteLocal = document.getElementById("btn-teste-local");
  if (btnTesteLocal) btnTesteLocal.addEventListener("click", testarNotificacaoLocal);

  const btnPush = document.getElementById("btn-push");
  if (btnPush && pronto) btnPush.textContent = "Notificacoes ativas";
}

// Teste local: mostra a notificacao direto pelo service worker, sem passar
// pelo servidor. Separa problema de entrega de problema de exibicao.
async function testarNotificacaoLocal() {
  const aviso = document.getElementById("aviso-teste");
  aviso.className = "aviso";
  aviso.textContent = "Disparando...";

  try {
    if (Notification.permission !== "granted") {
      aviso.className = "aviso erro";
      aviso.textContent = "Permissao nao concedida. Ative as notificacoes primeiro.";
      return;
    }

    const registro = await navigator.serviceWorker.getRegistration("/funil/");
    if (!registro) {
      aviso.className = "aviso erro";
      aviso.textContent = "Service worker nao registrado. Ative as notificacoes primeiro.";
      return;
    }

    await registro.showNotification("Funil", {
      body: "Teste local. Se voce esta vendo isso, a exibicao funciona.",
      icon: "/funil/icons/icone-192.png",
      badge: "/funil/icons/icone-192.png",
      data: { url: "/funil/" },
    });

    aviso.className = "aviso ok";
    aviso.textContent = "Disparada. Se nao apareceu, o bloqueio esta nas configuracoes do sistema.";
  } catch (err) {
    aviso.className = "aviso erro";
    aviso.textContent = "Erro: " + err.message;
  }
}

/* ---------------- eventos das vistas ---------------- */
function ligarEventos() {
  const campoBusca = document.getElementById("busca");
  if (campoBusca) {
    campoBusca.addEventListener("input", (e) => {
      busca = e.target.value;
      const posicao = e.target.selectionStart;
      render();
      const novo = document.getElementById("busca");
      if (novo) { novo.focus(); novo.setSelectionRange(posicao, posicao); }
    });
  }

  const filtro = document.getElementById("filtro-qualificacao");
  if (filtro) filtro.addEventListener("change", (e) => { filtroQualificacao = e.target.value; render(); });

  document.querySelectorAll(".lead-etapa").forEach((sel) => {
    sel.addEventListener("change", (e) => moverLead(e.target.dataset.id, e.target.value));
  });

  document.querySelectorAll(".situacao-sel").forEach((sel) => {
    sel.addEventListener("change", async (e) => {
      const { id } = e.target.dataset;
      const valor = e.target.value;
      const { error } = await sb.from("funil_agendamentos").update({ situacao: valor }).eq("id", id);
      if (error) { alert("Não deu pra salvar: " + error.message); return; }
      const item = agendamentos.find((a) => a.id === id);
      if (item) item.situacao = valor;
    });
  });

  document.querySelectorAll(".ver-lead").forEach((b) => {
    b.addEventListener("click", (e) => { e.stopPropagation(); abrirLead(b.dataset.id, "dados"); });
  });

  document.querySelectorAll("[data-excluir]").forEach((b) => {
    b.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = b.dataset.excluir;
      const lead = leads.find((x) => x.id === id);
      const ok = await excluirLead(id, lead?.nome);
      if (ok) render();
    });
  });

  // Clique em qualquer area livre do cartao abre o lead. Controles internos
  // (seletor de etapa, WhatsApp) param a propagacao e seguem funcionando.
  document.querySelectorAll(".cartao").forEach((cartao) => {
    cartao.addEventListener("click", (e) => {
      if (e.target.closest("select, a, button")) return;
      abrirLead(cartao.dataset.id);
    });
  });

  document.querySelectorAll(".lead-etapa").forEach((sel) => {
    sel.addEventListener("click", (e) => e.stopPropagation());
  });

  ligarAgenda();
  ligarArrasto();

  const btnVerToken = document.getElementById("cfg-ver-token");
  if (btnVerToken) {
    btnVerToken.addEventListener("click", () => {
      const campo = document.getElementById("cfg-token");
      const escondido = campo.type === "password";
      campo.type = escondido ? "text" : "password";
      btnVerToken.textContent = escondido ? "Esconder token" : "Mostrar token";
    });
  }

  const btnSalvarConfig = document.getElementById("btn-salvar-config");
  if (btnSalvarConfig) {
    btnSalvarConfig.addEventListener("click", async () => {
      const aviso = document.getElementById("aviso-config");
      const valores = {
        meta_pixel_id: document.getElementById("cfg-pixel").value.trim(),
        meta_capi_token: document.getElementById("cfg-token").value.trim(),
        meta_test_event_code: document.getElementById("cfg-teste").value.trim(),
      };

      if (valores.meta_pixel_id && !/^\d{10,20}$/.test(valores.meta_pixel_id)) {
        aviso.className = "aviso erro";
        aviso.textContent = "O ID do pixel é só números, entre 10 e 20 dígitos.";
        return;
      }

      aviso.className = "aviso";
      aviso.textContent = "Salvando...";
      btnSalvarConfig.disabled = true;

      const linhas = Object.entries(valores).map(([chave, valor]) => ({
        chave,
        valor,
        atualizado_em: new Date().toISOString(),
      }));

      const { error } = await sb.from("funil_config").upsert(linhas, { onConflict: "chave" });
      btnSalvarConfig.disabled = false;

      if (error) {
        aviso.className = "aviso erro";
        aviso.textContent = "Não deu pra salvar: " + error.message;
        return;
      }

      config = { ...config, ...valores };
      render();
      const novo = document.getElementById("aviso-config");
      if (novo) {
        novo.className = "aviso ok";
        novo.textContent = valores.meta_pixel_id && valores.meta_capi_token
          ? "Conexão salva. Os próximos eventos já vão pro Meta."
          : "Salvo. Sem pixel e token, o envio continua desligado.";
      }
    });
  }

  document.querySelectorAll("[data-aba-ajuste]").forEach((b) => {
    b.addEventListener("click", () => { abaAjustes = b.dataset.abaAjuste; render(); });
  });

  const sairAjustes = document.getElementById("btn-sair-ajustes");
  if (sairAjustes) {
    sairAjustes.addEventListener("click", async () => {
      await sb.auth.signOut();
      location.reload();
    });
  }

  if (document.getElementById("area-2fa")) desenhar2FA();

  const btnSenha = document.getElementById("btn-trocar-senha");
  if (btnSenha) {
    btnSenha.addEventListener("click", async () => {
      const nova = document.getElementById("senha-nova").value;
      const confirma = document.getElementById("senha-confirma").value;
      const aviso = document.getElementById("aviso-senha");

      if (nova.length < 8) {
        aviso.className = "aviso erro";
        aviso.textContent = "A senha precisa ter pelo menos 8 caracteres.";
        return;
      }
      if (nova !== confirma) {
        aviso.className = "aviso erro";
        aviso.textContent = "As duas senhas não são iguais.";
        return;
      }

      // Com 2FA ligado, trocar senha exige o codigo do app. Sem isso, quem
      // pegasse a sessao aberta trocaria a senha e tomaria a conta.
      const { data: fatores } = await sb.auth.mfa.listFactors();
      const temFator = (fatores?.totp || []).some((f) => f.status === "verified");

      if (temFator) {
        const codigo = prompt("Digite o código de 6 dígitos do Duo Mobile para confirmar a troca de senha:");
        if (codigo === null) return;

        aviso.className = "aviso";
        aviso.textContent = "Confirmando o código...";

        const conferencia = await verificarCodigo(String(codigo).replace(/\D/g, ""));
        if (conferencia.erro) {
          aviso.className = "aviso erro";
          aviso.textContent = "Código não confere. A senha não foi alterada.";
          return;
        }
      }

      btnSenha.disabled = true;
      aviso.className = "aviso";
      aviso.textContent = "Salvando...";

      const { error } = await sb.auth.updateUser({ password: nova });
      btnSenha.disabled = false;

      if (error) {
        aviso.className = "aviso erro";
        aviso.textContent = "Não deu pra trocar: " + error.message;
        return;
      }

      document.getElementById("senha-nova").value = "";
      document.getElementById("senha-confirma").value = "";
      aviso.className = "aviso ok";
      aviso.textContent = "Senha trocada. Ela já vale no próximo login.";
    });
  }

  const btnPush = document.getElementById("btn-push");
  if (btnPush) btnPush.addEventListener("click", ativarNotificacoes);

  const btnRecarregar = document.getElementById("btn-recarregar");
  if (btnRecarregar) {
    btnRecarregar.addEventListener("click", async () => {
      const aviso = document.getElementById("aviso-recarregar");
      aviso.className = "aviso";
      aviso.textContent = "Atualizando...";
      await carregarTudo();
      const novo = document.getElementById("aviso-recarregar");
      if (novo) { novo.className = "aviso ok"; novo.textContent = "Dados atualizados."; }
    });
  }
}

async function moverLead(id, etapa) {
  const lead = leads.find((l) => l.id === id);
  const destino = ETAPA_POR_ID[etapa];
  if (!lead || lead.etapa === etapa) return;

  // Purchase precisa de valor: abre o campo antes de mover.
  let valor = null;
  if (destino?.evento === "Purchase" && !lead.capi_purchase_enviado_em) {
    valor = await pedirValorContrato(lead);
    if (valor === null) return; // desistiu
  }

  const { error } = await sb
    .from("funil_leads")
    .update({ etapa, etapa_atualizada_em: new Date().toISOString() })
    .eq("id", id);

  if (error) { alert("Não deu pra mover: " + error.message); return; }

  lead.etapa = etapa;
  await sincronizarPresenca(id, etapa);
  if (vistaAtual === "kanban") render();

  if (destino?.evento) await enviarEventoMeta(lead, destino.evento, valor);
}

/* A coluna do kanban e o registro de presenca: mover pra Reuniao feita marca
   presenca, mover pra No-show marca falta. Sem isso o no-show fica invisivel,
   que era o maior vazamento do funil e o unico sem medicao. */
async function sincronizarPresenca(leadId, etapa) {
  let situacao = null;
  if (etapa === "reuniao") situacao = "realizada";
  else if (etapa === "no_show") situacao = "no_show";
  else if (["agendou", "qualificado"].includes(etapa)) situacao = "agendado";
  if (!situacao) return;

  const patch = { situacao };
  patch.compareceu_em = situacao === "realizada" ? new Date().toISOString() : null;

  const { error } = await sb.from("funil_agendamentos").update(patch).eq("lead_id", leadId);
  if (error) console.error("presenca", error.message);

  for (const a of agendamentos) if (a.lead_id === leadId) Object.assign(a, patch);
}

// Campo de valor do contrato. Devolve o numero, ou null se cancelar.
function pedirValorContrato(lead) {
  return new Promise((resolve) => {
    const div = document.createElement("div");
    div.className = "fundo-modal fundo-centro";
    div.innerHTML = `
      <div class="caixa-modal">
        <h2>Fechou com ${escapar(lead.nome || "esse lead")}</h2>
        <p class="ajuda">Informe o valor total do contrato, que é o que vai no evento de compra do Meta. Some o contrato inteiro, não a mensalidade.</p>
        <div class="campo">
          <label for="valor-contrato">Valor total do contrato</label>
          <div class="com-prefixo">
            <span>R$</span>
            <input type="text" id="valor-contrato" inputmode="decimal" placeholder="0,00"
                   value="${lead.valor_contrato ? String(lead.valor_contrato).replace(".", ",") : ""}" autocomplete="off">
          </div>
        </div>
        <div class="aviso" id="aviso-valor"></div>
        <div class="acoes-modal">
          <button class="btn btn-fantasma" type="button" id="valor-cancelar">Cancelar</button>
          <button class="btn" type="button" id="valor-confirmar">Confirmar e enviar</button>
        </div>
      </div>`;

    const fechar = (resultado) => { div.remove(); resolve(resultado); };
    const campo = () => div.querySelector("#valor-contrato");

    const confirmar = () => {
      const bruto = campo().value.trim();
      // Aceita "12.000,00" e "12000.00".
      const numero = Number(bruto.replace(/\./g, "").replace(",", "."));
      if (!bruto || !Number.isFinite(numero) || numero <= 0) {
        const aviso = div.querySelector("#aviso-valor");
        aviso.className = "aviso erro";
        aviso.textContent = "Informe um valor maior que zero.";
        return;
      }
      fechar(numero);
    };

    div.querySelector("#valor-confirmar").addEventListener("click", confirmar);
    div.querySelector("#valor-cancelar").addEventListener("click", () => fechar(null));
    div.addEventListener("click", (e) => { if (e.target === div) fechar(null); });
    campo().addEventListener("keydown", (e) => { if (e.key === "Enter") confirmar(); });

    document.body.appendChild(div);
    campo().focus();
  });
}

// Envia LeadQualificado ou Purchase pra API de conversoes, via /api/capi.
async function enviarEventoMeta(lead, evento, valor) {
  const jaEnviado = evento === "Purchase" ? lead.capi_purchase_enviado_em : lead.capi_qualificado_enviado_em;
  if (jaEnviado) return;

  const { data: sessao } = await sb.auth.getSession();
  if (!sessao.session) return;

  try {
    const res = await fetch("/api/capi", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${sessao.session.access_token}`,
      },
      body: JSON.stringify({ lead_id: lead.id, evento, valor }),
    });
    const dados = await res.json();

    if (res.status === 503) {
      alert("Card movido, mas o evento não foi enviado: faltam o ID do pixel e o token da API de conversões nas variáveis do site.");
      return;
    }
    if (!res.ok) {
      alert("Card movido, mas o Meta recusou o evento: " + (dados.message || JSON.stringify(dados.resposta || dados)));
      return;
    }

    if (evento === "Purchase") {
      lead.capi_purchase_enviado_em = new Date().toISOString();
      if (valor) lead.valor_contrato = valor;
    } else {
      lead.capi_qualificado_enviado_em = new Date().toISOString();
    }
    if (vistaAtual === "kanban") render();
  } catch (err) {
    alert("Card movido, mas falhou o envio do evento: " + err.message);
  }
}

// Apaga o lead pra sempre (anotacoes e lembretes vao junto por cascade no
// banco). Usado tanto pelo card do kanban quanto pela aba "Dados" da gaveta.
// Devolve true se apagou, false se cancelou ou deu erro.
async function excluirLead(id, nome) {
  if (!confirm(`Excluir "${nome || "esse lead"}" pra sempre? Apaga também as anotações e lembretes dele. Não tem como desfazer.`)) return false;
  const { error } = await sb.from("funil_leads").delete().eq("id", id);
  if (error) { alert("Não deu pra excluir: " + error.message); return false; }
  leads = leads.filter((x) => x.id !== id);
  notas = notas.filter((n) => n.lead_id !== id);
  lembretes = lembretes.filter((r) => r.lead_id !== id);
  return true;
}

    return `<div class="par"><span class="r">${rotulo}</span><span class="v${valor ? "" : " vazio"}">${valor ? escapar(valor) : "vazio"}</span></div>`;

  const ABAS = [
    { id: "anotacoes", nome: "Anotações", conta: () => contarNotas(l.id) },

    { id: "dados", nome: "Dados", conta: () => 0 },

  function desenhar() {
    const corpo = abaAtual === "anotacoes" ? abaAnotacoes() : abaAtual === "lembretes" ? abaLembretes() : abaDados();

    div.innerHTML = `
      <div class="gaveta">

            <h2>${escapar(l.nome || "Lead sem nome")}</h2>

    div.querySelector(".fechar").addEventListener("click", fechar);

  function ligarAnotacoes() {
    div.querySelector("#salvar-nota").addEventListener("click", async () => {
      const campo = div.querySelector("#nova-nota");
      const aviso = div.querySelector("#aviso-nota");
      const texto = campo.value.trim();
      if (!texto) {
        aviso.className = "aviso erro";
        aviso.textContent = "Escreva algo antes de salvar.";
        return;
      }

      const { data: sessao } = await sb.auth.getSession();
      const { data, error } = await sb
        .from("funil_notas")
        .insert({ lead_id: l.id, texto, autor: sessao?.session?.user?.email || null })
        .select()
        .single();

      if (error) {
        aviso.className = "aviso erro";
        aviso.textContent = "Não deu pra salvar: " + error.message;
        return;
      }

      notas.unshift(data);
      desenhar();
      if (vistaAtual === "kanban") render();
    });

    div.querySelectorAll(".nota-apagar").forEach((b) => {
      b.addEventListener("click", async () => {
        if (!confirm("Apagar essa anotação?")) return;
        const { error } = await sb.from("funil_notas").delete().eq("id", b.dataset.nota);
        if (error) { alert("Não deu pra apagar: " + error.message); return; }
        notas = notas.filter((n) => n.id !== b.dataset.nota);
        desenhar();
        if (vistaAtual === "kanban") render();
      });
    });
  }

  function ligarLembretes() {
    div.querySelector("#salvar-lembrete").addEventListener("click", async () => {
      const data = div.querySelector("#lem-data").value;
      const hora = div.querySelector("#lem-hora").value;
      const descricao = div.querySelector("#lem-desc").value.trim();
      const aviso = div.querySelector("#aviso-lembrete");

      if (!data || !hora || !descricao) {
        aviso.className = "aviso erro";
        aviso.textContent = "Preencha data, hora e descrição.";
        return;
      }

      const quando = new Date(`${data}T${hora}`);
      if (isNaN(quando)) {
        aviso.className = "aviso erro";
        aviso.textContent = "Data ou hora inválida.";
        return;
      }

      const { data: criado, error } = await sb
        .from("funil_lembretes")
        .insert({ lead_id: l.id, quando: quando.toISOString(), descricao })
        .select()
        .single();

      if (error) {
        aviso.className = "aviso erro";
        aviso.textContent = "Não deu pra agendar: " + error.message;
        return;
      }

      lembretes.push(criado);
      lembretes.sort((a, b) => new Date(a.quando) - new Date(b.quando));
      desenhar();
      if (vistaAtual === "kanban") render();
    });

    div.querySelectorAll("[data-concluir]").forEach((b) => {
      b.addEventListener("click", async () => {
        const alvo = b.dataset.concluir;
        const { error } = await sb.from("funil_lembretes").update({ concluido: true }).eq("id", alvo);
        if (error) { alert("Não deu pra atualizar: " + error.message); return; }
        const item = lembretes.find((r) => r.id === alvo);
        if (item) item.concluido = true;
        desenhar();
        if (vistaAtual === "kanban") render();
      });
    });

    div.querySelectorAll("[data-apagar-lembrete]").forEach((b) => {
      b.addEventListener("click", async () => {
        const alvo = b.dataset.apagarLembrete;
        if (!confirm("Apagar esse lembrete?")) return;
        const { error } = await sb.from("funil_lembretes").delete().eq("id", alvo);
        if (error) { alert("Não deu pra apagar: " + error.message); return; }
        lembretes = lembretes.filter((r) => r.id !== alvo);
        desenhar();
        if (vistaAtual === "kanban") render();
      });
    });
  }

  function ligarDados() {
    // A pergunta de empresa saiu do formulario pra tirar atrito, entao o nome
    // e preenchido aqui, na hora de preparar a reuniao. Salva ao sair do campo.
    const campoEmpresa = div.querySelector(".campo-empresa");
    if (campoEmpresa) {
      campoEmpresa.addEventListener("blur", async () => {
        const valor = campoEmpresa.value.trim();
        if (valor === (l.empresa || "")) return;
        const { error } = await sb.rpc("funil_lead_editar_empresa", { p_id: l.id, p_empresa: valor });
        if (error) { alert("Não deu pra salvar a empresa: " + error.message); return; }
        l.empresa = valor || null;
        const noCache = leads.find((x) => x.id === l.id);
        if (noCache) noCache.empresa = l.empresa;
        campoEmpresa.classList.add("salvo");
        setTimeout(() => campoEmpresa.classList.remove("salvo"), 900);
        if (vistaAtual === "kanban" || vistaAtual === "leads") render();
      });
      campoEmpresa.addEventListener("keydown", (e) => { if (e.key === "Enter") campoEmpresa.blur(); });
    }

    const botao = div.querySelector("#editar-valor");
    if (botao) {
      botao.addEventListener("click", async () => {
        const valor = await pedirValorContrato(l);
        if (valor === null) return;
        const { error } = await sb.from("funil_leads").update({ valor_contrato: valor }).eq("id", l.id);
        if (error) { alert("Não deu pra salvar: " + error.message); return; }
        l.valor_contrato = valor;
        desenhar();
        if (vistaAtual === "kanban") render();
      });
    }

    const botaoExcluir = div.querySelector("#excluir-lead");
    if (botaoExcluir) {
      botaoExcluir.addEventListener("click", async () => {
        botaoExcluir.disabled = true;
        botaoExcluir.textContent = "Excluindo...";
        const ok = await excluirLead(l.id, l.nome);
        if (!ok) {
          botaoExcluir.disabled = false;
          botaoExcluir.textContent = "Excluir lead";
          return;
        }
        fechar();
        render();
      });
    }
  }

  desenhar();
}

function ligarArrasto() {
  let arrastando = null;

  document.querySelectorAll(".cartao").forEach((cartao) => {
    cartao.addEventListener("dragstart", () => {
      arrastando = cartao.dataset.id;
      cartao.classList.add("arrastando");
    });
    cartao.addEventListener("dragend", () => {
      arrastando = null;
      cartao.classList.remove("arrastando");
      document.querySelectorAll(".coluna").forEach((c) => c.classList.remove("alvo"));
    });
  });

  document.querySelectorAll(".coluna").forEach((coluna) => {
    coluna.addEventListener("dragover", (e) => { e.preventDefault(); coluna.classList.add("alvo"); });
    coluna.addEventListener("dragleave", () => coluna.classList.remove("alvo"));
    coluna.addEventListener("drop", (e) => {
      e.preventDefault();
      coluna.classList.remove("alvo");
      if (arrastando) moverLead(arrastando, coluna.dataset.etapa);
    });
  });
}

/* ---------------- notificações ---------------- */
function base64ParaUint8(base64) {
  const preenchido = base64 + "=".repeat((4 - (base64.length % 4)) % 4);
  const limpo = preenchido.replace(/-/g, "+").replace(/_/g, "/");
  const bruto = atob(limpo);
  return Uint8Array.from([...bruto].map((c) => c.charCodeAt(0)));
}

async function ativarNotificacoes() {
  const aviso = document.getElementById("aviso-push");
  const btn = document.getElementById("btn-push");
  aviso.className = "aviso";

  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    aviso.className = "aviso erro";
    aviso.textContent = "Este navegador não suporta notificações. No iPhone, instale o app na tela de início primeiro.";
    return;
  }

  btn.disabled = true;
  aviso.textContent = "Pedindo permissão...";

  try {
    const permissao = await Notification.requestPermission();
    if (permissao !== "granted") {
      aviso.className = "aviso erro";
      aviso.textContent = "Permissão negada. Libere nas configurações do navegador.";
      btn.disabled = false;
      return;
    }

    const registro = await navigator.serviceWorker.register("/funil/sw.js", { scope: "/funil/" });
    await navigator.serviceWorker.ready;

    const inscricao = await inscricaoAtual(registro);

    const bruta = inscricao.toJSON();
    const { error } = await sb.from("funil_push_subscriptions").upsert(
      {
        endpoint: bruta.endpoint,
        p256dh: bruta.keys.p256dh,
        auth: bruta.keys.auth,
        user_agent: navigator.userAgent,
      },
      { onConflict: "endpoint" },
    );

    if (error && !String(error.message).toLowerCase().includes("duplicate")) {
      aviso.className = "aviso erro";
      aviso.textContent = "Erro ao salvar inscrição: " + error.message;
      btn.disabled = false;
      return;
    }

    localStorage.setItem(CHAVE_ENDPOINT_LOCAL, bruta.endpoint);
    btn.textContent = "Notificações ativas";
    aviso.className = "aviso ok";
    aviso.textContent = "Pronto. Este aparelho vai receber os alertas do funil.";
    desenharDiagnosticoPush();
  } catch (err) {
    aviso.className = "aviso erro";
    aviso.textContent = "Erro: " + err.message;
    btn.disabled = false;
  }
}

/* registra o service worker cedo, pra permitir instalar como app */

  navigator.serviceWorker.register("/funil/sw.js", { scope: "/funil/" }).catch(() => {});
}

iniciar();
