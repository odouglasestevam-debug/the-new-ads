const COR_NICHO = { vet: "#22D3EE", eventos: "#A78BFA", generico: "#FF6A00" };

/* Referencias de mercado pra funil de captacao B2B com formulario e agenda.
   Servem so pra ordenar o vazamento por impacto enquanto nao existe historico
   proprio. Com 3 meses de dado, trocar por media movel da casa. */
const REFERENCIA = {
  clique_view: 0.85, view_start: 0.35, start_lead: 0.55, lead_completo: 0.75,
  qualif_agenda: 0.90, agenda_marcou: 0.65, marcou_compareceu: 0.75,
  compareceu_prop: 0.70, prop_cliente: 0.30,
};

const FEE_MENSAL = 1500;
const MESES_CONTRATO = 4;

let estado = { janela: 56, simulado: true, nicho: null, dados: null };
let graficos = [];

/* ====================== matematica ====================== */

// Wilson: com amostra pequena o intervalo normal passa de 100% ou fica negativo.
function wilson(k, n, z = 1.96) {
  if (!n) return [0, 0];
  const p = k / n, d = 1 + (z * z) / n;
  const centro = p + (z * z) / (2 * n);
  const raiz = z * Math.sqrt((p * (1 - p)) / n + (z * z) / (4 * n * n));
  return [Math.max(0, (centro - raiz) / d), Math.min(1, (centro + raiz) / d)];
}

function fdpNormal(x) {
  const t = 1 / (1 + 0.2316419 * Math.abs(x));
  const d = 0.3989423 * Math.exp((-x * x) / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return x > 0 ? 1 - p : p;
}

function testeZ(k1, n1, k2, n2) {
  if (!n1 || !n2) return 1;
  const p1 = k1 / n1, p2 = k2 / n2, pool = (k1 + k2) / (n1 + n2);
  const se = Math.sqrt(pool * (1 - pool) * (1 / n1 + 1 / n2));
  if (!se) return 1;
  return 2 * (1 - fdpNormal(Math.abs((p1 - p2) / se)));
}

function amostraNecessaria(p1, p2) {
  if (p1 === p2) return Infinity;
  const pbar = (p1 + p2) / 2;
  const num = Math.pow(1.96 * Math.sqrt(2 * pbar * (1 - pbar)) + 0.84 * Math.sqrt(p1 * (1 - p1) + p2 * (1 - p2)), 2);
  return Math.ceil(num / Math.pow(p1 - p2, 2));
}

function normalAleatoria() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

// Marsaglia e Tsang. Com prior Beta(1,1), a e b nunca ficam abaixo de 1.
function gamaAleatoria(a) {
  const d = a - 1 / 3, c = 1 / Math.sqrt(9 * d);
  for (;;) {
    let x, v;
    do { x = normalAleatoria(); v = 1 + c * x; } while (v <= 0);
    v = v * v * v;
    const u = Math.random();
    if (u < 1 - 0.0331 * Math.pow(x, 4)) return d * v;
    if (Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) return d * v;
  }
}

function betaAleatoria(a, b) { const x = gamaAleatoria(a), y = gamaAleatoria(b); return x / (x + y); }

/* "Vet tem 71% de chance de ser o melhor" diz muito mais que "vet converte 22%",
   que com 20 leads some dentro da margem de erro. */
function probabilidadeDeSerMelhor(grupos, sorteios = 15000) {
  const vitorias = grupos.map(() => 0);
  for (let s = 0; s < sorteios; s++) {
    let melhor = -1, valorMelhor = -1;
    for (let g = 0; g < grupos.length; g++) {
      const amostra = betaAleatoria(grupos[g].k + 1, grupos[g].n - grupos[g].k + 1);
      if (amostra > valorMelhor) { valorMelhor = amostra; melhor = g; }
    }
    vitorias[melhor]++;
  }
  return vitorias.map((v) => v / sorteios);
}

function mediana(lista) {
  if (!lista.length) return null;
  const o = [...lista].sort((a, b) => a - b), m = Math.floor(o.length / 2);
  return o.length % 2 ? o[m] : (o[m - 1] + o[m]) / 2;
}

function desvio(lista) {
  if (lista.length < 2) return 0;
  const m = lista.reduce((a, b) => a + b, 0) / lista.length;
  return Math.sqrt(lista.reduce((s, x) => s + (x - m) * (x - m), 0) / (lista.length - 1));
}

function mediaMovel(valores, janela) {
  return valores.map((_, i) => {
    const fatia = valores.slice(Math.max(0, i - janela + 1), i + 1).filter((v) => v !== null);
    if (!fatia.length) return null;
    return fatia.reduce((a, b) => a + b, 0) / fatia.length;
  });
}

/* ====================== carga ====================== */

async function carregarTabela(tabela, colunas) {
  const linhas = [], tamanho = 1000;
  for (let inicio = 0; ; inicio += tamanho) {
    const { data, error } = await sb.from(tabela).select(colunas).range(inicio, inicio + tamanho - 1);
    if (error) throw new Error(tabela + ": " + error.message);
    linhas.push(...(data || []));
    if (!data || data.length < tamanho) break;
  }
  return linhas;
}

async function carregarTudo() {
  const [leads, agendamentos, eventos, etapas, midia] = await Promise.all([
    carregarTabela("funil_leads", "id,created_at,etapa,qualificado,nicho,ad_id,utm_content,utm_placement,faturamento,verba,ja_investe,fee_mensal,meses_previstos,valor_contrato,fechado_em,simulado"),
    carregarTabela("funil_agendamentos", "id,lead_id,created_at,inicio,situacao,nicho,ad_id,simulado"),
    carregarTabela("funil_eventos", "visitor_id,tipo,passo,nicho,ad_id,utm_content,utm_placement,created_at,simulado"),
    carregarTabela("funil_etapas_log", "lead_id,de,para,em,simulado"),
    carregarTabela("tna_meta", "data,anuncio,source_id,investimento,impressoes,cliques_no_link,frequencia,simulado"),
  ]);
  return { leads, agendamentos, eventos, etapas, midia };
}

/* ====================== recorte ====================== */

function corte() {
  if (estado.janela === 0) return null;
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - estado.janela + 1);
  return d;
}

function recortar(dados) {
  const limite = corte();
  const ok = (s) => estado.simulado || s !== true;
  const dentro = (iso) => !limite || new Date(iso) >= limite;
  const doNicho = (x) => !estado.nicho || x.nicho === estado.nicho;

  const leads = dados.leads.filter((l) => ok(l.simulado) && dentro(l.created_at) && doNicho(l));
  const ids = new Set(leads.map((l) => l.id));
  const eventos = dados.eventos.filter((e) => ok(e.simulado) && dentro(e.created_at) && doNicho(e));

  // Com nicho filtrado, o investimento acompanha pelos anuncios daquele nicho.
  const anunciosDoNicho = new Set(eventos.map((e) => e.utm_content).filter(Boolean));
  const midia = dados.midia
    .filter((m) => ok(m.simulado) && dentro(m.data + "T12:00:00"))
    .filter((m) => !estado.nicho || anunciosDoNicho.has(m.anuncio));

  return {
    leads, eventos, midia,
    // coorte pela criacao do lead: reuniao de hoje de um lead do mes passado
    // e desempenho do mes passado, nao de hoje.
    agendamentos: dados.agendamentos.filter((a) => ok(a.simulado) && ids.has(a.lead_id)),
    etapas: dados.etapas.filter((e) => ok(e.simulado) && ids.has(e.lead_id)),
  };
}

function unicos(eventos, tipo, passo) {
  const s = new Set();
  for (const e of eventos) {
    if (e.tipo !== tipo) continue;
    if (passo !== undefined && e.passo !== passo) continue;
    s.add(e.visitor_id);
  }
  return s.size;
}

function etapasAlcancadas(d) {
  const mapa = new Map();
  for (const e of d.etapas) {
    if (!mapa.has(e.lead_id)) mapa.set(e.lead_id, new Set());
    mapa.get(e.lead_id).add(e.para);
  }
  return mapa;
}

/* ====================== calculo ====================== */

function calcular(d, filtroNicho) {
  const alcancados = etapasAlcancadas(d);
  const doNicho = (x) => !filtroNicho || x.nicho === filtroNicho;
  const leads = d.leads.filter(doNicho);
  const eventos = d.eventos.filter(doNicho);
  const ids = new Set(leads.map((l) => l.id));
  const agendamentos = d.agendamentos.filter((a) => ids.has(a.lead_id));

  const anuncios = new Set(eventos.map((e) => e.utm_content).filter(Boolean));
  const midia = filtroNicho ? d.midia.filter((m) => anuncios.has(m.anuncio)) : d.midia;

  const investimento = midia.reduce((s, m) => s + Number(m.investimento || 0), 0);
  const cliques = midia.reduce((s, m) => s + Number(m.cliques_no_link || 0), 0);
  const impressoes = midia.reduce((s, m) => s + Number(m.impressoes || 0), 0);

  const escada = {
    clique: cliques,
    form_view: unicos(eventos, "form_view"),
    form_start: unicos(eventos, "form_start"),
    lead: unicos(eventos, "lead"),
    form_complete: unicos(eventos, "form_complete"),
    scheduler_view: unicos(eventos, "scheduler_view"),
  };

  const qualificados = leads.filter((l) => l.qualificado === true).length;
  const marcadas = agendamentos.length;
  const compareceu = agendamentos.filter((a) => a.situacao === "realizada").length;
  const noShow = agendamentos.filter((a) => a.situacao === "no_show").length;

  const passou = (l, etapa) => {
    const s = alcancados.get(l.id);
    return (s && s.has(etapa)) || l.etapa === etapa;
  };
  const propostas = leads.filter((l) => passou(l, "proposta") || passou(l, "cliente")).length;
  const listaClientes = leads.filter((l) => l.etapa === "cliente");
  const clientes = listaClientes.length;

  const receita = listaClientes.reduce((s, l) => {
    const fee = Number(l.fee_mensal || 0), meses = Number(l.meses_previstos || 0);
    return s + (fee && meses ? fee * meses : Number(l.valor_contrato || 0));
  }, 0);

  return {
    investimento, cliques, impressoes, escada,
    leads: leads.length, qualificados, marcadas, compareceu, noShow, propostas, clientes, receita,
    cpl: leads.length ? investimento / leads.length : null,
    cplQualificado: qualificados ? investimento / qualificados : null,
    custoReuniao: compareceu ? investimento / compareceu : null,
    cac: clientes ? investimento / clientes : null,
    taxaQualificacao: leads.length ? qualificados / leads.length : null,
    taxaAgendamento: qualificados ? marcadas / qualificados : null,
    taxaNoShow: (compareceu + noShow) ? noShow / (compareceu + noShow) : null,
  };
}

function vazamentos(m, valorCliente) {
  const e = m.escada;
  const passos = [
    { nome: "Clique não vira visita", de: e.clique, para: e.form_view, ref: REFERENCIA.clique_view,
      causa: "Perda no carregamento. Página lenta ou clique acidental." },
    { nome: "Visita não começa o form", de: e.form_view, para: e.form_start, ref: REFERENCIA.view_start,
      causa: "A promessa do criativo não bate com a headline. É problema de anúncio, não de página." },
    { nome: "Começa e não dá o telefone", de: e.form_start, para: e.lead, ref: REFERENCIA.start_lead,
      causa: "Atrito nas três primeiras perguntas." },
    { nome: "Dá o telefone e abandona", de: e.lead, para: e.form_complete, ref: REFERENCIA.lead_completo,
      causa: "As perguntas de faturamento e verba estão espantando." },
    // Filtro de publico, nao vazamento: sem referencia, nunca e acusado. Entra na
    // lista porque a cadeia ate o contrato precisa dele, senao o valor dos
    // degraus de cima sai inflado em varias vezes.
    { nome: "Completou mas fora do perfil", de: e.form_complete, para: m.qualificados, ref: null,
      causa: "Filtro de faturamento fazendo o trabalho dele." },
    { nome: "Qualificado não abre a agenda", de: m.qualificados, para: e.scheduler_view, ref: REFERENCIA.qualif_agenda,
      causa: "Quebra no redirecionamento do formulário para o /agendar." },
    { nome: "Abre a agenda e não marca", de: e.scheduler_view, para: m.marcadas, ref: REFERENCIA.agenda_marcou,
      causa: "Falta de horário disponível, não falta de interesse." },
    { nome: "Marca e não aparece", de: m.marcadas, para: m.compareceu, ref: REFERENCIA.marcou_compareceu,
      causa: "Sem lembrete entre a marcação e a reunião." },
    { nome: "Reunião sem proposta", de: m.compareceu, para: m.propostas, ref: REFERENCIA.compareceu_prop,
      causa: "A reunião não está terminando com próximo passo definido." },
    { nome: "Proposta sem contrato", de: m.propostas, para: m.clientes, ref: REFERENCIA.prop_cliente,
      causa: "Preço, prazo ou follow-up." },
  ];

  const taxas = passos.map((p) => (p.de ? p.para / p.de : 0));
  return passos.map((p, i) => {
    const taxa = p.de ? p.para / p.de : null;
    const perdidos = p.de && taxa !== null && p.ref ? Math.max(0, p.de * p.ref - p.para) : 0;
    let ateOFim = 1;
    for (let j = i + 1; j < taxas.length; j++) ateOFim *= taxas[j];
    return { ...p, taxa, perdidos, impacto: perdidos * ateOFim * valorCliente,
      abaixo: p.ref !== null && taxa !== null && taxa < p.ref };
  }).sort((a, b) => b.impacto - a.impacto);
}

function temposDeFunil(d) {
  const porLead = new Map();
  for (const e of d.etapas) {
    if (!porLead.has(e.lead_id)) porLead.set(e.lead_id, {});
    const m = porLead.get(e.lead_id);
    if (!m[e.para]) m[e.para] = new Date(e.em);
  }
  const dias = (a, b) => (b - a) / 86400000;
  const juntar = (de, para) => {
    const v = [];
    for (const m of porLead.values()) if (m[de] && m[para] && m[para] >= m[de]) v.push(dias(m[de], m[para]));
    return v;
  };

  const ateCliente = juntar("novo", "cliente");
  const med = mediana(ateCliente);

  // Medir so quem fechou enviesa pra baixo: quem demora ainda nao apareceu na
  // conta. Por isso vai junto quantos seguem abertos alem dessa mediana.
  let abertosAlem = 0;
  if (med !== null) {
    const agora = new Date();
    for (const m of porLead.values()) {
      if (m.cliente || !m.novo) continue;
      if (dias(m.novo, agora) > med) abertosAlem++;
    }
  }
  return {
    etapas: [
      { rot: "Lead ate agendar", v: mediana(juntar("novo", "agendou")) },
      { rot: "Agendar ate reunir", v: mediana(juntar("agendou", "reuniao")) },
      { rot: "Reuniao ate proposta", v: mediana(juntar("reuniao", "proposta")) },
      { rot: "Proposta ate contrato", v: mediana(juntar("proposta", "cliente")) },
    ],
    novoCliente: med, fechados: ateCliente.length, abertosAlem,
  };
}

/* ---- series ---- */

function chaveDia(d) {
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
}

function serieDiaria(d) {
  const limite = corte();
  let inicio;
  if (limite) inicio = new Date(limite);
  else {
    const datas = [...d.leads.map((l) => new Date(l.created_at)), ...d.midia.map((m) => new Date(m.data + "T12:00:00"))];
    inicio = datas.length ? new Date(Math.min(...datas)) : new Date();
    inicio.setHours(0, 0, 0, 0);
  }
  const fim = new Date(); fim.setHours(0, 0, 0, 0);

  const linhas = [];
  for (const dia = new Date(inicio); dia <= fim; dia.setDate(dia.getDate() + 1)) {
    linhas.push({ chave: chaveDia(dia), data: new Date(dia), leads: 0, qualificados: 0, investimento: 0, cliques: 0 });
  }
  const porChave = Object.fromEntries(linhas.map((l) => [l.chave, l]));

  for (const l of d.leads) {
    const r = porChave[chaveDia(l.created_at)];
    if (!r) continue;
    r.leads++;
    if (l.qualificado === true) r.qualificados++;
  }
  for (const m of d.midia) {
    const r = porChave[m.data];
    if (!r) continue;
    r.investimento += Number(m.investimento || 0);
    r.cliques += Number(m.cliques_no_link || 0);
  }
  return linhas;
}

function inicioDaSemana(iso) {
  const x = new Date(iso);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - x.getDay());
  return chaveDia(x);
}

function porSemana(d, serie) {
  const semanas = new Map();
  const garantir = (k) => {
    if (!semanas.has(k)) semanas.set(k, { chave: k, vet: 0, eventos: 0, generico: 0, total: 0, qualificados: 0, investimento: 0 });
    return semanas.get(k);
  };
  for (const l of d.leads) {
    const r = garantir(inicioDaSemana(l.created_at));
    r[l.nicho || "generico"] = (r[l.nicho || "generico"] || 0) + 1;
    r.total++;
    if (l.qualificado === true) r.qualificados++;
  }
  for (const s of serie) garantir(inicioDaSemana(s.data)).investimento += s.investimento;
  return [...semanas.values()].sort((a, b) => a.chave.localeCompare(b.chave));
}

function distribuicao(leads, campo) {
  const m = new Map();
  for (const l of leads) {
    const v = l[campo];
    if (!v) continue;
    m.set(v, (m.get(v) || 0) + 1);
  }
  return [...m.entries()].map(([rot, n]) => ({ rot, n })).sort((a, b) => b.n - a.n);
}

function mapaCalor(leads) {
  const faixas = ["00-03", "03-06", "06-09", "09-12", "12-15", "15-18", "18-21", "21-24"];
  const grade = faixas.map(() => [0, 0, 0, 0, 0, 0, 0]);
  for (const l of leads) {
    const d = new Date(l.created_at);
    grade[Math.floor(d.getHours() / 3)][d.getDay()]++;
  }
  return { faixas, grade, maximo: Math.max(1, ...grade.flat()) };
}

/* ====================== veredito ====================== */

function pct(x, casas = 0) { return x === null || x === undefined || isNaN(x) ? "n/d" : (x * 100).toFixed(casas) + "%"; }

function montarVeredito(geral, porNicho, vaz, tempos) {
  const blocos = [];
  const janela = estado.janela === 0 ? "Desde o início" : `Nos últimos ${estado.janela} dias`;
  const escopo = estado.nicho ? ` (só ${NOME_NICHO[estado.nicho]})` : "";

  blocos.push({
    rot: "Situação",
    txt: `${janela}${escopo}: <b>${DINHEIRO.format(geral.investimento)}</b> investidos, <b>${geral.leads}</b> leads, ` +
      `<b>${geral.qualificados}</b> dentro do perfil, <b>${geral.compareceu}</b> ${geral.compareceu === 1 ? "reunião feita" : "reuniões feitas"} e ` +
      `<b>${geral.clientes}</b> ${geral.clientes === 1 ? "contrato" : "contratos"}. ` +
      (geral.cplQualificado ? `Lead que presta custa <b>${DINHEIRO.format(geral.cplQualificado)}</b>.` : "Ainda sem lead dentro do perfil."),
  });

  const pior = vaz.filter((v) => v.abaixo && v.impacto > 0)[0];
  blocos.push(pior ? {
    rot: "Vazamento mais caro", alerta: true,
    txt: `<b>${pior.nome}</b>: passam ${pct(pior.taxa)} contra ${pct(pior.ref)} de referência. ` +
      `As <b>${Math.round(pior.perdidos)}</b> pessoas perdidas ali valem <b>${DINHEIRO.format(pior.impacto)}</b> em contrato. ${pior.causa}`,
  } : {
    rot: "Vazamento mais caro",
    txt: "Nenhum degrau está abaixo da referência. O funil não é o gargalo agora, o volume é.",
  });

  const comVolume = porNicho.filter((n) => n.m.leads >= 5);
  if (comVolume.length >= 2) {
    const ord = [...comVolume].sort((a, b) => b.m.taxaQualificacao - a.m.taxaQualificacao);
    const melhor = ord[0], pior2 = ord[ord.length - 1];
    const p = testeZ(melhor.m.qualificados, melhor.m.leads, pior2.m.qualificados, pior2.m.leads);
    const probs = probabilidadeDeSerMelhor(comVolume.map((n) => ({ k: n.m.qualificados, n: n.m.leads })));
    const i = comVolume.findIndex((n) => n.chave === melhor.chave);

    if (p < 0.05) {
      blocos.push({ rot: "Decisão da semana",
        txt: `<b>${NOME_NICHO[melhor.chave]}</b> qualifica ${pct(melhor.m.taxaQualificacao)} contra ${pct(pior2.m.taxaQualificacao)} de ` +
          `${NOME_NICHO[pior2.chave]}, e a diferença já é sólida (p = ${p.toFixed(3)}). Tem <b>${pct(probs[i])}</b> de chance de ser o melhor. ` +
          `Move verba de ${NOME_NICHO[pior2.chave]} para ${NOME_NICHO[melhor.chave]}, sem desligar o terceiro.` });
    } else {
      const faltam = amostraNecessaria(melhor.m.taxaQualificacao, pior2.m.taxaQualificacao);
      blocos.push({ rot: "Decisão da semana",
        txt: `Nenhuma diferença entre nichos é conclusiva (p = ${p.toFixed(3)}). <b>Não mexe na verba.</b> ` +
          `Para afirmar que ${NOME_NICHO[melhor.chave]} é melhor faltam cerca de <b>${isFinite(faltam) ? faltam : "muitos"}</b> leads por nicho.` });
    }
  } else {
    blocos.push({ rot: "Decisão da semana", txt: "<b>Não mexe na verba.</b> Ainda não há 5 leads em dois nichos, então comparar é ler sorte." });
  }

  const travas = [];
  if (geral.clientes < 5) travas.push(`CAC por nicho, com ${geral.clientes} ${geral.clientes === 1 ? "contrato" : "contratos"} no total`);
  if (geral.compareceu + geral.noShow < 10) travas.push(`taxa de no-show, com ${geral.compareceu + geral.noShow} reuniões já resolvidas`);
  if (tempos.novoCliente === null) travas.push("tempo até o fechamento, porque ninguém percorreu o ciclo inteiro");
  else if (tempos.fechados < 5) travas.push(`tempo de fechamento, com ${tempos.fechados} fechados e ${tempos.abertosAlem} ainda abertos além da mediana`);

  blocos.push({ rot: "O que ainda não dá para decidir",
    txt: travas.length ? "Não conclua sobre " + travas.join("; ") + "." : "Nada travado por amostra. Os números sustentam decisão." });

  return blocos;
}

function faisca(id, valores, cor) {
  const el = document.getElementById(id);

/* Funil em SVG: trapezios encadeados, largura proporcional ao volume. */
function funilSvg(passos) {
  const largura = 780, alturaPasso = 44, vao = 4;
  const altura = passos.length * (alturaPasso + vao);
  const maximo = Math.max(...passos.map((p) => p.valor), 1);
  const meio = largura / 2;
  let svg = `<svg viewBox="0 0 ${largura} ${altura}" class="funil-svg" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6A00"/><stop offset="100%" stop-color="#FFA45C"/></linearGradient></defs>`;

  passos.forEach((p, i) => {
    const prox = passos[i + 1];
    const l1 = Math.max((p.valor / maximo) * largura * 0.66, 3);
    const l2 = Math.max(((prox ? prox.valor : p.valor) / maximo) * largura * 0.66, 3);
    const y = i * (alturaPasso + vao);
    svg += `<polygon points="${meio - l1 / 2},${y} ${meio + l1 / 2},${y} ${meio + l2 / 2},${y + alturaPasso} ${meio - l2 / 2},${y + alturaPasso}"
      fill="${p.fraco ? "#F87171" : "url(#gf)"}" opacity="${p.fraco ? .55 : .9}"/>`;
    svg += `<text x="4" y="${y + alturaPasso / 2 + 4}" fill="#8A8A8A" font-size="12" font-family="Switzer,sans-serif">${p.rot}</text>`;
    svg += `<text x="${meio}" y="${y + alturaPasso / 2 + 5}" fill="#0A0A0A" font-size="13" font-weight="700"
      text-anchor="middle" font-family="JetBrains Mono,monospace">${p.valor}</text>`;
    if (p.taxa !== null && p.taxa !== undefined) {
      svg += `<text x="${largura - 4}" y="${y + alturaPasso / 2 + 4}" fill="${p.fraco ? "#F87171" : "#FAFAFA"}" font-size="11.5"
        text-anchor="end" font-family="JetBrains Mono,monospace">${pct(p.taxa, 1)}</text>`;
    }
  });
  return svg + "</svg>";
}

  <div class="kpis">
    ${kpi("Investido", DINHEIRO.format(geral.investimento), `${geral.cliques} cliques`, "", "fx-inv")}
    ${kpi("Leads", geral.leads, geral.cpl ? `CPL ${DINHEIRO.format(geral.cpl)}` : "sem custo", "", "fx-leads")}
    ${kpi("CPL qualificado", geral.cplQualificado ? DINHEIRO.format(geral.cplQualificado) : "n/d",
      `${geral.qualificados} no perfil (${pct(geral.taxaQualificacao)})`, "", "fx-qual")}
    ${kpi("Custo por reunião", geral.custoReuniao ? DINHEIRO.format(geral.custoReuniao) : "n/d", `${geral.compareceu} realizadas`)}
    ${kpi("No-show", pct(geral.taxaNoShow), `${geral.noShow} de ${geral.compareceu + geral.noShow} resolvidas`,
      geral.taxaNoShow !== null ? (geral.taxaNoShow > 0.3 ? "ruim" : "bom") : "")}
    ${kpi("CAC", geral.cac ? DINHEIRO.format(geral.cac) : "n/d",
      geral.cac ? `retorno em ${(geral.cac / FEE_MENSAL).toFixed(1)} ${geral.cac / FEE_MENSAL < 2 ? "mês" : "meses"}` : "sem contrato")}
    ${kpi("LTV / CAC", geral.cac ? (valorCliente / geral.cac).toFixed(1) + "x" : "n/d",
      `contrato de ${DINHEIRO.format(valorCliente)}`, geral.cac ? (valorCliente / geral.cac >= 3 ? "bom" : "ruim") : "")}
    ${kpi("Receita fechada", DINHEIRO.format(geral.receita), `${geral.clientes} ${geral.clientes === 1 ? "contrato" : "contratos"}`)}
  </div>

  <div class="grade">
    <div class="cartao c7">
      <h2>Funil completo</h2>
      <div class="sub">Do clique ao contrato. A porcentagem à direita é a passagem do degrau de cima. Vermelho é abaixo da referência de mercado.</div>
      ${funilSvg(passosFunil)}
    </div>
    <div class="cartao c5">
      <h2>Volume e investimento</h2>
      <div class="sub">Leads por dia contra o gasto diário. A linha cheia é a média móvel de 7 dias, que é onde a tendência aparece sem o ruído.</div>
      <div class="tela alta"><canvas id="g-serie"></canvas></div>
    </div>
  </div>

  <div class="grade">
    <div class="cartao c4">
      <h2>Leads por nicho</h2>
      <div class="sub">Fatia do volume total.</div>
      <div class="tela"><canvas id="g-rosca-nicho"></canvas></div>
    </div>
    <div class="cartao c4">
      <h2>Qualificação por nicho</h2>
      <div class="sub">A barra inteira é o total de leads. A parte colorida é quem passou no filtro de R$ 70 mil.</div>
      <div class="tela"><canvas id="g-qualif-nicho"></canvas></div>
    </div>
    <div class="cartao c4">
      <h2>CPL qualificado por semana</h2>
      <div class="sub">Faixa clara é a média com dois desvios. Só vale mexer na campanha quando o ponto sai da faixa.</div>
      <div class="tela"><canvas id="g-controle"></canvas></div>
    </div>
  </div>

  <div class="grade">
    <div class="cartao c6">
      <h2>Leads por semana e por nicho</h2>
      <div class="sub">Empilhado, para ver composição e tendência ao mesmo tempo.</div>
      <div class="tela"><canvas id="g-semana"></canvas></div>
    </div>
    <div class="cartao c6">
      <h2>Onde o dinheiro vaza</h2>
      <div class="sub">Ordenado por impacto em reais, não por porcentagem: queda grande num degrau vazio vale menos que queda pequena num degrau cheio.</div>
      <div class="tela"><canvas id="g-vazamento"></canvas></div>
    </div>
  </div>

  <div class="grade">
    <div class="cartao c4">
      <h2>Faturamento declarado</h2>
      <div class="sub">De quem completou o formulário.</div>
      <div class="tela"><canvas id="g-faturamento"></canvas></div>
    </div>
    <div class="cartao c4">
      <h2>Verba declarada</h2>
      <div class="sub">Quanto pretendem investir por mês em mídia.</div>
      <div class="tela"><canvas id="g-verba"></canvas></div>
    </div>
    <div class="cartao c4">
      <h2>Já investe em tráfego?</h2>
      <div class="sub">Calibra a abordagem da reunião antes de você entrar nela.</div>
      <div class="tela"><canvas id="g-investe"></canvas></div>
    </div>
  </div>

  <div class="grade">
    <div class="cartao c5">
      <h2>Quando o lead chega</h2>
      <div class="sub">Dia da semana contra faixa de horário. Diz a melhor hora para responder, não para anunciar.</div>
      <div class="mapa">
        <div></div>${diasSemana.map((x) => `<div class="topo-col">${x}</div>`).join("")}
        ${calor.faixas.map((f, i) => `<div class="rotulo">${f}</div>` +
          calor.grade[i].map((v) => `<div class="cel" style="background:rgba(255,106,0,${(0.05 + (v / calor.maximo) * 0.9).toFixed(3)})" title="${v} lead(s)">${v || ""}</div>`).join("")).join("")}
      </div>
    </div>
    <div class="cartao c3">
      <h2>Posicionamento</h2>
      <div class="sub">Onde o anúncio foi visto antes do clique.</div>
      <div class="tela"><canvas id="g-posicionamento"></canvas></div>
    </div>
    <div class="cartao c4">
      <h2>Quanto tempo leva cada etapa</h2>
      <div class="sub">Mediana, nunca média: um negócio de seis meses distorce a média inteira.</div>
      <div class="tela"><canvas id="g-tempo"></canvas></div>
      ${tempos.novoCliente !== null
        ? `<div class="nota">Lead até contrato: <b>${dia(tempos.novoCliente)}</b> na mediana, com ${tempos.fechados} fechados. ${tempos.abertosAlem} lead(s) já passaram desse tempo e seguem abertos, então trate como piso, não como previsão.</div>`
        : `<div class="nota">Nenhum lead percorreu o ciclo inteiro ainda.</div>`}
    </div>
  </div>

  <div class="grade">
    <div class="cartao c12">
      <h2>Nichos, lado a lado</h2>
      <div class="sub">A última coluna não é a taxa, é a probabilidade daquele nicho ser o melhor em qualificação, por posterior Beta. Linha destacada é a líder.</div>
      <div class="rolagem"><table>
        <thead><tr>
          <th>Nicho</th><th>Investido</th><th>Leads</th><th>CPL</th><th>Qualif.</th><th>Taxa</th>
          <th>CPL qualif.</th><th>Marcadas</th><th>Feitas</th><th>No-show</th><th>Custo/reunião</th><th>Contratos</th><th>CAC</th><th>Chance de ser o melhor</th>
        </tr></thead>
        <tbody>${porNicho.map((n, i) => {
          const m = n.m;
          return `<tr class="${probs[i] !== null && probs[i] === melhorProb ? "destaque" : ""}">
            <td>${selo(n.chave)}</td>
            <td>${DINHEIRO.format(m.investimento)}</td>
            <td>${m.leads}</td>
            <td>${m.cpl ? DINHEIRO.format(m.cpl) : "n/d"}</td>
            <td>${m.qualificados}</td>
            <td class="${m.taxaQualificacao >= .3 ? "bom" : m.taxaQualificacao < .15 ? "ruim" : ""}">${pct(m.taxaQualificacao)}</td>
            <td>${m.cplQualificado ? DINHEIRO.format(m.cplQualificado) : "n/d"}</td>
            <td>${m.marcadas}</td><td>${m.compareceu}</td>
            <td class="${m.taxaNoShow !== null && m.taxaNoShow > .3 ? "ruim" : ""}">${pct(m.taxaNoShow)}</td>
            <td>${m.custoReuniao ? DINHEIRO.format(m.custoReuniao) : "n/d"}</td>
            <td>${m.clientes}</td>
            <td>${m.cac ? DINHEIRO.format(m.cac) : "n/d"}</td>
            <td>${probs[i] === null ? "n/d" : pct(probs[i])}</td>
          </tr>`;
        }).join("") || `<tr><td colspan="14" class="vazio">Sem dado no período.</td></tr>`}</tbody>
      </table></div>
    </div>
  </div>

  <div class="grade">
    <div class="cartao c12">
      <h2>Criativos</h2>
      <div class="sub">Casamento pelo ID do anúncio, então renomear criativo no gerenciador não quebra o histórico.</div>
      <div class="rolagem"><table>
        <thead><tr><th>Anúncio</th><th>Investido</th><th>Impressões</th><th>CTR</th><th>CPC</th><th>Freq.</th><th>Leads</th><th>CPL</th><th>Qualif.</th><th>Taxa</th><th>CPL qualif.</th><th>Contratos</th></tr></thead>
        <tbody>${ads.map((r) => `<tr>
          <td>${r.nome}</td>
          <td>${DINHEIRO.format(r.investimento)}<div class="barrinha"><i style="width:${Math.round((r.investimento / maiorGasto) * 100)}%"></i></div></td>
          <td>${r.impressoes.toLocaleString("pt-BR")}</td>
          <td>${r.impressoes ? ((r.cliques / r.impressoes) * 100).toFixed(2) + "%" : "n/d"}</td>
          <td>${r.cliques ? "R$ " + (r.investimento / r.cliques).toFixed(2) : "n/d"}</td>
          <td class="${r.dias && r.freq / r.dias > 2.5 ? "ruim" : ""}">${r.dias ? (r.freq / r.dias).toFixed(2) : "n/d"}</td>
          <td>${r.leads}</td>
          <td>${r.leads ? DINHEIRO.format(r.investimento / r.leads) : "n/d"}</td>
          <td>${r.qualificados}</td>
          <td class="${r.leads && r.qualificados / r.leads >= .3 ? "bom" : r.leads && r.qualificados / r.leads < .15 ? "ruim" : ""}">${r.leads ? pct(r.qualificados / r.leads) : "n/d"}</td>
          <td>${r.qualificados ? DINHEIRO.format(r.investimento / r.qualificados) : "n/d"}</td>
          <td>${r.clientes}</td>
        </tr>`).join("") || `<tr><td colspan="12" class="vazio">Sem dado de mídia no período.</td></tr>`}</tbody>
      </table></div>
      <div class="nota">Frequência acima de 2,5 numa janela curta significa que o público efetivo é menor do que parece, e o CPL tende a subir daí em diante.</div>
    </div>
  </div>

  <div class="grade">
    <div class="cartao c12">
      <h2>Degraus contra a referência</h2>
      <div class="sub">Cada degrau com o intervalo real da taxa. Com volume baixo, o intervalo importa mais que a taxa.</div>
      <div class="rolagem"><table>
        <thead><tr><th>Degrau</th><th>Entram</th><th>Passam</th><th>Taxa</th><th>Intervalo real</th><th>Referência</th><th>Perdidos a mais</th><th>Vale</th></tr></thead>
        <tbody>${vaz.map((v) => {
          const [lo, hi] = v.de ? wilson(v.para, v.de) : [null, null];
          return `<tr>
            <td>${v.nome}</td><td>${v.de}</td><td>${v.para}</td>
            <td class="${v.abaixo ? "ruim" : v.ref ? "bom" : ""}">${pct(v.taxa, 1)}</td>
            <td style="color:var(--nevoa)">${lo === null ? "n/d" : pct(lo) + " a " + pct(hi)}</td>
            <td>${v.ref === null ? "filtro" : pct(v.ref)}</td>
            <td>${v.perdidos > 0 ? Math.round(v.perdidos) : "-"}</td>
            <td class="${v.impacto > 0 ? "ruim" : ""}">${v.impacto > 0 ? DINHEIRO.format(v.impacto) : "-"}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>
    </div>
  </div>`;

  /* ================= graficos ================= */

  faisca("fx-inv", serie.map((s) => s.investimento), CORES.ambar);
  faisca("fx-leads", serie.map((s) => s.leads), CORES.azul);
  faisca("fx-qual", serie.map((s) => s.qualificados), CORES.verde);

  fazer("g-serie", {
    data: { labels: serie.map((s) => s.data.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })), datasets: [
      { type: "bar", label: "Leads", data: serie.map((s) => s.leads), backgroundColor: "rgba(96,165,250,.5)", borderRadius: 3, yAxisID: "y", order: 3 },
      { type: "line", label: "Leads (média 7d)", data: mediaMovel(serie.map((s) => s.leads), 7),
        borderColor: CORES.azul, borderWidth: 2, pointRadius: 0, tension: .4, yAxisID: "y", order: 1 },
      { type: "line", label: "Investimento", data: serie.map((s) => s.investimento), borderColor: CORES.ambar,
        borderWidth: 2, pointRadius: 0, tension: .4, yAxisID: "y2", order: 2, borderDash: [4, 3] },
    ] },
    type: "bar",
    options: { interaction: { mode: "index", intersect: false }, plugins: { legend: legenda },
      scales: {
        x: eixo({ grid: { display: false } }),
        y: eixo({ beginAtZero: true }),
        y2: eixo({ position: "right", beginAtZero: true, grid: { display: false }, ticks: { callback: (v) => "R$" + v } }),
      } },
  });

  fazer("g-rosca-nicho", {
    type: "doughnut",
    data: { labels: porNicho.map((n) => NOME_NICHO[n.chave]),
      datasets: [{ data: porNicho.map((n) => n.m.leads), backgroundColor: porNicho.map((n) => COR_NICHO[n.chave]),
        borderColor: "#141414", borderWidth: 3, hoverOffset: 6 }] },
    options: { cutout: "62%", plugins: { legend: legenda,
      tooltip: Object.assign({}, dica, { callbacks: { label: (c) => {
        const total = c.dataset.data.reduce((a, b) => a + b, 0);
        return ` ${c.label}: ${c.parsed} (${total ? ((c.parsed / total) * 100).toFixed(0) : 0}%)`;
      } } }) } },
  });

  fazer("g-qualif-nicho", {
    type: "bar",
    data: { labels: porNicho.map((n) => NOME_NICHO[n.chave]), datasets: [
      { label: "Dentro do perfil", data: porNicho.map((n) => n.m.qualificados),
        backgroundColor: porNicho.map((n) => COR_NICHO[n.chave]), borderRadius: 4, stack: "s" },
      { label: "Fora do perfil", data: porNicho.map((n) => n.m.leads - n.m.qualificados),
        backgroundColor: "rgba(138,138,138,.25)", borderRadius: 4, stack: "s" },
    ] },
    options: { plugins: { legend: legenda },
      scales: { x: eixo({ stacked: true, grid: { display: false } }), y: eixo({ stacked: true, beginAtZero: true }) } },
  });

  const cplSemana = semanas.map((s) => (s.qualificados ? s.investimento / s.qualificados : null));
  const validos = cplSemana.filter((v) => v !== null && isFinite(v));
  const mediaCpl = validos.length ? validos.reduce((a, b) => a + b, 0) / validos.length : 0;
  const sigma = desvio(validos);
  fazer("g-controle", {
    type: "line",
    data: { labels: semanas.map((s) => rotSemana(s.chave)), datasets: [
      { label: "Limite superior", data: semanas.map(() => mediaCpl + 2 * sigma), borderColor: "rgba(255,255,255,.15)",
        borderWidth: 1, pointRadius: 0, borderDash: [5, 4], fill: "+1", backgroundColor: "rgba(255,255,255,.035)" },
      { label: "Limite inferior", data: semanas.map(() => Math.max(0, mediaCpl - 2 * sigma)), borderColor: "rgba(255,255,255,.15)",
        borderWidth: 1, pointRadius: 0, borderDash: [5, 4] },
      { label: "CPL qualificado", data: cplSemana, borderColor: CORES.ambar, borderWidth: 2.4,
        pointRadius: 3.5, pointBackgroundColor: CORES.ambar, tension: .3, spanGaps: true },
    ] },
    options: { plugins: { tooltip: Object.assign({}, dica, { callbacks: { label: (c) => ` ${c.dataset.label}: ${c.parsed.y === null ? "n/d" : DINHEIRO.format(c.parsed.y)}` } }) },
      scales: { x: eixo({ grid: { display: false } }), y: eixo({ beginAtZero: true, ticks: { callback: (v) => "R$" + Math.round(v) } }) } },
  });

  fazer("g-semana", {
    type: "bar",
    data: { labels: semanas.map((s) => rotSemana(s.chave)),
      datasets: chaves.map((c) => ({ label: NOME_NICHO[c], data: semanas.map((s) => s[c] || 0),
        backgroundColor: COR_NICHO[c], borderRadius: 3, stack: "s" })) },
    options: { plugins: { legend: legenda },
      scales: { x: eixo({ stacked: true, grid: { display: false } }), y: eixo({ stacked: true, beginAtZero: true }) } },
  });

  const vazTop = vaz.filter((v) => v.impacto > 0).slice(0, 6);
  fazer("g-vazamento", {
    type: "bar",
    data: { labels: vazTop.map((v) => v.nome), datasets: [{ data: vazTop.map((v) => Math.round(v.impacto)),
      backgroundColor: vazTop.map((_, i) => (i === 0 ? CORES.vermelho : "rgba(248,113,113,.32)")), borderRadius: 4 }] },
    options: { indexAxis: "y",
      plugins: { tooltip: Object.assign({}, dica, { callbacks: { label: (c) => " " + DINHEIRO.format(c.parsed.x) + " em contrato" } }) },
      scales: { x: eixo({ beginAtZero: true, ticks: { callback: (v) => "R$" + v } }),
        y: eixo({ grid: { display: false }, ticks: { font: { size: 10.5 } } }) } },
  });

  const rosca = (id, dados, cores) => fazer(id, {
    type: "doughnut",
    data: { labels: dados.map((x) => x.rot), datasets: [{ data: dados.map((x) => x.n),
      backgroundColor: cores, borderColor: "#141414", borderWidth: 3, hoverOffset: 6 }] },
    options: { cutout: "58%", plugins: { legend: Object.assign({}, legenda, { labels: Object.assign({}, legenda.labels, { padding: 7, font: { size: 10 } }) }) } },
  });

  rosca("g-faturamento", distribuicao(d.leads, "faturamento"), ["#F87171", "#FACC15", "#4ADE80", "#22D3EE", "#60A5FA"]);
  rosca("g-verba", distribuicao(d.leads, "verba"), ["#F87171", "#FACC15", "#4ADE80", "#22D3EE", "#A78BFA"]);
  rosca("g-investe", distribuicao(d.leads, "ja_investe"), ["#FF6A00", "#60A5FA", "#8A8A8A"]);

  fazer("g-posicionamento", {
    type: "bar",
    data: { labels: posicionamentos.map((p) => p.rot.replace(/_/g, " ")),
      datasets: [{ data: posicionamentos.map((p) => p.n), backgroundColor: CORES.ciano, borderRadius: 4 }] },
    options: { indexAxis: "y",
      scales: { x: eixo({ beginAtZero: true }), y: eixo({ grid: { display: false }, ticks: { font: { size: 10 } } }) } },
  });

  fazer("g-tempo", {
    type: "bar",
    data: { labels: tempos.etapas.map((t) => t.rot),
      datasets: [{ data: tempos.etapas.map((t) => (t.v === null ? 0 : Number(t.v.toFixed(2)))),
        backgroundColor: [CORES.azul, CORES.ciano, CORES.roxo, CORES.verde], borderRadius: 4 }] },
    options: { indexAxis: "y",
      plugins: { tooltip: Object.assign({}, dica, { callbacks: { label: (c) => " " + dia(c.parsed.x) } }) },
      scales: { x: eixo({ beginAtZero: true, ticks: { callback: (v) => v + "d" } }),
        y: eixo({ grid: { display: false }, ticks: { font: { size: 10.5 } } }) } },
  });

  document.querySelectorAll("#seg-janela button").forEach((b) =>
    b.addEventListener("click", () => { estado.janela = Number(b.dataset.janela); desenhar(); }));
  document.querySelectorAll("#seg-nicho button").forEach((b) =>
    b.addEventListener("click", () => { estado.nicho = b.dataset.nicho || null; desenhar(); }));
  document.getElementById("btn-simulado").addEventListener("click", () => {
    estado.simulado = !estado.simulado; desenhar();
  });
}

/* ====================== entrada ====================== */

(async function iniciar() {
  const raiz = document.getElementById("raiz");
  try {
    const { data } = await sb.auth.getSession();
    if (!data.session) {
      raiz.innerHTML = `<div class="carregando">Sessão expirada. <a href="/funil/" style="color:#FF6A00">Entrar no painel</a> e voltar aqui.</div>`;
      return;
    }
    estado.dados = await carregarTudo();
    desenhar();
  } catch (erro) {
    raiz.innerHTML = `<div class="carregando">Não consegui carregar: ${erro.message}</div>`;
  }
})();
</script>
</body>
</html>
