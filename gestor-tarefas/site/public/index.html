<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tarefas | The New Ads</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<script src="/tema.js?v=10"></script>
<link rel="icon" type="image/svg+xml" href="/icone.svg">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tarefas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/estilo.css?v=11">
<link rel="stylesheet" href="/workspace.css?v=26">
<link rel="stylesheet" href="/toolbar.css?v=12">
</head>
<body>
<!-- THESIS: um workspace compacto para receber, atribuir e acompanhar demandas de três pessoas.
OWN-WORLD: superfícies brancas, lateral cinza, destaque violeta e fontes nativas de interface.
STORY: encontrar demanda, identificar responsável e prazo, atualizar status na lista ou no quadro.
FIRST VIEWPORT: navegação de espaços à esquerda, título e criação acima, filtros e tarefas no centro.
FORM: interface operacional familiar, inspirada no ClickUp conforme pedido explícito do usuário.
FINISH: revisão visual em desktop e celular, testes funcionais e registro do sistema em DESIGN.md. -->

<!-- ============ LOGIN ============ -->
<div class="login" id="tela-login">
  <div class="caixa">
    <div class="marca"><img src="/icone.svg" alt=""> Tarefas</div>
    <label class="seletor-tema">Tema <select data-tema aria-label="Tema da tela de acesso"><option value="claro">Claro</option><option value="escuro">Escuro</option><option value="sistema">Sistema</option></select></label>

    <form id="form-login">
      <h1>Entrar</h1>
      <p class="sub">Gestor de tarefas da The New Ads.</p>
      <div class="campo"><label for="email">E-mail</label><input type="email" id="email" autocomplete="username" required></div>
      <div class="campo"><label for="senha">Senha</label><input type="password" id="senha" autocomplete="current-password" required></div>
      <button class="btn btn-largo" id="btn-entrar">Entrar</button>
      <p class="aviso" id="aviso-login"></p>
    </form>

    <form id="form-codigo" style="display:none">
      <h1>Código de acesso</h1>
      <p class="sub">Digite o código de 6 dígitos do seu aplicativo autenticador.</p>
      <div class="campo"><label for="codigo-2fa">Código</label><input type="text" id="codigo-2fa" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>
      <button class="btn btn-largo" id="btn-verificar">Verificar</button>
      <p class="aviso" id="aviso-codigo"></p>
    </form>

    <div id="sem-acesso" style="display:none">
      <h1>Sem acesso</h1>
      <p class="sub">Sua conta existe, mas ainda não foi liberada no gestor de tarefas. Peça a um admin para te adicionar.</p>
      <button class="btn btn-fantasma btn-largo" data-acao="sair">Sair</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app" id="app">
  <header class="barra-movel">
    <button class="icone-btn" data-acao="abrir-menu" aria-label="Abrir menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="barra-titulo" id="barra-titulo">Tarefas</span>
    <button class="icone-btn" data-acao="nova-tarefa-rapida" aria-label="Nova tarefa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <aside id="lateral">
    <div class="marca"><img src="/icone.svg" alt=""> Tarefas</div>
    <nav class="nav-fixa">
      <button data-rota="#/central" id="nav-central">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Central <span class="contador alerta" id="cont-atraso"></span>
      </button>
    </nav>
    <div class="arvore-cabeca">
      <span>Espaços</span>
      <button class="icone-btn mini" data-acao="novo-projeto" title="Novo espaço" aria-label="Novo espaço">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="arvore" id="arvore"></div>
    <div class="rodape">
      <button data-rota="#/ajustes" id="nav-ajustes" class="link-rodape">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        Ajustes
      </button>
    </div>
  </aside>
  <div class="veu" data-acao="fechar-menu"></div>

  <main id="conteudo"></main>

  <div class="gaveta-veu" id="gaveta-veu" data-acao="fechar-tarefa"></div>
  <section class="gaveta" id="gaveta" aria-label="Tarefa" inert></section>
</div>

<div class="modal-veu" id="modal-veu"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="menu-flutuante" id="menu-flutuante"></div>
<div class="barra-lote" id="barra-lote" role="toolbar" aria-label="Ações para as tarefas selecionadas"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/vendor/supabase.js"></script>
<script src="/instalar.js?v=1"></script>
<script src="/filtros.js?v=15"></script>
<script src="/membros.js?v=14"></script>
<script src="/recorrencia.js?v=4"></script>
<script src="/duplicar.js?v=1"></script>
<script src="/acoes-tarefa.js?v=2"></script>
<script src="/selecao.js?v=4"></script>
<script src="/visao-pastas.js?v=3"></script>
<script src="/app.js?v=23"></script>
</body>
</html>
