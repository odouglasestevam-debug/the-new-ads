<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#132a56">
<title>Monitor de atendimento</title>
<link rel="icon" type="image/svg+xml" href="/icone.svg">
<link rel="preload" href="/fontes/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/estilo.css?v=4">
</head>
<body>
<!--
THESIS: painel de KPIs da rede, lido de cima pra baixo como a própria nota é feita: a nota, as 10 metas que a formam, o detalhe de cada pilar e o contexto. Recusa a parede de linhas iguais da versão anterior.
OWN-WORLD: identidade da Sapataria do Futuro. Faixa azul-marinho com o logo branco, superfície clara, Archivo em tudo. Cada pilar tem uma cor da marca (azul, terracota, framboesa, verde, dourado), validada pra daltonismo; situação (na meta, perto, longe) sempre com ícone e texto.
STORY: a dona e a equipe veem a nota, sabem qual meta puxou pra baixo e abrem a conversa que tirou o ponto.
FIRST VIEWPORT: período no topo; nota grande no bloco azul-marinho à esquerda; à direita, a barra de cada pilar.
FORM: placar agrupado por pilar (balanced scorecard), estrutura pedida pelo cliente.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

<section id="tela-entrar" class="entrar" hidden>
  <div class="formas" aria-hidden="true"><i class="f1"></i><i class="f2"></i><i class="f3"></i><i class="f4"></i><i class="f5"></i><i class="f6"></i></div>
  <div class="entrar-miolo">
    <img class="entrar-logo" src="/logos/sapataria-do-futuro.png" alt="Sapataria do Futuro" width="210" height="85">
    <form id="form-entrar" class="cartao-entrar" autocomplete="on">
      <h1>Monitor de atendimento</h1>
      <p class="suave">Entre com o e-mail e a senha liberados pra você.</p>
      <label class="campo">E-mail<input type="email" id="email" autocomplete="username" required></label>
      <label class="campo">Senha<input type="password" id="senha" autocomplete="current-password" required></label>
      <label class="campo" id="campo-codigo" hidden>Código do autenticador<input type="text" id="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label>
      <button class="btn" type="submit" id="btn-entrar">Entrar</button>
      <p id="erro-entrar" class="erro" role="alert"></p>
    </form>
  </div>
</section>

<div id="app" hidden>
  <header class="topo">
    <div class="topo-linha">
      <img id="logo-rede" class="logo" src="/logos/sapataria-do-futuro.png" alt="Sapataria do Futuro" width="104" height="42">
      <div class="topo-titulo">
        <strong id="nome-conta">Atendimento</strong>
        <span id="status-conexao" class="status"></span>
      </div>
      <div class="topo-dir">
        <label class="sel-unidade" id="rot-conta" hidden><span class="sr">Unidade</span><select id="sel-conta"></select></label>
        <button class="btn-topo" id="btn-senha" type="button">Senha</button>
        <button class="btn-topo" id="btn-sair" type="button">Sair</button>
      </div>
    </div>
    <nav class="abas" aria-label="Seções">
      <a href="#rede" data-aba="rede" hidden>Rede</a>
      <a href="#geral" data-aba="geral">Unidade</a>
      <a href="#agora" data-aba="agora">Agora</a>
      <a href="#historico" data-aba="historico">Histórico</a>
      <a href="#regras" data-aba="regras">Como funciona</a>
      <a href="#config" data-aba="config" hidden>Configuração</a>
    </nav>
  </header>

  <main>
    <div id="barra-periodo" class="barra-periodo" hidden>
      <div class="segmentos" id="chips-periodo" role="group" aria-label="Período">
        <button type="button" data-p="7">7 dias</button>
        <button type="button" data-p="30">30 dias</button>
        <button type="button" data-p="semana">Esta semana</button>
        <button type="button" data-p="semana-passada">Semana passada</button>
        <button type="button" data-p="mes">Este mês</button>
        <button type="button" data-p="mes-passado">Mês passado</button>
      </div>
      <div class="datas">
        <input type="date" id="de" aria-label="De">
        <span>até</span>
        <input type="date" id="ate" aria-label="Até">
      </div>
    </div>

    <section id="aba-rede" class="aba" hidden></section>
    <section id="aba-geral" class="aba" hidden></section>
    <section id="aba-agora" class="aba" hidden></section>
    <section id="aba-historico" class="aba" hidden></section>
    <section id="aba-regras" class="aba" hidden></section>
    <section id="aba-config" class="aba" hidden></section>
  </main>
  <footer class="rodape">Monitor de atendimento · feito pela The New Ads</footer>
</div>

<aside id="gaveta" class="gaveta" hidden aria-modal="true" role="dialog" aria-labelledby="gaveta-titulo">
  <div class="gaveta-fundo" data-fechar></div>
  <div class="gaveta-corpo">
    <header class="gaveta-topo">
      <button type="button" class="btn-icone" id="gaveta-voltar" aria-label="Voltar" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <h2 id="gaveta-titulo"></h2>
      <button type="button" class="btn-icone" data-fechar aria-label="Fechar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div id="gaveta-conteudo" class="gaveta-conteudo"></div>
  </div>
</aside>

<div id="dica" class="dica" role="tooltip" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="/vendor/supabase.js"></script>
<script src="/app.js?v=4"></script>
</body>
</html>
