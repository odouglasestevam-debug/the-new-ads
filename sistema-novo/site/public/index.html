<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRM | The New Ads</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" type="image/svg+xml" href="/icone.svg">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=switzer@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/workspace.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
  <g id="tna-sym"><path d="M24 78 L48 26 L48 58 L78 24" fill="none" stroke="#FF6A00" stroke-width="8.5" stroke-linejoin="round" stroke-linecap="round"/></g>
</defs></svg>

<!-- ============ LOGIN ============ -->
<div class="login" id="tela-login">
  <div class="caixa">
    <div class="marca"><svg viewBox="0 0 100 100"><use href="#tna-sym"/></svg><span>the new ads</span></div>
    <h1>CRM</h1>
    <p class="sub">Leads, origem das campanhas e kanban comercial.</p>
    <form id="form-login">
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" required>
      </div>
      <button class="btn btn-largo" type="submit" id="btn-entrar">Entrar</button>
      <div class="aviso" id="aviso-login"></div>
    </form>

    <form id="form-codigo" style="display:none">
      <p class="sub" style="margin-bottom:20px">Abra o aplicativo autenticador e digite o código de 6 dígitos.</p>
      <div class="campo">
        <label for="codigo-2fa">Código de verificação</label>
        <input type="text" id="codigo-2fa" inputmode="numeric" autocomplete="one-time-code"
               maxlength="6" placeholder="000000" style="letter-spacing:.4em;font-family:var(--mono);text-align:center">
      </div>
      <button class="btn btn-largo" type="submit" id="btn-verificar">Verificar</button>
      <div class="aviso" id="aviso-codigo"></div>
    </form>

    <!-- Quem chega pelo link de convite ou de nova senha define a senha aqui -->
    <form id="form-definir-senha" style="display:none">
      <p class="sub" style="margin-bottom:20px" id="definir-senha-texto">Crie a sua senha para acessar o CRM.</p>
      <div class="campo">
        <label for="definir-senha">Senha</label>
        <input type="password" id="definir-senha" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="campo">
        <label for="definir-senha-2">Repetir a senha</label>
        <input type="password" id="definir-senha-2" autocomplete="new-password" minlength="8" required>
      </div>
      <button class="btn btn-largo" type="submit" id="btn-definir-senha">Salvar senha e entrar</button>
      <div class="aviso" id="aviso-definir-senha"></div>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app" id="app">
  <aside>
    <div class="marca"><svg viewBox="0 0 100 100"><use href="#tna-sym"/></svg><span>CRM</span></div>
    <div class="seletor-empresa">
      <select id="empresa-sel" aria-label="Empresa"></select>
      <div class="papel-atual" id="papel-atual"></div>
    </div>
    <nav id="nav">
      <button data-vista="kanban">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg>
        <span>Kanban</span>
      </button>
      <button data-vista="conversas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>
        <span>Conversas</span><span class="contador" id="cont-conversas"></span>
      </button>
      <button data-vista="leads">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Leads</span><span class="contador" id="cont-leads"></span>
      </button>
      <button data-vista="formularios" id="nav-formularios">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        <span>Formulários</span>
      </button>
      <button data-vista="config">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
        <span>Ajustes</span>
      </button>
    </nav>
    <div class="rodape">
      <div class="usuario" id="usuario-email"></div>
      <button class="sair" id="btn-sair">Sair</button>
    </div>
  </aside>

  <main id="conteudo"></main>
</div>

<script src="/vendor/supabase.js"></script>
<script defer src="/js/core.js"></script>
<script defer src="/js/auth.js"></script>
<script defer src="/js/data.js"></script>
<script defer src="/js/navigation.js"></script>
<script defer src="/js/leads.js"></script>
<script defer src="/js/kanban.js"></script>
<script defer src="/js/conversations.js"></script>
<script defer src="/js/integrations.js"></script>
<script defer src="/js/forms.js"></script>
<script defer src="/js/settings.js"></script>
<script defer src="/js/events.js"></script>
<script defer src="/js/lead-editor.js"></script>
<script defer src="/js/lead-detail.js"></script>
<script defer src="/js/boot.js"></script>
</body>
</html>
