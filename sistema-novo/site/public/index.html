async function desenhar2FA() {
  const area = document.getElementById("area-2fa");
  const selo = document.getElementById("selo-2fa");
  if (!area) return;
  const { data, error } = await sb.auth.mfa.listFactors();
  // a pessoa pode ter trocado de aba enquanto carregava
  if (!document.body.contains(area)) return;
  if (error) { area.innerHTML = `<div class="aviso erro">Não deu pra checar: ${escapar(error.message)}</div>`; return; }
  const ativo = (data?.totp || []).find((f) => f.status === "verified");

  if (ativo) {
    selo.className = "selo sim";
    selo.textContent = "ligada";
    area.innerHTML = `
      <div class="par"><span class="r">Ativado em</span><span class="v">${dataCurta(ativo.created_at)}</span></div>
      <button class="ver-lead" id="remover-2fa" type="button" style="width:auto;margin-top:16px;padding:8px 14px">Desativar verificação em duas etapas</button>
      <div class="aviso" id="aviso-2fa"></div>`;
    document.getElementById("remover-2fa").addEventListener("click", async () => {
      if (!confirm("Desativar a verificação em duas etapas?")) return;
      const { error: erro } = await sb.auth.mfa.unenroll({ factorId: ativo.id });
      if (erro) { document.getElementById("aviso-2fa").textContent = "Não deu pra desativar: " + erro.message; return; }
      desenhar2FA();
    });
    return;
  }

  selo.className = "selo nao";
  selo.textContent = "desligada";
  area.innerHTML = `<button class="btn btn-largo" id="ativar-2fa" type="button">Ativar</button><div class="aviso" id="aviso-2fa"></div>`;
  document.getElementById("ativar-2fa").addEventListener("click", async () => {
    const aviso = document.getElementById("aviso-2fa");
    aviso.textContent = "Gerando o código...";
    const { data: atuais } = await sb.auth.mfa.listFactors();
    for (const pendente of (atuais?.totp || []).filter((f) => f.status !== "verified")) {
      await sb.auth.mfa.unenroll({ factorId: pendente.id });
    }
    const { data: inscricao, error: erro } = await sb.auth.mfa.enroll({ factorType: "totp", friendlyName: "Autenticador", issuer: "CRM The New Ads" });
    if (erro) { aviso.className = "aviso erro"; aviso.textContent = "Não deu pra gerar: " + erro.message; return; }

    area.innerHTML = `
      <ol class="passos-2fa">
        <li>Abra o aplicativo autenticador e adicione uma conta pelo código QR</li>
        <li>Aponte a câmera para o código abaixo</li>
        <li>Digite aqui o número de 6 dígitos que aparecer</li>
      </ol>
      <div class="qr-caixa"><img src="${inscricao.totp.qr_code}" alt="Código QR" width="190" height="190"></div>
      <details class="manual"><summary>Não consegue ler o código?</summary>
        <p>Adicione manualmente com esta chave:</p><code class="chave-2fa">${escapar(inscricao.totp.secret)}</code></details>
      <div class="campo" style="margin-top:18px">
        <label for="confirma-2fa">Código do aplicativo</label>
        <input type="text" id="confirma-2fa" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code"
               style="letter-spacing:.4em;font-family:var(--mono);text-align:center">
      </div>
      <button class="btn btn-largo" id="confirmar-2fa" type="button">Confirmar e ativar</button>
      <div class="aviso" id="aviso-2fa"></div>`;

    document.getElementById("confirmar-2fa").addEventListener("click", async () => {
      const campo = document.getElementById("confirma-2fa");
      const avisoC = document.getElementById("aviso-2fa");
      const codigo = campo.value.replace(/\D/g, "");
      if (codigo.length !== 6) { avisoC.className = "aviso erro"; avisoC.textContent = "O código tem 6 dígitos."; return; }
      const { data: desafio, error: e1 } = await sb.auth.mfa.challenge({ factorId: inscricao.id });
      if (e1) { avisoC.className = "aviso erro"; avisoC.textContent = e1.message; return; }
      const { error: e2 } = await sb.auth.mfa.verify({ factorId: inscricao.id, challengeId: desafio.id, code: codigo });
      if (e2) { avisoC.className = "aviso erro"; avisoC.textContent = "Código incorreto, tente com o próximo."; campo.value = ""; return; }
      desenhar2FA();
    });
  });
}

/* ---------------- eventos das vistas ---------------- */
function ligarEventos() {
  const movel = document.getElementById("empresa-sel-movel");
  if (movel) movel.addEventListener("change", () => trocarEmpresa(movel.value));

  const campoBusca = document.getElementById("busca");
  if (campoBusca) {
    campoBusca.addEventListener("input", (e) => {
      busca = e.target.value;
      const posicao = e.target.selectionStart;
      render();
      const novo = document.getElementById("busca");
      if (novo) { novo.focus(); novo.setSelectionRange(posicao, posicao); }
    });
  }
  const filtro = document.getElementById("filtro-cadastro");
  if (filtro) filtro.addEventListener("change", (e) => { filtroCadastro = e.target.value; render(); });

  document.querySelectorAll(".lead-etapa").forEach((sel) => {
    sel.addEventListener("click", (e) => e.stopPropagation());
    sel.addEventListener("change", (e) => moverLead(e.target.dataset.id, e.target.value));
  });

  document.querySelectorAll(".cartao, .linha-lead").forEach((el) => {
    el.addEventListener("click", (e) => {
      if (e.target.closest("select, a, button")) return;
      abrirLead(el.dataset.id);
    });
  });

  const novo = document.getElementById("btn-novo-lead");
  if (novo) novo.addEventListener("click", () => formularioLead(null));

  document.querySelectorAll(".lead-responsavel").forEach((sel) => {
    sel.addEventListener("click", (e) => e.stopPropagation());
    sel.addEventListener("change", async () => {
      const valor = sel.value || null;
      const { data, error } = await sb.from("leads").update({ responsavel_id: valor }).eq("id", sel.dataset.id).select("id");
      if (error || !data?.length) { alert("Não deu pra trocar o responsável" + (error ? ": " + error.message : ".")); render(); return; }
      const lead = leads.find((l) => l.id === sel.dataset.id);
      if (lead) lead.responsavel_id = valor;
    });
  });

  ligarEquipe();
  ligarFormularios();
  ligarConversas();
  ligarIntegracoes();

  ligarArrasto();

  document.querySelectorAll("[data-aba-ajuste]").forEach((b) => {
    b.addEventListener("click", () => { abaAjustes = b.dataset.abaAjuste; render(); });
  });
  const sairAjustes = document.getElementById("btn-sair-ajustes");
  if (sairAjustes) sairAjustes.addEventListener("click", sair);
  if (document.getElementById("area-2fa")) desenhar2FA();

  const btnSenha = document.getElementById("btn-trocar-senha");
  if (btnSenha) {
    btnSenha.addEventListener("click", async () => {
      const nova = document.getElementById("senha-nova").value;
      const confirma = document.getElementById("senha-confirma").value;
      const aviso = document.getElementById("aviso-senha");
      if (nova.length < 8) { aviso.className = "aviso erro"; aviso.textContent = "A senha precisa ter pelo menos 8 caracteres."; return; }
      if (nova !== confirma) { aviso.className = "aviso erro"; aviso.textContent = "As duas senhas não são iguais."; return; }
      const { data: fatores } = await sb.auth.mfa.listFactors();
      if ((fatores?.totp || []).some((f) => f.status === "verified")) {
        const codigo = prompt("Digite o código de 6 dígitos do autenticador para confirmar:");
        if (codigo === null) return;
        const conferencia = await verificarCodigo(String(codigo).replace(/\D/g, ""));
        if (conferencia.erro) { aviso.className = "aviso erro"; aviso.textContent = "Código não confere. A senha não foi alterada."; return; }
      }
      btnSenha.disabled = true;
      const { error } = await sb.auth.updateUser({ password: nova });
      btnSenha.disabled = false;
      if (error) { aviso.className = "aviso erro"; aviso.textContent = "Não deu pra trocar: " + error.message; return; }
      aviso.className = "aviso ok";
      aviso.textContent = "Senha trocada.";
    });
  }

  const btnRecarregar = document.getElementById("btn-recarregar");
  if (btnRecarregar) {
    btnRecarregar.addEventListener("click", async () => {
      await carregarTudo();
      const aviso = document.getElementById("aviso-recarregar");
      if (aviso) { aviso.className = "aviso ok"; aviso.textContent = "Dados atualizados."; }
    });
  }
}

function ligarEquipe() {
  const convidar = document.getElementById("btn-convidar");
  if (convidar) {
    convidar.addEventListener("click", async () => {
      const aviso = document.getElementById("aviso-convite");
      const email = document.getElementById("conv-email").value.trim();
      const papelNovo = document.getElementById("conv-papel").value;
      if (!email) { aviso.className = "aviso erro"; aviso.textContent = "Informe o e-mail."; return; }
      convidar.disabled = true;
      aviso.className = "aviso";
      aviso.textContent = "Convidando...";
      try {
        const r = await chamarEquipe({ acao: "convidar", email, papel: papelNovo });
        await carregarTudo();
        if (r.link) {
          mostrarLink("link-convite", r.link,
            `Convite criado para ${escapar(email)}. Mande este link só para essa pessoa: ele serve para ela criar a senha, uma única vez.`);
        } else {
          const avisoNovo = document.getElementById("aviso-convite");
          avisoNovo.className = "aviso ok";
          avisoNovo.textContent = `${email} já tinha conta e agora tem acesso a ${empresaAtual.nome}.`;
        }
      } catch (err) {
        aviso.className = "aviso erro";
        aviso.textContent = err.message;
        convidar.disabled = false;
      }
    });
  }

  document.querySelectorAll(".membro-papel").forEach((sel) => {
    sel.addEventListener("change", async () => {
      const aviso = document.getElementById("aviso-equipe");
      const { data, error } = await sb.from("membros").update({ papel: sel.value })
        .eq("empresa_id", empresaAtual.id).eq("user_id", sel.dataset.user).select("user_id");
      if (error || !data?.length) {
        aviso.className = "aviso erro";
        aviso.textContent = error ? traduzirErro(error.message) : "Sem permissão para alterar.";
        await carregarTudo();
        return;
      }
      if (sel.dataset.user === usuario.id && !ehAgencia) { await carregarEmpresas(empresaAtual.id); return; }
      await carregarTudo();
      const novo = document.getElementById("aviso-equipe");
      if (novo) { novo.className = "aviso ok"; novo.textContent = "Nível atualizado."; }
    });
  });

  document.querySelectorAll(".membro-link").forEach((b) => {
    b.addEventListener("click", async () => {
      const aviso = document.getElementById("aviso-equipe");
      b.disabled = true;
      try {
        const r = await chamarEquipe({ acao: "link_acesso", user_id: b.dataset.user });
        const email = equipe.find((m) => m.user_id === b.dataset.user)?.email || "";
        mostrarLink("link-membro", r.link, `Link para ${escapar(email)} criar uma nova senha. Mande só para essa pessoa, ele vale uma vez.`);
        aviso.textContent = "";
      } catch (err) {
        aviso.className = "aviso erro";
        aviso.textContent = err.message;
      }
      b.disabled = false;
    });
  });

  document.querySelectorAll(".membro-remover").forEach((b) => {
    b.addEventListener("click", async () => {
      if (!confirm(`Remover ${b.dataset.email} de ${empresaAtual.nome}? A pessoa perde o acesso a esta empresa. Os leads dela ficam sem responsável.`)) return;
      const aviso = document.getElementById("aviso-equipe");
      const { error: erroLeads } = await sb.from("leads").update({ responsavel_id: null })
        .eq("empresa_id", empresaAtual.id).eq("responsavel_id", b.dataset.user);
      if (erroLeads) { aviso.className = "aviso erro"; aviso.textContent = erroLeads.message; return; }
      const { data, error } = await sb.from("membros").delete()
        .eq("empresa_id", empresaAtual.id).eq("user_id", b.dataset.user).select("user_id");
      if (error || !data?.length) {
        aviso.className = "aviso erro";
        aviso.textContent = error ? traduzirErro(error.message) : "Sem permissão para remover.";
        return;
      }
      if (b.dataset.user === usuario.id && !ehAgencia) { location.reload(); return; }
      await carregarTudo();
    });
  });

  const criar = document.getElementById("btn-criar-empresa");
  if (criar) {
    criar.addEventListener("click", async () => {
      const aviso = document.getElementById("aviso-empresa");
      const nome = document.getElementById("emp-nome").value.trim();
      if (nome.length < 2) { aviso.className = "aviso erro"; aviso.textContent = "Informe o nome da empresa."; return; }
      const slug = nome.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
        .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
      criar.disabled = true;
      const { data, error } = await sb.from("empresas").insert({ nome, slug }).select("id").single();
      criar.disabled = false;
      if (error) {
        aviso.className = "aviso erro";
        aviso.textContent = error.code === "23505" ? "Já existe uma empresa com esse nome." : "Não deu pra criar: " + error.message;
        return;
      }
      abaAjustes = "equipe";
      vistaAtual = "config";
      await carregarEmpresas(data.id);
    });
  }
}

function traduzirErro(msg) {
  return msg.includes("pelo menos um dono") ? "A empresa precisa de pelo menos um dono. Promova outra pessoa antes." : msg;
}

async function moverLead(id, etapa) {
  const lead = leads.find((l) => l.id === id);
  if (!lead || lead.etapa === etapa) return;
  const { data, error } = await sb.from("leads").update({ etapa }).eq("id", id).select("id");
  if (error || !data?.length) {
    alert(error ? "Não deu pra mover: " + error.message : "Você não tem permissão para mover este lead.");
    render();
    return;
  }
  lead.etapa = etapa;
  render();
}

function ligarArrasto() {
  let arrastando = null;
  document.querySelectorAll(".cartao[draggable]").forEach((cartao) => {
    cartao.addEventListener("dragstart", () => { arrastando = cartao.dataset.id; cartao.classList.add("arrastando"); });
    cartao.addEventListener("dragend", () => {
      arrastando = null;
      cartao.classList.remove("arrastando");
      document.querySelectorAll(".coluna").forEach((c) => c.classList.remove("alvo"));
    });
  });
  document.querySelectorAll(".coluna").forEach((coluna) => {
    coluna.addEventListener("dragover", (e) => { if (arrastando) { e.preventDefault(); coluna.classList.add("alvo"); } });
    coluna.addEventListener("dragleave", () => coluna.classList.remove("alvo"));
    coluna.addEventListener("drop", (e) => {
      e.preventDefault();
      coluna.classList.remove("alvo");
      if (arrastando) moverLead(arrastando, coluna.dataset.etapa);
    });
  });
}

/* ---------------- criar e editar lead ---------------- */
// Serve para lead novo (lead = null) e para completar cadastro de um existente.
function formularioLead(lead) {
  const novo = !lead;
  const div = document.createElement("div");
  div.className = "fundo-modal fundo-centro";
  const opcoesResponsavel = equipe
    .filter((m) => m.papel !== "leitura")
    .map((m) => `<option value="${m.user_id}"${(lead?.responsavel_id || (papel === "vendedor" ? usuario.id : "")) === m.user_id ? " selected" : ""}>${escapar(m.email)}</option>`)
    .join("");

  div.innerHTML = `
    <div class="caixa-modal">
      <h2>${novo ? "Novo lead" : "Editar cadastro"}</h2>
      <p class="ajuda">Telefone com DDD. Sem telefone o lead fica marcado como cadastro incompleto.</p>
      <div class="campo"><label for="fl-nome">Nome</label><input type="text" id="fl-nome" value="${escapar(lead?.nome || "")}" autocomplete="off"></div>
      <div class="campo"><label for="fl-tel">Telefone</label><input type="tel" id="fl-tel" value="${escapar(telefoneLegivel(lead?.telefone))}" placeholder="(11) 99999-9999" autocomplete="off"></div>
      <div class="campo"><label for="fl-email">E-mail</label><input type="email" id="fl-email" value="${escapar(lead?.email || "")}" autocomplete="off"></div>
      ${pode.distribuir() ? `
      <div class="campo"><label for="fl-resp">Responsável</label>
        <select id="fl-resp"><option value="">sem responsável</option>${opcoesResponsavel}</select></div>` : ""}
      <div class="aviso" id="fl-aviso"></div>
      <div class="acoes-modal">
        <button class="btn btn-fantasma" type="button" id="fl-cancelar">Cancelar</button>
        <button class="btn" type="button" id="fl-salvar">Salvar</button>
      </div>
    </div>`;
  document.body.appendChild(div);

  const fechar = () => div.remove();
  div.addEventListener("click", (e) => { if (e.target === div) fechar(); });
  div.querySelector("#fl-cancelar").addEventListener("click", fechar);
  div.querySelector("#fl-nome").focus();

  div.querySelector("#fl-salvar").addEventListener("click", async () => {
    const aviso = div.querySelector("#fl-aviso");
    const telefone = normalizarTelefone(div.querySelector("#fl-tel").value);
    if (telefone === undefined) { aviso.className = "aviso erro"; aviso.textContent = "Telefone inválido. Use DDD e número."; return; }
    const campos = {
      nome: div.querySelector("#fl-nome").value.trim() || null,
      telefone,
      email: div.querySelector("#fl-email").value.trim() || null,
    };
    const resp = div.querySelector("#fl-resp");
    if (resp) campos.responsavel_id = resp.value || null;
    else if (novo && papel === "vendedor") campos.responsavel_id = usuario.id;

    if (!campos.nome && !campos.telefone && !campos.email) {
      aviso.className = "aviso erro"; aviso.textContent = "Preencha pelo menos nome, telefone ou e-mail."; return;
    }

    aviso.className = "aviso";
    aviso.textContent = "Salvando...";

    let resultado;
    if (novo) {
      resultado = await sb.from("leads").insert({ ...campos, empresa_id: empresaAtual.id }).select("*, lead_origens(*)").single();
      if (!resultado.error) {
        await sb.from("lead_origens").insert({ empresa_id: empresaAtual.id, lead_id: resultado.data.id, canal: "manual" });
      }
    } else {
      resultado = await sb.from("leads").update(campos).eq("id", lead.id).select("*, lead_origens(*)").single();
    }

    if (resultado.error) {
      aviso.className = "aviso erro";
      aviso.textContent = resultado.error.code === "23505"
        ? "Já existe um lead com esse telefone nesta empresa."
        : "Não deu pra salvar: " + resultado.error.message;
      return;
    }
    fechar();
    await carregarTudo();
    if (!novo) abrirLead(lead.id);
  });
}

async function excluirLead(l) {
  if (!confirm(`Excluir "${l.nome || "esse lead"}" pra sempre? Apaga também as anotações e origens. Não tem como desfazer.`)) return false;
  const { data, error } = await sb.from("leads").delete().eq("id", l.id).select("id");
  if (error || !data?.length) { alert(error ? "Não deu pra excluir: " + error.message : "Sem permissão para excluir."); return false; }
  leads = leads.filter((x) => x.id !== l.id);
  notas = notas.filter((n) => n.lead_id !== l.id);
  return true;
}

/* ---------------- detalhe do lead ---------------- */
function abrirLead(id, abaInicial) {
  const l = leads.find((x) => x.id === id);
  if (!l) return;
  let abaAtual = abaInicial || "anotacoes";

  const div = document.createElement("div");
  div.className = "fundo-modal";
  document.body.appendChild(div);
  let fechar = () => { div.remove(); document.removeEventListener("keydown", aoTeclar); };
  function aoTeclar(e) { if (e.key === "Escape") fechar(); }
  document.addEventListener("keydown", aoTeclar);
  div.addEventListener("click", (e) => { if (e.target === div) fechar(); });

  const par = (rotulo, valor) =>
    `<div class="par"><span class="r">${rotulo}</span><span class="v${valor ? "" : " vazio"}">${valor ? escapar(valor) : "vazio"}</span></div>`;

  function abaAnotacoes() {
    const doLead = notas.filter((n) => n.lead_id === l.id);
    const historico = doLead.length
      ? doLead.map((n) => `
          <div class="nota">
            <div class="nota-topo">
              <span class="nota-data">${dataHora(n.criado_em)} · ${escapar(nomeResponsavel(n.autor_id) || "")}</span>
              ${n.autor_id === usuario.id || pode.excluir() ? `<button class="nota-apagar" data-nota="${n.id}" type="button" title="Apagar">✕</button>` : ""}
            </div>
            <p>${escapar(n.texto)}</p>
          </div>`).join("")
      : '<div class="vazio-bloco">Nenhuma anotação ainda.</div>';
    const form = pode.editarLead(l) ? `
      <div class="campo"><label for="nova-nota">Nova anotação</label>
        <textarea id="nova-nota" rows="3" placeholder="O que aconteceu nessa conversa?"></textarea></div>
      <button class="btn btn-largo" id="salvar-nota" type="button">Salvar anotação</button>
      <div class="aviso" id="aviso-nota"></div>` : "";
    return form + `<div class="historico">${historico}</div>`;
  }

  function abaOrigem() {
    const lista = origensDoLead(l);
    if (!lista.length) return '<div class="vazio-bloco">Nenhuma origem registrada.</div>';
    return lista.map((o, i) => `
      <div class="origem">
        <div class="origem-topo">
          ${seloCanal(o)}
          <span class="num">${i === 0 ? "entrada · " : i === lista.length - 1 ? "mais recente · " : ""}${dataHora(o.recebido_em)}</span>
        </div>
        ${o.canal === "site" ? `
          ${par("utm_source", o.utm_source)}
          ${par("utm_medium", o.utm_medium)}
          ${par("utm_campaign", o.utm_campaign)}
          ${par("utm_content", o.utm_content)}
          ${par("utm_term", o.utm_term)}
          ${par("utm_placement", o.utm_placement)}
          ${par("ad_id", o.ad_id)}
          ${o.pagina_url ? par("Página", o.pagina_url) : ""}
          ${o.dados?.formulario ? par("Formulário", o.dados.formulario) : ""}
          ${Object.entries(o.dados?.respostas || {}).map(([pergunta, resposta]) =>
            par(escapar(pergunta), Array.isArray(resposta) ? resposta.join(", ") : resposta)).join("")}` : ""}
        ${o.canal === "ctwa" || o.canal === "meta_form" ? `
          ${par("Campanha", o.campanha_nome)}
          ${par("Conjunto", o.conjunto_nome)}
          ${par("Anúncio", o.anuncio_nome)}
          ${par(o.canal === "ctwa" ? "source_id" : "ad_id", o.ad_id)}
          ${o.ctwa_clid ? par("ctwa_clid", o.ctwa_clid) : ""}` : ""}
        ${o.canal === "manual" ? '<div class="sub-cel">Cadastrado manualmente pela equipe.</div>' : ""}
      </div>`).join("");
  }

  function abaDados() {
    return `
      <div class="grupo">
        <h3>Contato</h3>
        ${par("Nome", l.nome)}
        ${par("Telefone", telefoneLegivel(l.telefone))}
        ${par("E-mail", l.email)}
        ${par("Cadastro", l.cadastro_incompleto ? "incompleto (sem telefone)" : "completo")}
        ${par("Responsável", nomeResponsavel(l.responsavel_id))}
        ${par("Entrou em", dataHora(l.criado_em))}
        ${pode.editarLead(l) ? '<button class="ver-lead" type="button" id="editar-cadastro" style="margin-top:14px">Editar cadastro</button>' : ""}
      </div>
      ${pode.excluir() ? '<div class="grupo"><button class="ver-lead perigo" type="button" id="excluir-lead">Excluir lead</button></div>' : ""}`;
  }

  const conversa = conversas.find((c) => c.lead_id === l.id) || null;
  if (!conversa && abaAtual === "conversa") abaAtual = "anotacoes";
  if (conversa && !abaInicial) abaAtual = "conversa";

  const ABAS = [
    ...(conversa ? [{ id: "conversa", nome: "Conversa", conta: () => conversa.nao_lidas || 0 }] : []),
    { id: "anotacoes", nome: "Anotações", conta: () => notas.filter((n) => n.lead_id === l.id).length },
    { id: "origem", nome: "Origem", conta: () => (l.lead_origens || []).length },
    { id: "dados", nome: "Dados", conta: () => 0 },
  ];

  // Chegou mensagem nova enquanto a ficha está aberta na conversa: atualiza.
  const aoAtualizar = () => {
    if (abaAtual === "conversa" && document.body.contains(div)) (garantirMensagens(conversa.id) || Promise.resolve()).then(desenhar);
  };
  document.addEventListener("conversas-atualizadas", aoAtualizar);
  const fecharOriginal = fechar;
  fechar = () => { document.removeEventListener("conversas-atualizadas", aoAtualizar); fecharOriginal(); };

  function desenhar() {
    if (abaAtual === "conversa" && conversa) {
      const carregando = garantirMensagens(conversa.id);
      if (carregando && !carregando.redesenhoFicha) {
        carregando.redesenhoFicha = true;
        carregando.then(() => { if (document.body.contains(div)) desenhar(); });
      }
    }
    if (abaAtual === "conversa" && conversa?.nao_lidas) {
      conversa.nao_lidas = 0;
      atualizarContadorConversas();
      sb.rpc("marcar_conversa_lida", { p_conversa: conversa.id });
    }
    const corpo = abaAtual === "conversa" ? htmlChat(conversa)
      : abaAtual === "anotacoes" ? abaAnotacoes() : abaAtual === "origem" ? abaOrigem() : abaDados();
    div.innerHTML = `
      <div class="gaveta">
        <div class="cabeca">
          <div>
            <h2>${escapar(l.nome || "Lead sem nome")}</h2>
            <div class="sub-cel">${escapar(NOME_ETAPA[l.etapa] || l.etapa)} ${l.cadastro_incompleto ? '· <span style="color:var(--vermelho)">cadastro incompleto</span>' : ""}</div>
          </div>
          <button class="fechar" type="button" aria-label="Fechar">✕</button>
        </div>
        ${conversa ? "" : botaoWhatsApp(l, "Conversar no WhatsApp")}
        ${l.cadastro_incompleto && pode.editarLead(l) ? '<button class="btn btn-largo" id="completar" type="button" style="margin-bottom:22px">Completar cadastro</button>' : ""}
        <div class="abas">
          ${ABAS.map((a) => {
            const n = a.conta();
            return `<button class="aba${a.id === abaAtual ? " ativa" : ""}" data-aba="${a.id}" type="button">${a.nome}${n ? `<span class="aba-conta">${n}</span>` : ""}</button>`;
          }).join("")}
        </div>
        <div class="aba-corpo">${corpo}</div>
      </div>`;

    div.querySelector(".fechar").addEventListener("click", fechar);
    div.querySelectorAll(".aba").forEach((b) => b.addEventListener("click", () => { abaAtual = b.dataset.aba; desenhar(); }));
    if (abaAtual === "conversa" && conversa) ligarChat(div, conversa, () => { desenhar(); if (vistaAtual === "conversas") render(); });
    const completar = div.querySelector("#completar");
    if (completar) completar.addEventListener("click", () => { fechar(); formularioLead(l); });

    const salvarNota = div.querySelector("#salvar-nota");
    if (salvarNota) {
      salvarNota.addEventListener("click", async () => {
        const texto = div.querySelector("#nova-nota").value.trim();
        const aviso = div.querySelector("#aviso-nota");
        if (!texto) { aviso.className = "aviso erro"; aviso.textContent = "Escreva algo antes de salvar."; return; }
        const { data, error } = await sb.from("lead_notas")
          .insert({ empresa_id: empresaAtual.id, lead_id: l.id, texto, autor_id: usuario.id }).select().single();
        if (error) { aviso.className = "aviso erro"; aviso.textContent = "Não deu pra salvar: " + error.message; return; }
        notas.unshift(data);
        desenhar();
        render();
      });
    }
    div.querySelectorAll(".nota-apagar").forEach((b) => {
      b.addEventListener("click", async () => {
        if (!confirm("Apagar essa anotação?")) return;
        const { data, error } = await sb.from("lead_notas").delete().eq("id", b.dataset.nota).select("id");
        if (error || !data?.length) { alert("Não deu pra apagar."); return; }
        notas = notas.filter((n) => n.id !== b.dataset.nota);
        desenhar();
        render();
      });
    });

    const editar = div.querySelector("#editar-cadastro");
    if (editar) editar.addEventListener("click", () => { fechar(); formularioLead(l); });
    const excluir = div.querySelector("#excluir-lead");
    if (excluir) excluir.addEventListener("click", async () => { if (await excluirLead(l)) { fechar(); render(); } });
  }

  desenhar();
}

iniciar();
</script>
</body>
</html>
