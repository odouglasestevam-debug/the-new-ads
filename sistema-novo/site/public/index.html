<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRM | The New Ads</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" type="image/svg+xml" href="/icone.svg">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=switzer@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Base visual copiada do /funil da The New Ads. O /funil original não é alterado. */
  :root{
    --preto:#0A0A0A; --grafite:#141414; --grafite-2:#1c1c1c; --nevoa:#8A8A8A;
    --branco:#FAFAFA; --ambar:#FF6A00; --linha:rgba(255,255,255,.09);
    --verde:#4ADE80; --vermelho:#F87171; --azul:#60A5FA;
    --display:'Clash Display',system-ui,sans-serif;
    --texto:'Switzer','Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',monospace;
    --sidebar:230px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--preto);color:var(--branco);font-family:var(--texto);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;line-height:1.15}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  a{color:inherit;text-decoration:none}

  .login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login .caixa{width:100%;max-width:380px}
  .login .marca{display:flex;align-items:center;gap:11px;font-family:var(--display);font-weight:600;font-size:20px;margin-bottom:30px}
  .login .marca svg{width:26px;height:26px}
  .login h1{font-size:26px;margin-bottom:8px}
  .login .sub{color:var(--nevoa);font-size:14.5px;margin-bottom:26px}
  .campo{margin-bottom:14px}
  .campo label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--nevoa);margin-bottom:7px}
  input[type=email],input[type=password],input[type=search],input[type=text],input[type=tel],select,textarea{
    width:100%;background:var(--grafite);border:1px solid var(--linha);border-radius:9px;
    padding:13px 14px;color:var(--branco);font-size:15px;outline:none;transition:border-color .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--ambar)}
  .btn{background:var(--ambar);color:#0A0A0A;font-family:var(--display);font-weight:600;font-size:15px;
    padding:13px 20px;border:none;border-radius:9px;cursor:pointer;transition:opacity .15s}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-largo{width:100%}
  .btn-fantasma{background:transparent;color:var(--branco);border:1px solid var(--linha)}
  .btn-fantasma:hover{border-color:var(--ambar);opacity:1}
  .aviso{font-size:13.5px;margin-top:12px;min-height:18px;color:var(--nevoa)}
  .aviso.erro{color:var(--vermelho)}
  .aviso.ok{color:var(--verde)}

  .app{display:none;min-height:100dvh}
  .app.ativo{display:flex}
  aside{width:var(--sidebar);flex:none;border-right:1px solid var(--linha);background:#0c0c0c;
    padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100dvh}
  aside .marca{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:16px;padding:0 8px}
  aside .marca svg{width:22px;height:22px}
  .seletor-empresa select{padding:10px 12px;font-size:13.5px}
  .papel-atual{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--nevoa);margin-top:6px;padding:0 4px}
  nav{display:flex;flex-direction:column;gap:3px}
  nav button{display:flex;align-items:center;gap:11px;background:none;border:none;text-align:left;
    padding:11px 12px;border-radius:8px;color:var(--nevoa);font-size:14.5px;cursor:pointer;transition:all .15s;width:100%}
  nav button:hover{background:var(--grafite);color:var(--branco)}
  nav button.ativo{background:rgba(255,106,0,.1);color:var(--ambar);font-weight:500}
  nav button svg{width:17px;height:17px;flex:none}
  nav .contador{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--nevoa)}
  aside .rodape{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 4px}
  aside .usuario{font-family:var(--mono);font-size:11px;color:var(--nevoa);word-break:break-all}
  aside .sair{background:none;border:none;color:var(--nevoa);font-size:13px;cursor:pointer;text-align:left;padding:4px}
  aside .sair:hover{color:var(--branco)}

  main{flex:1;min-width:0;padding:30px 34px 90px}
  .topo{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
  .topo h1{font-size:27px}
  .topo .desc{color:var(--nevoa);font-size:14px;margin-top:6px}
  .ferramentas{display:flex;gap:10px;flex-wrap:wrap}
  .ferramentas input[type=search]{width:230px}
  .ferramentas select{width:auto;padding:11px 13px}

  .tabela-caixa{border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:var(--grafite)}
  .rolagem{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:760px}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--nevoa);
    text-align:left;padding:13px 16px;border-bottom:1px solid var(--linha);font-weight:500;white-space:nowrap}
  td{padding:14px 16px;border-bottom:1px solid var(--linha);font-size:14px;vertical-align:top}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  .nome-cel{font-weight:600;color:var(--branco)}
  .sub-cel{color:var(--nevoa);font-size:12.5px;margin-top:3px}
  .num{font-family:var(--mono);font-size:12.5px;color:var(--nevoa);white-space:nowrap}

  .selo{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid}
  .selo.sim{color:var(--verde);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.08)}
  .selo.nao{color:var(--nevoa);border-color:var(--linha);background:rgba(255,255,255,.03)}
  .selo.alerta{color:var(--vermelho);border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.08)}
  /* tag de canal: verde WhatsApp para mensagem, âmbar para site, azul Meta para formulário nativo */
  .selo.canal svg{width:11px;height:11px}
  .selo.canal-ctwa{color:#25D366;border-color:rgba(37,211,102,.35);background:rgba(37,211,102,.1)}
  .selo.canal-site{color:var(--ambar);border-color:rgba(255,106,0,.35);background:rgba(255,106,0,.08)}
  .selo.canal-meta_form{color:#4C8DFF;border-color:rgba(76,141,255,.35);background:rgba(76,141,255,.08)}
  .selo.canal-manual{color:var(--nevoa);border-color:var(--linha);background:rgba(255,255,255,.03)}

  select.etapa-sel{padding:7px 10px;font-size:12.5px;border-radius:7px;background:var(--grafite-2);width:auto}

  .kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
  .coluna{flex:0 0 300px;background:var(--grafite);border:1px solid var(--linha);border-radius:12px;
    display:flex;flex-direction:column;max-height:calc(100dvh - 190px)}
  .coluna.alvo{border-color:var(--ambar);background:rgba(255,106,0,.05)}
  .coluna .cabeca{padding:13px 15px;border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:9px}
  .coluna .ponto{width:7px;height:7px;border-radius:50%;flex:none}
  .coluna .titulo{font-family:var(--display);font-weight:600;font-size:13.5px}
  .coluna .qtd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--nevoa)}
  .coluna .corpo{padding:11px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
  .coluna .vazio{padding:18px 12px;text-align:center;color:var(--nevoa);font-size:12.5px}
  .cartao{background:var(--preto);border:1px solid var(--linha);border-radius:10px;padding:14px;cursor:pointer;
    display:flex;flex-direction:column;gap:11px}
  .cartao:hover{border-color:rgba(255,255,255,.2)}
  .cartao.arrastando{opacity:.4}
  .c-topo{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .c-ident{min-width:0}
  .cartao .n{font-weight:600;font-size:14.5px;margin-bottom:3px;line-height:1.25}
  .cartao .e{color:var(--nevoa);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cartao .meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .c-rodape{display:flex;align-items:center;gap:10px;padding-top:11px;border-top:1px solid var(--linha)}
  .c-rodape .etapa-sel{flex:1;width:auto}
  .cartao .data{font-family:var(--mono);font-size:10.5px;color:var(--nevoa);flex:none}
  .utms{display:flex;flex-direction:column;gap:3px}
  .utm{font-family:var(--mono);font-size:10.5px;color:#c4c4c4;display:flex;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .utm i{color:var(--nevoa);font-style:normal;min-width:62px;flex:none}
  .sinal{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--nevoa)}
  .sinal svg{width:13px;height:13px}

  .zap{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:none;
    width:34px;height:34px;border:1px solid var(--linha);border-radius:7px;color:var(--nevoa);transition:all .15s}
  .zap svg{width:17px;height:17px}
  .zap:hover{border-color:#25D366;color:#25D366;background:rgba(37,211,102,.08)}
  .zap-largo{width:100%;height:auto;padding:12px;font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--branco);margin-bottom:22px}
  .cel-contato{display:flex;align-items:center;gap:12px;justify-content:space-between}

  .ver-lead{width:100%;background:transparent;border:1px solid var(--linha);color:var(--nevoa);
    border-radius:7px;padding:7px;font-size:12px;cursor:pointer}
  .ver-lead:hover{border-color:var(--ambar);color:var(--branco)}
  .ver-lead.perigo{border-color:rgba(248,113,113,.3);color:var(--vermelho)}
  .ver-lead.perigo:hover{border-color:var(--vermelho);background:rgba(248,113,113,.08)}

  .fundo-modal{position:fixed;inset:0;z-index:60;background:rgba(4,4,4,.7);backdrop-filter:blur(4px);display:flex;justify-content:flex-end}
  .fundo-centro{align-items:center;justify-content:center;padding:20px}
  .gaveta{width:100%;max-width:460px;background:var(--grafite);border-left:1px solid var(--linha);
    height:100dvh;overflow-y:auto;padding:26px 26px calc(26px + env(safe-area-inset-bottom))}
  .gaveta .cabeca{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:22px}
  .gaveta h2{font-size:20px}
  .fechar{background:none;border:none;color:var(--nevoa);font-size:22px;cursor:pointer;line-height:1;padding:2px 6px}
  .fechar:hover{color:var(--branco)}
  .caixa-modal{width:100%;max-width:440px;background:var(--grafite);border:1px solid var(--linha);border-radius:14px;padding:26px}
  .caixa-modal h2{font-size:19px;margin-bottom:8px}
  .caixa-modal .ajuda{color:var(--nevoa);font-size:13.5px;margin-bottom:20px;line-height:1.5}
  .acoes-modal{display:flex;gap:10px;margin-top:20px}
  .acoes-modal .btn{flex:1}
  .grupo{margin-bottom:24px}
  .grupo h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ambar);margin-bottom:11px;font-weight:500}
  .par{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--linha);font-size:13px}
  .par:last-child{border-bottom:none}
  .par .r{color:var(--nevoa)}
  .par .v{word-break:break-all;font-family:var(--mono);font-size:12px}
  .par .v.vazio{color:#5a5a5a}
  .origem{background:var(--preto);border:1px solid var(--linha);border-radius:9px;padding:12px 14px;margin-bottom:10px}
  .origem-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  @media(max-width:520px){ .gaveta{max-width:100%} .par{grid-template-columns:96px 1fr} }

  .abas{display:flex;gap:4px;border-bottom:1px solid var(--linha);margin-bottom:22px}
  .aba{background:none;border:none;border-bottom:2px solid transparent;color:var(--nevoa);
    padding:11px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:7px;margin-bottom:-1px}
  .aba:hover{color:var(--branco)}
  .aba.ativa{color:var(--ambar);border-bottom-color:var(--ambar);font-weight:500}
  .aba-conta{font-family:var(--mono);font-size:10.5px;background:var(--grafite-2);border-radius:99px;padding:2px 6px}

  textarea{resize:vertical;line-height:1.5}
  .historico{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .vazio-bloco{color:var(--nevoa);font-size:13px;text-align:center;padding:24px 12px;border:1px dashed var(--linha);border-radius:10px}
  .vazio-geral{padding:44px 20px;text-align:center;color:var(--nevoa);font-size:14.5px}
  .nota{background:var(--preto);border:1px solid var(--linha);border-radius:9px;padding:13px 14px}
  .nota-topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
  .nota-data{font-family:var(--mono);font-size:10.5px;color:var(--nevoa)}
  .nota-apagar{background:none;border:none;color:#4b4b4b;cursor:pointer;font-size:13px;padding:2px 5px}
  .nota-apagar:hover{color:var(--vermelho)}
  .nota p{font-size:13.5px;color:#e4e0dc;white-space:pre-wrap;line-height:1.5}

  .passos-2fa{margin:0 0 18px 18px;color:#dad5d0;font-size:13.5px;display:flex;flex-direction:column;gap:7px}
  .qr-caixa{background:#fff;border-radius:10px;padding:12px;width:max-content;margin-bottom:16px}
  .qr-caixa img{display:block}
  .manual{font-size:13px;color:var(--nevoa)}
  .manual summary{cursor:pointer;padding:6px 0}
  .manual p{margin:8px 0}
  .chave-2fa{display:block;font-family:var(--mono);font-size:12.5px;background:var(--preto);border:1px solid var(--linha);border-radius:7px;padding:11px;word-break:break-all;color:var(--ambar)}

  .cartoes-config{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
  .abas-ajustes{margin-bottom:20px}
  .bloco{border:1px solid var(--linha);border-radius:12px;background:var(--grafite);padding:22px}
  .bloco h3{font-size:16px;margin-bottom:8px}
  .bloco p{color:var(--nevoa);font-size:13.5px;margin-bottom:16px}

  .mini{background:transparent;border:1px solid var(--linha);color:var(--nevoa);border-radius:6px;
    padding:5px 10px;font-size:11.5px;cursor:pointer}
  .mini:hover{border-color:var(--ambar);color:var(--branco)}
  .mini:disabled{opacity:.35;cursor:not-allowed;border-color:var(--linha);color:var(--nevoa)}

  /* conversas */
  .inbox{display:grid;grid-template-columns:340px minmax(0,1fr);border:1px solid var(--linha);border-radius:12px;overflow:hidden;
    background:var(--grafite);height:calc(100dvh - 170px);min-height:480px}
  .inbox-lista{border-right:1px solid var(--linha);display:flex;flex-direction:column;min-height:0}
  .inbox-itens{overflow-y:auto;flex:1;min-height:0}
  .inbox-topo{padding:12px 14px;border-bottom:1px solid var(--linha);background:var(--grafite)}
  .inbox-topo input[type=search]{width:100%;background:var(--preto);border:1px solid var(--linha);border-radius:9px;
    padding:9px 12px;color:var(--branco);font-size:13.5px;outline:none}
  .inbox-topo input[type=search]:focus{border-color:var(--ambar)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{background:transparent;border:1px solid var(--linha);color:var(--nevoa);border-radius:99px;
    padding:4px 11px;font-size:11.5px;cursor:pointer;white-space:nowrap}
  .chip:hover{color:var(--branco)}
  .chip.ativo{border-color:var(--ambar);color:var(--branco);background:rgba(255,106,0,.1)}
  .chip b{font-family:var(--mono);font-weight:600;color:var(--ambar)}
  .chip-sel{background:transparent;border:1px solid var(--linha);color:var(--nevoa);border-radius:99px;
    padding:4px 8px;font-size:11.5px;max-width:100%}
  .conv-item{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--linha);padding:12px 14px;cursor:pointer;color:inherit}
  .conv-item:hover{background:rgba(255,255,255,.03)}
  .conv-item.ativa{background:rgba(255,106,0,.08)}
  .conv-ava{flex:none;width:38px;height:38px;border-radius:50%;background:var(--grafite-2);border:1px solid var(--linha);
    display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:var(--nevoa)}
  .conv-corpo{display:block;min-width:0;flex:1}
  .conv-topo{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .conv-nome{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-hora{font-family:var(--mono);font-size:10.5px;color:var(--nevoa);flex:none}
  .conv-previa{display:flex;justify-content:space-between;gap:10px;margin-top:3px;color:var(--nevoa);font-size:12.5px}
  .conv-previa span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-pe{display:flex;gap:8px;align-items:center;margin-top:5px;min-height:0}
  .conv-pe:empty{display:none}
  .pino{font-size:10px;color:#25D366;border:1px solid rgba(37,211,102,.35);border-radius:99px;padding:1px 7px}
  .conv-dono{font-family:var(--mono);font-size:10px;color:var(--nevoa);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{background:#25D366;color:#04130a;font-family:var(--mono);font-size:10.5px;font-weight:600;border-radius:99px;padding:1px 7px;flex:none}
  .chat-painel{display:flex;flex-direction:column;min-height:0;height:100%}
  .chat{display:flex;flex-direction:column;min-height:0;flex:1}
  .chat-cabeca{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--linha)}
  .chat-msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:8px;background:#0d0d0d}
  .bolha{max-width:78%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.45;word-wrap:break-word}
  .bolha-texto{white-space:pre-wrap}
  .bolha.entrada{align-self:flex-start;background:var(--grafite-2);border-top-left-radius:4px}
  .bolha.saida{align-self:flex-end;background:rgba(37,211,102,.14);border:1px solid rgba(37,211,102,.25);border-top-right-radius:4px}
  .bolha.falhou{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.08)}
  .bolha-meta{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;font-family:var(--mono);font-size:10px;color:var(--nevoa)}
  .bolha-midia{font-family:var(--mono);font-size:11px;color:var(--nevoa);display:block;margin-bottom:3px}
  .bolha-erro{color:var(--vermelho);font-size:11.5px;margin-top:4px;white-space:normal}
  .dia-chat{align-self:center;font-family:var(--mono);font-size:10.5px;color:var(--nevoa);padding:4px 10px;border:1px solid var(--linha);border-radius:99px;margin:6px 0}
  .chat-rodape{border-top:1px solid var(--linha);padding:12px 16px}
  .chat-form{display:flex;gap:10px;align-items:flex-end}
  .chat-form textarea{min-height:46px;max-height:160px;resize:none;padding:12px}
  .chat-aviso{font-size:12.5px;color:var(--nevoa);margin-bottom:8px}
  .chat-aviso.alerta{color:var(--ambar)}
  .gaveta .chat{height:auto}
  .gaveta .chat-msgs{max-height:52dvh;min-height:220px;border:1px solid var(--linha);border-radius:10px}
  .gaveta .chat-rodape{padding:12px 0 0;border:0}
  @media(max-width:860px){
    .inbox{grid-template-columns:1fr;height:auto}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// Chave pública do projeto do CRM. O acesso real é decidido pelas regras do banco (RLS), não pela chave.
const SUPABASE_URL = "https://xrvjlhseyqfgyvwwlwwb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9DQ3pGVnensKAXdBxtdV3Q_Ud2pUEwK";
// Lido antes do cliente do Supabase, que consome o fragmento da URL ao iniciar.
const TIPO_LINK = new URLSearchParams(location.hash.slice(1)).get("type");
const ERRO_LINK = new URLSearchParams(location.hash.slice(1)).get("error_description");
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ETAPAS = [
  { id: "novo",        nome: "Novo lead",        cor: "#8A8A8A" },
  { id: "contato",     nome: "Em contato",       cor: "#60A5FA" },
  { id: "qualificado", nome: "Qualificado",      cor: "#22D3EE" },

  { id: "cliente",     nome: "Cliente",          cor: "#4ADE80" },
  { id: "perdido",     nome: "Perdido",          cor: "#F87171" },
];
const NOME_ETAPA = Object.fromEntries(ETAPAS.map((e) => [e.id, e.nome]));
const NOME_PAPEL = { agencia: "Agência", dono: "Dono", gestor: "Gestor", vendedor: "Vendedor", leitura: "Leitura" };
const NOME_CANAL = { site: "Site", ctwa: "WhatsApp", meta_form: "Formulário Meta", manual: "Manual" };

// Cada canal tem a sua forma de origem. Mensagem (CTWA) e formulário nativo trazem
// nomes resolvidos pela Meta; site traz os parâmetros de UTM do padrão do /funil.
const CAMPOS_ORIGEM = {
  ctwa: [["campanha_nome", "campanha"], ["conjunto_nome", "conjunto"], ["anuncio_nome", "anúncio"]],
  meta_form: [["campanha_nome", "campanha"], ["conjunto_nome", "conjunto"], ["anuncio_nome", "anúncio"]],
  site: [["utm_source", "source"], ["utm_medium", "medium"], ["utm_campaign", "campaign"], ["utm_content", "content"],
         ["utm_term", "term"], ["utm_placement", "placement"], ["ad_id", "ad_id"]],
  manual: [],
};
function camposOrigem(o) {
  return (CAMPOS_ORIGEM[o?.canal] || []).filter(([campo]) => o[campo]).map(([campo, rotulo]) => [rotulo, o[campo]]);
}
function campanhaDaOrigem(o) {
  return o ? (o.canal === "site" ? o.utm_campaign : o.campanha_nome) || "" : "";
}
const CHAVE_EMPRESA = "crm_empresa_atual";

let usuario = null;
let ehAgencia = false;
let empresas = [];
let empresaAtual = null;
let papel = null;        // agencia | dono | gestor | vendedor | leitura
let equipe = [];
let leads = [];
let notas = [];
let vistaAtual = "kanban";
let abaAjustes = "seguranca";
let busca = "";
let filtroCadastro = "todos";
let formularios = [];
let formEditando = null;   // cópia em edição; null mostra a lista
let conversas = [];
let conversaAberta = null; // id da conversa aberta na vista Conversas
let mensagensPorConversa = {};
let integracaoWhats = null; // estado vindo da função integracoes (sem segredos)

/* ---------------- permissões (espelham o banco; o banco é quem manda) ---------------- */
const pode = {
  editarTodos: () => ["agencia", "dono", "gestor"].includes(papel),
  editarLead: (l) => pode.editarTodos() || (papel === "vendedor" && l.responsavel_id === usuario.id),
  criarLead: () => papel !== "leitura",
  distribuir: () => pode.editarTodos(),
  administrar: () => ["agencia", "dono"].includes(papel),
  excluir: () => ["agencia", "dono"].includes(papel),
};

/* ---------------- utilidades ---------------- */
function escapar(valor) {
  return String(valor ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function dataCurta(iso) {
  return iso ? new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit" }) : "";
}
function dataHora(iso) {
  return iso ? new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
}

// Telefone no formato do banco (+5511999999999). Aceita o que a pessoa digitar com DDD.
function normalizarTelefone(bruto) {
  const d = String(bruto || "").replace(/\D/g, "");
  if (!d) return null;
  if (d.length === 10 || d.length === 11) return "+55" + d;
  if (d.length >= 12 && d.length <= 15) return "+" + d;
  return undefined; // inválido
}
function telefoneLegivel(t) {
  const m = String(t || "").match(/^\+55(\d{2})(\d{4,5})(\d{4})$/);
  return m ? `(${m[1]}) ${m[2]}-${m[3]}` : (t || "");
}

// Origens ordenadas: a primeira é a de entrada, a última a mais recente.
function origensDoLead(l) {
  return [...(l.lead_origens || [])].sort((a, b) => new Date(a.recebido_em) - new Date(b.recebido_em));
}
function ultimaOrigem(l) {
  const o = origensDoLead(l);
  return o[o.length - 1] || null;
}
function nomeResponsavel(id) {
  if (!id) return "";
  return equipe.find((m) => m.user_id === id)?.email || "";
}

const ICONE_WHATSAPP = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.7 15l-1.3 4.7 4.8-1.2A10 10 0 1 0 12 2Zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.6-.6-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 .9-2.2.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 1.9c.1.2.1.3 0 .5l-.4.5-.3.3c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.4.1.6-.1l.9-1c.2-.2.4-.2.6-.1l1.8.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg>';
const ICONE_NOTA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 10h16M4 15h10"/></svg>';

// Enquanto o chat não existe, o botão abre o WhatsApp comum.
function botaoWhatsApp(lead, rotulo) {
  if (!lead.telefone) return "";
  const url = `https://wa.me/${lead.telefone.replace(/\D/g, "")}`;
  return `<a class="zap${rotulo ? " zap-largo" : ""}" href="${url}" target="_blank" rel="noopener"
             draggable="false" title="Abrir conversa no WhatsApp"
             onclick="event.stopPropagation()">${ICONE_WHATSAPP}${rotulo ? `<span>${rotulo}</span>` : ""}</a>`;
}

/* ---------------- autenticação ---------------- */
async function iniciar() {
  if (ERRO_LINK) {
    const aviso = document.getElementById("aviso-login");
    aviso.className = "aviso erro";
    aviso.textContent = "Esse link expirou ou já foi usado. Peça um novo link de acesso a quem te convidou.";
    history.replaceState(null, "", location.pathname);
  }
  const { data } = await sb.auth.getSession();
  if (!data.session) return;
  if (TIPO_LINK === "invite" || TIPO_LINK === "recovery") {
    history.replaceState(null, "", location.pathname);
    pedirNovaSenha(TIPO_LINK);
    return;
  }
  if (await precisaSegundaEtapa()) { pedirCodigo(); return; }
  entrarNoApp(data.session);
}

function pedirNovaSenha(tipo) {
  document.getElementById("form-login").style.display = "none";
  document.getElementById("form-definir-senha").style.display = "";
  document.getElementById("definir-senha-texto").textContent = tipo === "invite"
    ? "Você foi convidado para o CRM. Crie a sua senha para entrar."
    : "Crie uma nova senha para entrar.";
  document.getElementById("definir-senha").focus();
}

document.getElementById("form-definir-senha").addEventListener("submit", async (e) => {
  e.preventDefault();
  const aviso = document.getElementById("aviso-definir-senha");
  const nova = document.getElementById("definir-senha").value;
  if (nova.length < 8) { aviso.className = "aviso erro"; aviso.textContent = "A senha precisa ter pelo menos 8 caracteres."; return; }
  if (nova !== document.getElementById("definir-senha-2").value) { aviso.className = "aviso erro"; aviso.textContent = "As duas senhas não são iguais."; return; }
  const btn = document.getElementById("btn-definir-senha");
  btn.disabled = true;
  aviso.className = "aviso";
  aviso.textContent = "Salvando...";
  const { error } = await sb.auth.updateUser({ password: nova });
  btn.disabled = false;
  if (error) { aviso.className = "aviso erro"; aviso.textContent = "Não deu pra salvar: " + error.message; return; }
  document.getElementById("form-definir-senha").style.display = "none";
  if (await precisaSegundaEtapa()) { pedirCodigo(); return; }
  const { data } = await sb.auth.getSession();
  entrarNoApp(data.session);
});

async function precisaSegundaEtapa() {
  const { data, error } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (error || !data) return false;
  return data.nextLevel === "aal2" && data.currentLevel !== "aal2";
}

function pedirCodigo() {
  document.getElementById("form-login").style.display = "none";
  document.getElementById("form-codigo").style.display = "";
  document.getElementById("codigo-2fa").focus();
}

async function verificarCodigo(codigo) {
  const { data: fatores, error: erroFatores } = await sb.auth.mfa.listFactors();
  if (erroFatores) return { erro: erroFatores.message };
  const fator = (fatores?.totp || []).find((f) => f.status === "verified");
  if (!fator) return { erro: "Nenhum aplicativo autenticador cadastrado." };
  const { data: desafio, error: erroDesafio } = await sb.auth.mfa.challenge({ factorId: fator.id });
  if (erroDesafio) return { erro: erroDesafio.message };
  const { error } = await sb.auth.mfa.verify({ factorId: fator.id, challengeId: desafio.id, code: codigo });
  return error ? { erro: error.message } : { ok: true };
}

document.getElementById("form-codigo").addEventListener("submit", async (e) => {
  e.preventDefault();
  const aviso = document.getElementById("aviso-codigo");
  const btn = document.getElementById("btn-verificar");
  const codigo = document.getElementById("codigo-2fa").value.replace(/\D/g, "");
  if (codigo.length !== 6) { aviso.className = "aviso erro"; aviso.textContent = "O código tem 6 dígitos."; return; }
  btn.disabled = true;
  aviso.className = "aviso";
  aviso.textContent = "Verificando...";
  const resultado = await verificarCodigo(codigo);
  btn.disabled = false;
  if (resultado.erro) {
    aviso.className = "aviso erro";
    aviso.textContent = resultado.erro.includes("Invalid") ? "Código incorreto ou expirado." : resultado.erro;
    document.getElementById("codigo-2fa").value = "";
    return;
  }
  const { data } = await sb.auth.getSession();
  document.getElementById("form-codigo").style.display = "none";
  entrarNoApp(data.session);
});

document.getElementById("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const aviso = document.getElementById("aviso-login");
  const btn = document.getElementById("btn-entrar");
  btn.disabled = true;
  aviso.className = "aviso";
  aviso.textContent = "Entrando...";
  const { data, error } = await sb.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("senha").value,
  });
  btn.disabled = false;
  if (error) {
    aviso.className = "aviso erro";
    aviso.textContent = error.message === "Invalid login credentials" ? "E-mail ou senha incorretos." : "Não deu pra entrar: " + error.message;
    return;
  }
  aviso.textContent = "";
  if (await precisaSegundaEtapa()) { pedirCodigo(); return; }
  entrarNoApp(data.session);
});

async function sair() {
  await sb.auth.signOut();
  location.reload();
}
document.getElementById("btn-sair").addEventListener("click", sair);

async function entrarNoApp(sessao) {
  usuario = sessao.user;
  document.getElementById("tela-login").style.display = "none";
  document.getElementById("app").classList.add("ativo");
  document.getElementById("usuario-email").textContent = usuario.email;
  await carregarEmpresas();
}

async function carregarEmpresas(selecionar) {
  const [resAgencia, resEmpresas, resMembros] = await Promise.all([
    sb.from("agencia_admins").select("user_id").eq("user_id", usuario.id).maybeSingle(),
    sb.from("empresas").select("id, nome, slug, ativo").order("nome"),
    sb.from("membros").select("empresa_id, papel").eq("user_id", usuario.id),
  ]);
  ehAgencia = !!resAgencia.data;
  empresas = resEmpresas.data || [];
  const papeis = Object.fromEntries((resMembros.data || []).map((m) => [m.empresa_id, m.papel]));
  empresas.forEach((e) => { e.papel = ehAgencia ? "agencia" : papeis[e.id]; });

  if (!empresas.length && ehAgencia) {
    // Agência sem nenhuma empresa: vai direto para criar a primeira.
    document.querySelector(".seletor-empresa").style.display = "none";
    document.getElementById("nav").style.display = "none";
    empresaAtual = null;
    papel = "agencia";
    document.getElementById("conteudo").innerHTML = `
      <div class="topo"><div><h1>Primeira empresa</h1><div class="desc">Crie o primeiro cliente para começar.</div></div></div>
      <div class="cartoes-config">${vistaConfigPainel("empresas")}</div>`;
    ligarEventos();
    return;
  }

  if (!empresas.length) {
    document.getElementById("nav").style.display = "none";
    document.querySelector(".seletor-empresa").style.display = "none";
    document.getElementById("conteudo").innerHTML = `
      <div class="topo"><div><h1>Sem acesso ainda</h1>
      <div class="desc">Sua conta (${escapar(usuario.email)}) ainda não foi adicionada a nenhuma empresa. Peça o acesso a quem administra o CRM.</div></div></div>`;
    return;
  }

  let salva = null;
  try { salva = localStorage.getItem(CHAVE_EMPRESA); } catch (err) {}
  const inicial = empresas.find((e) => e.id === (selecionar || salva)) || empresas[0];

  document.getElementById("nav").style.display = "";
  document.querySelector(".seletor-empresa").style.display = "";
  const sel = document.getElementById("empresa-sel");
  sel.innerHTML = empresas.map((e) => `<option value="${e.id}">${escapar(e.nome)}</option>`).join("");
  sel.onchange = () => trocarEmpresa(sel.value);
  await trocarEmpresa(inicial.id);
}

async function trocarEmpresa(id) {
  empresaAtual = empresas.find((e) => e.id === id);
  papel = empresaAtual.papel;
  formEditando = null;
  conversaAberta = null;
  mensagensPorConversa = {};
  integracaoWhats = null;
  avisosIntegracao = {};
  if (vistaAtual === "formularios" && !pode.administrar()) vistaAtual = "kanban";
  if (abaAjustes === "integracoes" && !pode.administrar()) abaAjustes = "seguranca";
  try { localStorage.setItem(CHAVE_EMPRESA, id); } catch (err) {}
  document.getElementById("empresa-sel").value = id;
  document.getElementById("papel-atual").textContent = NOME_PAPEL[papel] || "";
  await carregarTudo();
}

/* ---------------- dados ---------------- */
async function carregarTudo() {
  const [resLeads, resNotas, resEquipe, resForms, resConversas] = await Promise.all([
    sb.from("leads").select("*, lead_origens(*)").eq("empresa_id", empresaAtual.id).order("criado_em", { ascending: false }),
    sb.from("lead_notas").select("*").eq("empresa_id", empresaAtual.id).order("criado_em", { ascending: false }),
    sb.rpc("membros_da_empresa", { p_empresa: empresaAtual.id }),
    sb.from("formularios").select("*").eq("empresa_id", empresaAtual.id).order("criado_em"),
    sb.from("conversas").select("*").eq("empresa_id", empresaAtual.id).order("ultima_mensagem_em", { ascending: false }),
  ]);
  if (resLeads.error) console.error("leads:", resLeads.error);
  leads = resLeads.data || [];
  notas = resNotas.data || [];
  equipe = resEquipe.data || [];
  formularios = resForms.data || [];
  conversas = resConversas.data || [];
  document.getElementById("cont-leads").textContent = leads.length || "";
  atualizarContadorConversas();
  render();
}

function atualizarContadorConversas() {
  const naoLidas = conversas.reduce((soma, c) => soma + (c.nao_lidas || 0), 0);
  document.getElementById("cont-conversas").textContent = naoLidas || "";
}

// Enquanto a pessoa está no CRM, busca conversas novas a cada 10 segundos.
setInterval(async () => {
  if (!empresaAtual || document.hidden) return;
  const { data } = await sb.from("conversas").select("*").eq("empresa_id", empresaAtual.id)
    .order("ultima_mensagem_em", { ascending: false });
  if (!data) return;
  const mudou = JSON.stringify(data.map((c) => [c.id, c.ultima_mensagem_em, c.nao_lidas])) !==
    JSON.stringify(conversas.map((c) => [c.id, c.ultima_mensagem_em, c.nao_lidas]));
  if (!mudou) return;
  const novoLead = data.some((c) => !leads.find((l) => l.id === c.lead_id));
  conversas = data;
  atualizarContadorConversas();
  if (novoLead) { await carregarTudo(); return; }
  for (const c of data) {
    const antes = conversas.find((x) => x.id === c.id);
    if (!antes || antes.ultima_mensagem_em !== c.ultima_mensagem_em) delete mensagensPorConversa[c.id];
  }
  if (vistaAtual === "conversas" && !document.querySelector(".chat-campo:focus")) {
    render();
  } else {
    document.dispatchEvent(new CustomEvent("conversas-atualizadas"));
  }
}, 10000);

// Chama a função do servidor que precisa de privilégio de administrador (convite e link).
async function chamarEquipe(corpo) {
  const { data: sessao } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/equipe`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${sessao.session.access_token}` },
    body: JSON.stringify({ empresa_id: empresaAtual.id, ...corpo }),
  });
  const dados = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(dados.erro || `Erro ${res.status}`);
  return dados;
}

// Mostra o link com botão de copiar. O link dá acesso à conta: só mandar para a própria pessoa.
function mostrarLink(alvoId, link, texto) {
  const alvo = document.getElementById(alvoId);
  if (!alvo) return;
  alvo.innerHTML = `
    <div class="origem" style="margin-top:14px">
      <p style="margin-bottom:10px">${texto}</p>
      <code class="chave-2fa" style="margin-bottom:10px">${escapar(link)}</code>
      <button class="btn btn-largo btn-fantasma" type="button" id="${alvoId}-copiar">Copiar link</button>
    </div>`;
  document.getElementById(`${alvoId}-copiar`).addEventListener("click", async (e) => {
    try { await navigator.clipboard.writeText(link); e.target.textContent = "Copiado"; } catch (err) { e.target.textContent = "Selecione e copie o link acima"; }
  });
}

function seloCanal(o) {

    if (!termo) return true;

    return [l.nome, l.email, l.telefone, o.campanha_nome, o.conjunto_nome, o.anuncio_nome, o.utm_campaign, o.utm_medium, o.utm_content]

/* ---------------- conversas (WhatsApp) ---------------- */
const JANELA_WHATS_MS = 24 * 3600 * 1000;
const ROTULO_STATUS = { enviando: "enviando", enviada: "✓", entregue: "✓✓", lida: "✓✓ lida", falhou: "não enviada", recebida: "" };
const ROTULO_MIDIA = { imagem: "Imagem", video: "Vídeo", audio: "Áudio", documento: "Documento", figurinha: "Figurinha", localizacao: "Localização", reacao: "Reação", outro: "Mensagem não suportada" };

function horaCurta(iso) {
  const d = new Date(iso);
  const hoje = new Date();
  return d.toDateString() === hoje.toDateString()
    ? d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
}

function leadDaConversa(c) {
  return leads.find((l) => l.id === c.lead_id) || null;
}

async function carregarMensagens(conversaId) {
  const { data, error } = await sb.from("mensagens").select("*").eq("conversa_id", conversaId).order("criado_em");
  if (error) { console.error("mensagens:", error); return []; }
  mensagensPorConversa[conversaId] = data || [];
  return mensagensPorConversa[conversaId];
}

function janelaAberta(c) {
  return !!c.ultima_entrada_em && Date.now() - new Date(c.ultima_entrada_em).getTime() < JANELA_WHATS_MS;
}

// Corpo do chat reaproveitado na vista Conversas e na ficha do lead.
function htmlChat(c) {
  const l = leadDaConversa(c);
  const msgs = mensagensPorConversa[c.id];
  let ultimoDia = "";
  const bolhas = !msgs ? '<div class="chat-aviso">Carregando mensagens...</div>'
    : !msgs.length ? '<div class="chat-aviso">Nenhuma mensagem ainda.</div>'
    : msgs.map((m) => {
      const dia = new Date(m.criado_em).toLocaleDateString("pt-BR", { day: "2-digit", month: "long" });
      const separador = dia !== ultimoDia ? `<div class="dia-chat">${dia}</div>` : "";
      ultimoDia = dia;
      const midia = m.tipo !== "texto" ? `<span class="bolha-midia">${escapar(ROTULO_MIDIA[m.tipo] || m.tipo)}</span>` : "";
      const autor = m.direcao === "saida" && m.autor_id ? nomeResponsavel(m.autor_id).split("@")[0] : "";
      // sem espaços entre as tags: o texto da mensagem usa pre-wrap e mostraria a indentação
      return separador +
        `<div class="bolha ${m.direcao}${m.status === "falhou" ? " falhou" : ""}">` +
        midia + `<span class="bolha-texto">${escapar(m.texto || "")}</span>` +
        (m.erro ? `<div class="bolha-erro">${escapar(m.erro)}</div>` : "") +
        `<div class="bolha-meta">${autor ? `<span>${escapar(autor)}</span>` : ""}<span>${new Date(m.criado_em).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</span><span>${ROTULO_STATUS[m.status] || ""}</span></div>` +
        `</div>`;
    }).join("");

  const podeResponder = l && pode.editarLead(l);
  const oficial = c.canal === 'whatsapp_oficial';
  const aberta = !oficial || janelaAberta(c);
  const rodape = !podeResponder
    ? '<div class="chat-aviso">Você pode ler esta conversa, mas só quem é responsável pelo lead responde.</div>'
    : !aberta
      ? `<div class="chat-aviso alerta">${c.ultima_entrada_em
          ? "Passaram 24h desde a última mensagem do lead. Pela regra da Meta, a conversa só pode ser retomada com um modelo aprovado (em breve no CRM)."
          : "No WhatsApp oficial, quem começa a conversa precisa de um modelo aprovado pela Meta (em breve no CRM). Por enquanto, espere a pessoa chamar."}</div>`
      : `<div class="chat-aviso">${oficial ? `WhatsApp oficial. Janela aberta até ${new Date(new Date(c.ultima_entrada_em).getTime() + JANELA_WHATS_MS).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}.` : "WhatsApp NeoGo. Respostas saem pelo número da empresa."}</div>
         <form class="chat-form" data-chat-form="${c.id}">
           <textarea class="chat-campo" rows="1" placeholder="Escreva a resposta. Enter envia, Shift+Enter quebra linha" maxlength="4096"></textarea>
           <button class="btn" type="submit">Enviar</button>
         </form>
         <div class="aviso" data-chat-aviso="${c.id}"></div>`;

  return `
    <div class="chat" data-chat="${c.id}">
      <div class="chat-msgs">${bolhas}</div>
      <div class="chat-rodape">${rodape}</div>
    </div>`;
}

// Filtros da lista, no espírito do WhatsApp Web: busca, estado e responsável.
const filtroConv = { busca: "", estado: "todas", responsavel: "" };
const CHIPS_CONV = [["todas", "Todas"], ["nao_lidas", "Não lidas"], ["sem_resposta", "Sem resposta"]];

// A última mensagem foi do lead: ninguém respondeu ainda.
function semResposta(c) {
  return !!c.ultima_entrada_em &&
    new Date(c.ultima_entrada_em).getTime() >= new Date(c.ultima_mensagem_em).getTime() - 1000;
}

function iniciais(texto) {
  const partes = String(texto || "").trim().split(/\s+/).filter(Boolean);
  if (!partes.length) return "?";
  return (partes[0][0] + (partes[1]?.[0] || "")).toUpperCase();
}

function conversasFiltradas() {
  const termo = filtroConv.busca.trim().toLowerCase();
  return conversas.filter((c) => {
    const l = leadDaConversa(c);
    if (filtroConv.estado === "nao_lidas" && !c.nao_lidas) return false;
    if (filtroConv.estado === "sem_resposta" && !semResposta(c)) return false;
    if (filtroConv.responsavel) {
      const r = l?.responsavel_id || "";
      if (filtroConv.responsavel === "sem" ? !!r : r !== filtroConv.responsavel) return false;
    }
    if (!termo) return true;
    return [l?.nome, l?.telefone, c.wa_id, c.ultima_previa, nomeResponsavel(l?.responsavel_id)]
      .filter(Boolean).join(" ").toLowerCase().includes(termo);
  });
}

function barraFiltrosConversas() {
  const conta = (estado) => estado === "nao_lidas" ? conversas.filter((c) => c.nao_lidas).length
    : estado === "sem_resposta" ? conversas.filter(semResposta).length : 0;
  const chips = CHIPS_CONV.map(([id, nome]) => {
    const n = conta(id);
    return `<button class="chip${filtroConv.estado === id ? " ativo" : ""}" type="button" data-filtro-conv="${id}">${nome}${n ? ` <b>${n}</b>` : ""}</button>`;
  }).join("");
  const responsaveis = pode.editarTodos() && equipe.length ? `
    <select class="chip-sel" id="filtro-conv-resp">
      <option value="">Todos os responsáveis</option>
      ${equipe.map((m) => `<option value="${m.user_id}"${filtroConv.responsavel === m.user_id ? " selected" : ""}>${escapar(m.user_id === usuario.id ? "Minhas conversas" : m.email)}</option>`).join("")}
      <option value="sem"${filtroConv.responsavel === "sem" ? " selected" : ""}>Sem responsável</option>
    </select>` : "";
  return `
    <div class="inbox-topo">
      <input type="search" id="busca-conv" placeholder="Buscar nome ou número" value="${escapar(filtroConv.busca)}" autocomplete="off">
      <div class="chips">${chips}${responsaveis}</div>
    </div>`;
}

function vistaConversas() {
  const ativa = conversas.find((c) => c.id === conversaAberta);
  const filtradas = conversasFiltradas();
  const lista = filtradas.length ? filtradas.map((c) => {
    const l = leadDaConversa(c);
    const nome = l?.nome || telefoneLegivel(l?.telefone) || c.wa_id;
    const dono = nomeResponsavel(l?.responsavel_id);
    return `
      <button class="conv-item${c.id === conversaAberta ? " ativa" : ""}" type="button" data-abrir-conversa="${c.id}">
        <span class="conv-ava">${escapar(iniciais(l?.nome || nome))}</span>
        <span class="conv-corpo">
          <span class="conv-topo"><span class="conv-nome">${escapar(nome)}</span><span class="conv-hora">${horaCurta(c.ultima_mensagem_em)}</span></span>
          <span class="conv-previa"><span>${escapar(c.ultima_previa || "Conversa aberta pelo CRM")}</span>${c.nao_lidas ? `<span class="badge">${c.nao_lidas}</span>` : ""}</span>
          <span class="conv-pe">${semResposta(c) ? '<span class="pino">sem resposta</span>' : ""}${dono && pode.editarTodos() ? `<span class="conv-dono">${escapar(dono.split("@")[0])}</span>` : ""}</span>
        </span>
      </button>`;
  }).join("") : '<div class="vazio-geral" style="padding:34px 18px">Nada com esse filtro.</div>';

  const l = ativa ? leadDaConversa(ativa) : null;
  const painel = ativa ? `
    <div class="chat-cabeca">
      <div>
        <div class="nome-cel">${escapar(l?.nome || "Sem nome")}</div>
        <div class="sub-cel">${escapar(telefoneLegivel(l?.telefone))} ${seloCanal(l ? ultimaOrigem(l) : null)}</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="mini" type="button" id="voltar-lista">Conversas</button>
        ${l ? `<button class="mini" type="button" data-ver-lead="${l.id}">Ver lead</button>` : ""}
      </div>
    </div>
    ${htmlChat(ativa)}`

// Puxar assunto primeiro: digita o número, o CRM acha ou cria o lead e abre a conversa.
function formularioNovaConversa() {
  const div = document.createElement("div");
  div.className = "fundo-modal fundo-centro";
  div.innerHTML = `
    <div class="caixa-modal">
      <h2>Nova conversa</h2>
      <p class="ajuda">Número com DDD. Se essa pessoa já for lead, a conversa abre na ficha dela em vez de criar outra.</p>
      <div class="campo"><label for="nc-tel">Número do WhatsApp</label>

      <div class="campo"><label for="nc-nome">Nome (opcional)</label>
        <input type="text" id="nc-nome" autocomplete="off"></div>
      <div class="aviso" id="nc-aviso"></div>
      <div class="acoes-modal">
        <button class="btn btn-fantasma" type="button" id="nc-cancelar">Cancelar</button>
        <button class="btn" type="button" id="nc-abrir">Abrir conversa</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  const fechar = () => { div.remove(); document.removeEventListener("keydown", aoTeclar); };
  function aoTeclar(e) { if (e.key === "Escape") fechar(); }
  document.addEventListener("keydown", aoTeclar);
  div.addEventListener("click", (e) => { if (e.target === div) fechar(); });
  div.querySelector("#nc-cancelar").addEventListener("click", fechar);

  const campo = div.querySelector("#nc-tel");
  campo.focus();
  campo.addEventListener("keydown", (e) => { if (e.key === "Enter") div.querySelector("#nc-abrir").click(); });

  const ERROS = {
    telefone_invalido: "Esse número não parece válido. Escreva com DDD.",
    sem_whatsapp: "O WhatsApp desta empresa ainda não está ligado. Configure em Ajustes, Integrações.",
    lead_de_outro: "Esse número já é lead de outra pessoa da equipe. Peça para ela responder.",
    sem_permissao: "Seu acesso é só de leitura.",
    sem_acesso: "Você não tem acesso a esta empresa.",
  };

  div.querySelector("#nc-abrir").addEventListener("click", async () => {
    const aviso = div.querySelector("#nc-aviso");
    const telefone = normalizarTelefone(campo.value);
    if (!telefone) { aviso.className = "aviso erro"; aviso.textContent = "Escreva o número com DDD."; return; }
    aviso.className = "aviso";
    aviso.textContent = "Abrindo...";
    const { data, error } = await sb.rpc("abrir_conversa_whatsapp", {
      p_empresa: empresaAtual.id, p_telefone: telefone, p_nome: div.querySelector("#nc-nome").value.trim() || null,
    });
    if (error) {
      const chave = Object.keys(ERROS).find((k) => error.message.includes(k));
      aviso.className = "aviso erro";
      aviso.textContent = chave ? ERROS[chave] : "Não deu pra abrir: " + error.message;
      return;
    }
    fechar();
    const nova = Array.isArray(data) ? data[0] : data;
    await carregarTudo();
    vistaAtual = "conversas";
    filtroConv.busca = "";
    filtroConv.estado = "todas";
    abrirConversa(nova.conversa_id);
  });
}

function rolarChat(raiz) {
  (raiz || document).querySelectorAll(".chat-msgs").forEach((el) => { el.scrollTop = el.scrollHeight; });
}

// Liga envio e rolagem de um chat já desenhado. `aoMudar` redesenha quem hospeda o chat.
function ligarChat(raiz, conversa, aoMudar) {
  rolarChat(raiz);
  const form = raiz.querySelector(`[data-chat-form="${conversa.id}"]`);
  if (!form) return;
  const campo = form.querySelector("textarea");
  const aviso = raiz.querySelector(`[data-chat-aviso="${conversa.id}"]`);
  campo.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  campo.addEventListener("input", () => { campo.style.height = "auto"; campo.style.height = Math.min(campo.scrollHeight, 160) + "px"; });
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const texto = campo.value.trim();
    if (!texto) return;
    const botao = form.querySelector("button");
    botao.disabled = true;
    aviso.className = "aviso";
    aviso.textContent = "Enviando...";
    try {
      const { data: sessao } = await sb.auth.getSession();
      const res = await fetch(`${SUPABASE_URL}/functions/v1/whatsapp-enviar`, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${sessao.session.access_token}` },
        body: JSON.stringify({ conversa_id: conversa.id, texto }),
      });
      const dados = await res.json().catch(() => ({}));
      await carregarMensagens(conversa.id);
      const { data: atual } = await sb.from("conversas").select("*").eq("id", conversa.id).single();
      if (atual) Object.assign(conversa, atual);
      if (!res.ok) {
        aoMudar();
        const novoAviso = document.querySelector(`[data-chat-aviso="${conversa.id}"]`);
        if (novoAviso) { novoAviso.className = "aviso erro"; novoAviso.textContent = dados.erro || "Não deu pra enviar."; }
        return;
      }
      aoMudar();
    } catch (err) {
      botao.disabled = false;
      aviso.className = "aviso erro";
      aviso.textContent = "Sem conexão: " + err.message;
    }
  });
}

const carregandoMensagens = new Map();

async function abrirConversa(id) {
  conversaAberta = id;
  const c = conversas.find((x) => x.id === id);
  render();
  await garantirMensagens(id);
  if (c?.nao_lidas) {
    c.nao_lidas = 0;
    atualizarContadorConversas();
    sb.rpc("marcar_conversa_lida", { p_conversa: id });
  }
  if (vistaAtual === "conversas" && conversaAberta === id) render();
}

function ligarConversas() {
  document.querySelectorAll("[data-abrir-conversa]").forEach((b) => b.addEventListener("click", () => abrirConversa(b.dataset.abrirConversa)));
  const nova = document.getElementById("btn-nova-conversa");
  if (nova) nova.addEventListener("click", formularioNovaConversa);
  document.querySelectorAll("[data-filtro-conv]").forEach((b) => b.addEventListener("click", () => {
    filtroConv.estado = b.dataset.filtroConv;
    render();
  }));
  const selResp = document.getElementById("filtro-conv-resp");
  if (selResp) selResp.addEventListener("change", () => { filtroConv.responsavel = selResp.value; render(); });
  const buscaConv = document.getElementById("busca-conv");
  if (buscaConv) buscaConv.addEventListener("input", (e) => {
    filtroConv.busca = e.target.value;
    const posicao = e.target.selectionStart;
    render();
    const novo = document.getElementById("busca-conv");
    if (novo) { novo.focus(); novo.setSelectionRange(posicao, posicao); }
  });
  const voltar = document.getElementById("voltar-lista");
  if (voltar) voltar.addEventListener("click", () => { conversaAberta = null; render(); });
  document.querySelectorAll("[data-ver-lead]").forEach((b) => b.addEventListener("click", () => abrirLead(b.dataset.verLead, "conversa")));
  if (vistaAtual !== "conversas" || !conversaAberta) return;
  const c = conversas.find((x) => x.id === conversaAberta);
  const raiz = document.querySelector(".chat-painel");
  if (c && raiz) {
    const carregando = garantirMensagens(c.id);
    // só a primeira chamada redesenha; as outras compartilham a mesma promessa e não reagendam
    if (carregando && !carregando.redesenhoAgendado) {
      carregando.redesenhoAgendado = true;
      carregando.then(() => { if (vistaAtual === "conversas" && conversaAberta === c.id) render(); });
    }
    ligarChat(raiz, c, () => render());
  }
}

// Busca as mensagens uma vez só. Quem chama durante o carregamento recebe a mesma promessa,
// e quem chama depois de carregado recebe null (não precisa redesenhar de novo).
function garantirMensagens(id) {
  if (mensagensPorConversa[id]) return null;
  if (!carregandoMensagens.has(id)) {
    const promessa = carregarMensagens(id).finally(() => carregandoMensagens.delete(id));
    carregandoMensagens.set(id, promessa);
  }
  return carregandoMensagens.get(id);
}

async function chamarIntegracoes(corpo) {

    method: "POST",

    body: JSON.stringify({ empresa_id: empresaAtual.id, ...corpo }),

  if (!res.ok) throw new Error(dados.erro || `Erro ${res.status}`);

}

async function carregarIntegracoes() {
  try {
    integracaoWhats = await chamarIntegracoes({ acao: "ver" });
  } catch (err) {
    integracaoWhats = { erroCarga: err.message };
  }
  if (vistaAtual === "config" && abaAjustes === "integracoes") render();
}

const TIPO_POR_PREFIXO = { ng: "whatsapp_nao_oficial", wa: "whatsapp_oficial", mt: "meta" };
const NOME_POR_PREFIXO = { ng: "a NeoGo", wa: "o WhatsApp oficial", mt: "o token da Meta" };

function camposIntegracao(prefixo) {
  const v = (id) => document.getElementById(id)?.value.trim() || "";
  if (prefixo === "ng") return { base_url: v("ng-base"), instance_id: v("ng-inst"), instance_token: v("ng-token") };
  if (prefixo === "mt") return { token: v("mt-token"), ad_account_id: v("mt-conta") };
  return { phone_number_id: v("wa-pnid"), waba_id: v("wa-waba"), token: v("wa-token"), app_secret: v("wa-secret") };
}

function ligarIntegracoes() {
  if (vistaAtual !== "config" || abaAjustes !== "integracoes") return;
  if (!integracaoWhats) { carregarIntegracoes(); return; }

  document.querySelectorAll("[data-copiar]").forEach((b) => b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(document.getElementById(b.dataset.copiar).textContent); b.textContent = "Copiado"; }
    catch (err) { b.textContent = "Selecione e copie"; }
  }));

  const avisar = (prefixo, msg, tipo) => {
    avisosIntegracao[prefixo] = { msg, tipo: tipo || "" };
    const alvo = document.getElementById("aviso-" + prefixo);
    if (alvo) { alvo.className = "aviso " + (tipo || ""); alvo.textContent = msg; }
  };
  // atualiza só o bloco que mudou, sem perder o que já foi carregado dos outros
  const aplicar = (prefixo, estado) => {
    integracaoWhats = { ...integracaoWhats, [TIPO_POR_PREFIXO[prefixo]]: estado };
    render();
  };

  document.querySelectorAll("[data-integ-salvar]").forEach((b) => b.addEventListener("click", async () => {
    const p = b.dataset.integSalvar;
    b.disabled = true;
    avisar(p, "Salvando...");
    try {
      const estado = await chamarIntegracoes({ acao: "salvar", tipo: TIPO_POR_PREFIXO[p], ...camposIntegracao(p) });
      avisosIntegracao[p] = { msg: "Salvo. Agora clique em Testar conexão.", tipo: "ok" };
      aplicar(p, estado);
    } catch (err) {
      b.disabled = false;
      avisar(p, err.message, "erro");
    }
  }));

  document.querySelectorAll("[data-integ-testar]").forEach((b) => b.addEventListener("click", async () => {
    const p = b.dataset.integTestar;
    b.disabled = true;
    avisar(p, "Testando...");
    try {
      const r = await chamarIntegracoes({ acao: "testar", tipo: TIPO_POR_PREFIXO[p] });
      avisosIntegracao[p] = r.ok
        ? { msg: r.aviso || (p === "mt" ? "Token válido. Os próximos leads de anúncio chegam com os nomes." : "Conectado. As mensagens já chegam em Conversas."), tipo: r.parcial ? "" : "ok" }
        : { msg: r.erro, tipo: "erro" };
      aplicar(p, r.estado || integracaoWhats[TIPO_POR_PREFIXO[p]]);
    } catch (err) {
      b.disabled = false;
      avisar(p, err.message, "erro");
    }
  }));

  document.querySelectorAll("[data-integ-desligar]").forEach((b) => b.addEventListener("click", async () => {
    const p = b.dataset.integDesligar;
    if (!confirm(`Desligar ${NOME_POR_PREFIXO[p]} desta empresa? As credenciais são apagadas. O histórico de conversas fica.`)) return;
    try {
      const estado = await chamarIntegracoes({ acao: "desligar", tipo: TIPO_POR_PREFIXO[p] });
      avisosIntegracao[p] = null;
      aplicar(p, estado);
    } catch (err) {
      avisar(p, err.message, "erro");
    }
  }));

  document.getElementById("ng-registrar")?.addEventListener("click", async (ev) => {
    const globalKey = document.getElementById("ng-global").value.trim();
    const slot = Number(document.getElementById("ng-slot").value);
    if (!globalKey) { avisar("ng-webhook", "Informe a Global API Key.", "erro"); return; }
    ev.target.disabled = true;
    avisar("ng-webhook", "Registrando na NeoGo...");
    try {
      const r = await chamarIntegracoes({ acao: "registrar_webhook", tipo: "whatsapp_nao_oficial", global_key: globalKey, slot });
      avisosIntegracao["ng-webhook"] = { msg: `Webhook registrado no slot ${slot}. Mande uma mensagem para o número para ver chegar em Conversas.`, tipo: "ok" };
      aplicar("ng", r.estado);
    } catch (err) {
      ev.target.disabled = false;
      avisar("ng-webhook", err.message, "erro");
    }
  });
}

let fundoPrevia = "claro";
function atualizarPrevia() {
  const iframe = document.getElementById("previa-form");
  if (!iframe || !formEditando) return;

  // Site de exemplo com botão próprio, para a detecção automática ter o que copiar.
  const site = escuro
    ? { fundo: "#101418", texto: "#f1f5f9", botao: "#22c55e", textoBotao: "#052e16", raio: "999px", fonte: "Georgia, serif" }
    : { fundo: "#f7f4ef", texto: "#1f2937", botao: "#1d4ed8", textoBotao: "#ffffff", raio: "6px", fonte: "Arial, Helvetica, sans-serif" };
  const config = JSON.stringify(formEditando.config).replace(/</g, "\\u003c");
  iframe.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

function ligarFormularios() {
  const novoForm = document.getElementById("btn-novo-form");
  if (novoForm) novoForm.addEventListener("click", () => {
    formEditando = { id: null, nome: "", ativo: true, config: configPadrao() };
    render();
  });

  document.querySelectorAll("[data-editar-form]").forEach((b) => b.addEventListener("click", () => {
    const f = formularios.find((x) => x.id === b.dataset.editarForm);
    const base = configPadrao();
    formEditando = JSON.parse(JSON.stringify({ ...f, config: { ...base, ...f.config, visual: { ...base.visual, ...(f.config?.visual || {}) } } }));
    render();
  }));

  document.querySelectorAll("[data-copiar-form]").forEach((b) => b.addEventListener("click", async () => {
    const f = formularios.find((x) => x.id === b.dataset.copiarForm);
    try { await navigator.clipboard.writeText(codigoFormulario(f)); b.textContent = "Copiado"; }
    catch (err) { b.textContent = "Selecione o código acima"; }
  }));

  if (!formEditando || !document.getElementById("previa-form")) return;
  const f = formEditando;
  const c = f.config;

  // Campos de texto só atualizam a prévia; mudanças de estrutura redesenham o editor.
  let espera;
  const previaDepois = () => { clearTimeout(espera); espera = setTimeout(atualizarPrevia, 350); };

  document.querySelectorAll("[data-raiz]").forEach((el) => el.addEventListener(el.type === "checkbox" ? "change" : "input", () => {
    f[el.dataset.raiz] = el.type === "checkbox" ? el.checked : el.value;
  }));
  document.querySelectorAll("[data-cfg]").forEach((el) => el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => {
    c[el.dataset.cfg] = el.value;
    previaDepois();
  }));
  document.querySelectorAll("[data-visual]").forEach((el) => el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => {
    c.visual[el.dataset.visual] = el.type === "number" ? Number(el.value) : el.value;
    if (el.dataset.visual === "modo") render(); else previaDepois();
  }));
  document.querySelectorAll("[data-campo]").forEach((el) => {
    const evento = el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(evento, () => {
      const campo = c.campos[Number(el.dataset.campo)];
      const prop = el.dataset.prop;
      if (prop === "obrigatorio") campo.obrigatorio = el.checked;
      else if (prop === "opcoes") campo.opcoes = el.value.split("\n").map((x) => x.trim()).filter(Boolean);
      else campo[prop] = el.value;
      if (prop === "tipo") render(); else previaDepois();
    });
  });

  document.getElementById("add-campo").addEventListener("click", () => {
    c.campos.push({ id: "p" + Date.now().toString(36), rotulo: "Nova pergunta", tipo: "texto", obrigatorio: false, opcoes: [] });
    render();
  });
  document.querySelectorAll("[data-remover-campo]").forEach((b) => b.addEventListener("click", () => {
    c.campos.splice(Number(b.dataset.removerCampo), 1);
    render();
  }));
  document.querySelectorAll("[data-mover]").forEach((b) => b.addEventListener("click", () => {
    const i = Number(b.dataset.mover), j = i + Number(b.dataset.dir);
    [c.campos[i], c.campos[j]] = [c.campos[j], c.campos[i]];
    render();
  }));

  const seletorFundo = document.getElementById("previa-fundo");
  seletorFundo.value = fundoPrevia;
  seletorFundo.addEventListener("change", () => { fundoPrevia = seletorFundo.value; atualizarPrevia(); });

  document.getElementById("form-cancelar").addEventListener("click", () => {
    if (!confirm("Voltar sem salvar as mudanças?")) return;
    formEditando = null;
    render();
  });

  document.getElementById("form-salvar").addEventListener("click", async () => {
    const aviso = document.getElementById("aviso-form");
    const falha = (msg) => { aviso.className = "aviso erro"; aviso.textContent = msg; window.scrollTo(0, 0); };
    if (!String(f.nome).trim()) return falha("Dê um nome interno ao formulário.");
    if (c.redirect_url && !/^https:\/\/[^\s]+\.[^\s]+/.test(c.redirect_url)) return falha("O redirect precisa ser um endereço completo começando com https://");
    for (const campo of c.campos) {
      if (!String(campo.rotulo).trim()) return falha("Toda pergunta precisa de um texto.");
      if (["selecao", "opcoes", "multipla"].includes(campo.tipo) && !(campo.opcoes || []).length) {
        return falha(`A pergunta "${campo.rotulo}" precisa de pelo menos uma opção.`);
      }
      if (campo.tipo === "texto" || campo.tipo === "paragrafo") campo.opcoes = [];
    }
    const dados = { nome: String(f.nome).trim(), ativo: !!f.ativo, config: c };
    const res = f.id
      ? await sb.from("formularios").update(dados).eq("id", f.id).select().single()
      : await sb.from("formularios").insert({ ...dados, empresa_id: empresaAtual.id }).select().single();
    if (res.error) return falha("Não deu pra salvar: " + res.error.message);
    await carregarTudo();
    formEditando = null;
    render();
  });

  atualizarPrevia();
}
